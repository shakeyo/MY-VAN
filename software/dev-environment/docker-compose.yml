version: "3.9"

# ============================================================
# VAN-PROJECT 开发环境
# 使用: docker compose up -d
# 包含: Home Assistant + Mosquitto MQTT
# ============================================================

services:
  # ---- Home Assistant ----
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: van-ha-dev
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ha-config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai

  # ---- MQTT Broker ----
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: van-mqtt-dev
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
