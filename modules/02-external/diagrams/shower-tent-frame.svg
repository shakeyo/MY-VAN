<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">淋浴帐框架怎么做 · 4 杆矩形顶框（四面 + 顶）</text>
  <text x="700" y="56" text-anchor="middle" font-size="12.5" fill="#666">左：顶框俯视（1 m = 150 px）｜ 右：侧视（1 m = 150 px）｜ 下：节点与材料选择 ｜ 尺寸单位 mm</text>

  <!-- ═══════════════ A. 顶框俯视 ═══════════════ -->
  <text x="48" y="92" font-size="16" font-weight="bold" fill="#1565c0">A · 顶框俯视：4 根杆 + 4 个角</text>
  <text x="232" y="112" font-size="10.5" fill="#888" text-anchor="middle">↑ 车头方向（平台侧）</text>

  <!-- 平台后横梁 -->
  <rect x="100" y="120" width="265" height="18" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="232" y="134" font-size="10" fill="#fff" text-anchor="middle">3060 后横梁</text>

  <!-- 顶框矩形：1.5 × 1.05 -->
  <rect x="120" y="170" width="225" height="157" fill="#1565c0" fill-opacity="0.07" stroke="none"/>
  <rect x="120" y="170" width="225" height="157" fill="none" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="232" y="252" font-size="11" fill="#1565c0" text-anchor="middle">顶布 1500 × 1050（7° 坡）</text>
  <line x1="232" y1="190" x2="232" y2="310" stroke="#1565c0" stroke-width="1" marker-end="url(#arw)"/>
  <text x="240" y="300" font-size="9" fill="#1565c0">坡向后</text>

  <!-- 前横杆 -->
  <line x1="120" y1="170" x2="345" y2="170" stroke="#263238" stroke-width="7"/>
  <text x="232" y="162" font-size="10.5" fill="#263238" text-anchor="middle">前横杆 2020 1500（固定）</text>
  <!-- 侧臂 -->
  <line x1="120" y1="170" x2="120" y2="327" stroke="#c62828" stroke-width="5"/>
  <line x1="345" y1="170" x2="345" y2="327" stroke="#c62828" stroke-width="5"/>
  <text x="60" y="250" font-size="10.5" fill="#c62828">侧臂 1050</text>
  <text x="60" y="266" font-size="9" fill="#c62828">（摆臂/2020）</text>
  <!-- 后横杆 -->
  <line x1="120" y1="327" x2="345" y2="327" stroke="#263238" stroke-width="7"/>
  <text x="232" y="346" font-size="10.5" fill="#263238" text-anchor="middle">后横杆 2020 1500（可拆/伸缩）</text>

  <!-- 四角 -->
  <circle cx="120" cy="170" r="7" fill="#ef6c00"/>
  <circle cx="345" cy="170" r="7" fill="#ef6c00"/>
  <rect x="113" y="320" width="14" height="14" fill="#6a1b9a"/>
  <rect x="338" y="320" width="14" height="14" fill="#6a1b9a"/>
  <text x="72" y="160" font-size="9" fill="#ef6c00">前角：折叠合页+销</text>
  <text x="72" y="360" font-size="9" fill="#6a1b9a">后角：L 角码+插座</text>

  <!-- 前片拉链 / 后片 / 侧片 -->
  <path d="M130,170 L136,176 L142,170 L148,176 L154,170 L160,176 L166,170 L172,176 L178,170 L184,176 L190,170 L196,176 L202,170 L208,176 L214,170 L220,176 L226,170 L232,176 L238,170 L244,176 L250,170 L256,176 L262,170 L268,176 L274,170 L280,176 L286,170 L292,176 L298,170 L304,176 L310,170 L316,176 L322,170 L328,176 L334,170 L340,176" fill="none" stroke="#8e24aa" stroke-width="1.6"/>
  <text x="232" y="192" font-size="9.5" fill="#8e24aa" text-anchor="middle">前片 U 形拉链（内侧）</text>
  <text x="232" y="318" font-size="9.5" fill="#1565c0" text-anchor="middle">后片（可加 U 形后门）</text>
  <text x="352" y="250" font-size="9.5" fill="#1565c0">侧片 +</text>
  <text x="352" y="266" font-size="9.5" fill="#1565c0">上角纱窗</text>

  <!-- 尺寸 -->
  <line x1="120" y1="104" x2="345" y2="104" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="232" y="100" font-size="11" fill="#333" text-anchor="middle">1500</text>

  <!-- ═══════════════ B. 侧视 ═══════════════ -->
  <line x1="720" y1="70" x2="720" y2="520" stroke="#ddd" stroke-width="1.5"/>
  <text x="750" y="92" font-size="16" font-weight="bold" fill="#1565c0">B · 侧视：顶框 + 四面 + 顶</text>

  <line x1="740" y1="470" x2="1260" y2="470" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M760,430 L760,150 Q760,138 772,138 L1000,138 L1000,430 Z" fill="#ececec" stroke="#333" stroke-width="1.8"/>
  <text x="800" y="240" font-size="10.5" fill="#666">车体</text>
  <rect x="880" y="138" width="160" height="8" fill="#555" stroke="#333" stroke-width="1"/>
  <text x="960" y="132" font-size="9" fill="#444" text-anchor="middle">3060 后横梁</text>

  <!-- 车体到前横杆的挂臂 -->
  <rect x="985" y="146" width="40" height="8" fill="#9e9e9e" stroke="#555" stroke-width="1"/>
  <rect x="1018" y="146" width="8" height="20" fill="#9e9e9e" stroke="#555" stroke-width="1"/>

  <!-- 顶框 -->
  <line x1="1026" y1="166" x2="1180" y2="188" stroke="#c62828" stroke-width="4"/>
  <line x1="1026" y1="166" x2="1026" y2="166" stroke="#263238" stroke-width="8"/>
  <line x1="1180" y1="188" x2="1180" y2="188" stroke="#263238" stroke-width="8"/>
  <text x="1040" y="158" font-size="10" fill="#c62828">摆臂/侧臂（铰接，90°锁）</text>
  <circle cx="1026" cy="166" r="5" fill="#ef6c00"/>
  <circle cx="1180" cy="188" r="5" fill="#263238"/>
  <text x="1190" y="184" font-size="9.5" fill="#263238">后横杆</text>

  <!-- 四面 + 顶 -->
  <polygon points="1026,166 1180,188 1180,470 1026,470" fill="#1565c0" fill-opacity="0.10" stroke="none"/>
  <line x1="1026" y1="166" x2="1180" y2="188" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="1026" y1="166" x2="1026" y2="470" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="1180" y1="188" x2="1180" y2="470" stroke="#1565c0" stroke-width="2.5"/>
  <text x="1040" y="230" font-size="10.5" fill="#1565c0">顶布 + 四面布</text>
  <text x="1040" y="246" font-size="9.5" fill="#1565c0">（前/后/左/右 + 顶）</text>

  <!-- 前片拉链 -->
  <path d="M1026,180 L1031,186 L1026,192 L1031,198 L1026,204 L1031,210 L1026,216 L1031,222 L1026,228 L1031,234 L1026,240 L1031,246 L1026,252 L1031,258 L1026,264 L1031,270 L1026,276 L1031,282 L1026,288 L1031,294 L1026,300 L1031,306 L1026,312 L1031,318 L1026,324 L1031,330 L1026,336 L1031,342 L1026,348 L1031,354 L1026,360 L1031,366 L1026,372 L1031,378 L1026,384 L1031,390 L1026,396 L1031,402 L1026,408 L1031,414 L1026,420 L1031,426 L1026,432 L1031,438 L1026,444 L1031,450 L1026,456 L1031,462" fill="none" stroke="#8e24aa" stroke-width="1.4"/>
  <text x="1040" y="330" font-size="9.5" fill="#8e24aa">前片拉链</text>
  <text x="1040" y="346" font-size="9.5" fill="#8e24aa">（内侧，可卷）</text>

  <!-- 侧片纱窗 -->
  <rect x="1140" y="210" width="26" height="16" fill="#b3e5fc" stroke="#0288d1" stroke-width="1"/>
  <text x="1170" y="224" font-size="8.5" fill="#01579b">纱窗</text>

  <!-- 底部 -->
  <path d="M1028,470 L1028,440 L1178,440 L1178,470" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4"/>
  <text x="1040" y="458" font-size="9.5" fill="#0d47a1">地布/接水盘 + 4 地钉</text>
  <line x1="1026" y1="470" x2="1026" y2="482" stroke="#333" stroke-width="2"/>
  <line x1="1180" y1="470" x2="1180" y2="482" stroke="#333" stroke-width="2"/>

  <!-- 尺寸 -->
  <line x1="740" y1="470" x2="740" y2="150" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="746" y="320" font-size="11" fill="#333" transform="rotate(-90 746 320)">H = 2370</text>
  <line x1="1010" y1="470" x2="1010" y2="166" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="996" y="330" font-size="11" fill="#333" transform="rotate(-90 996 330)">2170</text>
  <line x1="1026" y1="500" x2="1180" y2="500" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1103" y="516" font-size="11" fill="#333" text-anchor="middle">D = 1050</text>
  <line x1="1220" y1="470" x2="1220" y2="188" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1226" y="340" font-size="11" fill="#333" transform="rotate(-90 1226 340)">后高 2020</text>

  <!-- ═══════════════ C. 节点 ═══════════════ -->
  <line x1="40" y1="530" x2="700" y2="530" stroke="#ddd" stroke-width="1.5"/>
  <text x="48" y="556" font-size="15" font-weight="bold" fill="#1565c0">C · 两个关键节点</text>

  <!-- 前角 -->
  <rect x="70" y="590" width="70" height="16" fill="#263238"/>
  <rect x="70" y="590" width="16" height="90" fill="#c62828"/>
  <circle cx="78" cy="598" r="10" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <circle cx="78" cy="598" r="3" fill="#ef6c00"/>
  <text x="60" y="700" font-size="10.5" font-weight="bold" fill="#333">前角：2020 折叠合页 + 弹簧销</text>
  <text x="60" y="718" font-size="9.5" fill="#555">侧臂绕销转 90°；销孔两个位置（收/展）</text>
  <text x="60" y="734" font-size="9.5" fill="#555">合页选承重款；前横杆固定不动</text>

  <!-- 后角 -->
  <rect x="420" y="590" width="70" height="16" fill="#263238"/>
  <rect x="420" y="590" width="16" height="70" fill="#263238"/>
  <path d="M420,590 L490,590 L490,606 L436,606 L436,660 L420,660 Z" fill="#6a1b9a"/>
  <circle cx="470" cy="598" r="4" fill="#fff"/>
  <rect x="490" y="590" width="60" height="16" fill="#c62828"/>
  <text x="410" y="700" font-size="10.5" font-weight="bold" fill="#333">后角：L 角码 + T 螺母 + 插座</text>
  <text x="410" y="718" font-size="9.5" fill="#555">后横杆插进插座，销子/手拧锁；可拆</text>
  <text x="410" y="734" font-size="9.5" fill="#555">L 角码用 T 螺母锁在 2020 槽里</text>

  <!-- ═══════════════ D. 材料选择 ═══════════════ -->
  <line x1="720" y1="530" x2="720" y2="860" stroke="#ddd" stroke-width="1.5"/>
  <text x="750" y="556" font-size="15" font-weight="bold" fill="#1565c0">D · 材料怎么选（横杆铝型材 + 侧臂 L 型折叠臂）</text>

  <rect x="750" y="575" width="600" height="100" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  <text x="766" y="598" font-size="11" font-weight="bold" fill="#333">A. 2020/2525 铝型材 + 折叠合页 + L 角码</text>
  <text x="766" y="618" font-size="10" fill="#444">横杆 2020；侧臂 2020 + 90° 折叠合页 + 45° 斜撑；后横杆可拆</text>
  <text x="766" y="636" font-size="10" fill="#444">刚性好、T 槽好装；重 2–2.5 kg；框架 500–800 元 ｜ 推荐 DIY</text>
  <text x="766" y="654" font-size="9.5" fill="#c62828">注意：侧臂不能只靠合页悬挑，必须加 45° 斜撑或选摆臂</text>

  <rect x="750" y="685" width="600" height="80" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  <text x="766" y="708" font-size="11" font-weight="bold" fill="#333">B. 25×2 铝管 + 铸铝 L 型折叠角件</text>
  <text x="766" y="728" font-size="10" fill="#444">轻、便宜（300–500）；折叠方便；刚性一般，必须加斜撑</text>
  <text x="766" y="746" font-size="10" fill="#444">适合预算/轻量；四面+顶不建议</text>

  <rect x="750" y="775" width="600" height="70" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
  <text x="766" y="798" font-size="11" font-weight="bold" fill="#8d6e00">C. 遮阳棚摆臂 + 2020 横杆（四面+顶最稳）</text>
  <text x="766" y="818" font-size="10" fill="#444">摆臂 = 现成的 L 型折叠承重臂，带锁/撑；600–900 元</text>
  <text x="766" y="836" font-size="9.5" fill="#c62828">别用墙上折叠桌那种薄 L 型托架当主结构（会弯/滑）</text>
</svg>
