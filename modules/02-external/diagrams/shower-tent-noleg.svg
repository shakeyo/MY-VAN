<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">车尾横向淋浴帐 · 无立腿版（4 杆矩形顶框 + 底撑杆；斜撑可选）</text>
  <text x="700" y="56" text-anchor="middle" font-size="12.5" fill="#666">左：侧视 1 m = 200 px ｜ 右：俯视 1 m = 120 px ｜ 尺寸单位 mm ｜ 以 M1=2370 为例</text>

  <!-- ═══════════════ A. 侧视 ═══════════════ -->
  <text x="48" y="92" font-size="16" font-weight="bold" fill="#1565c0">A · 侧视（无落地立腿）</text>
  <line x1="40" y1="700" x2="700" y2="700" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="48" y="724" font-size="11" fill="#888">地面（停车位）</text>

  <path d="M80,660 L80,230 Q80,214 96,214 L380,214 L380,660 Z" fill="#ececec" stroke="#333" stroke-width="2"/>
  <circle cx="160" cy="660" r="34" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="160" cy="660" r="15" fill="#bbb"/>
  <circle cx="330" cy="660" r="34" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="330" cy="660" r="15" fill="#bbb"/>
  <line x1="330" y1="300" x2="380" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="252" y="322" font-size="10.5" fill="#777">后门顶 2000（斜撑反撑点）</text>
  <text x="150" y="420" font-size="12" fill="#666">V80 长轴中顶</text>
  <text x="150" y="438" font-size="10.5" fill="#999">5490 × 1998 × 2345</text>

  <rect x="180" y="214" width="210" height="12" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="196" y="205" font-size="10.5" fill="#444">3060 车顶平台后横梁</text>
  <path d="M344,226 L354,226 L354,238 L410,238 L410,266 L398,266 L398,250 L344,250 Z" fill="#9e9e9e" stroke="#555" stroke-width="1.5"/>
  <text x="206" y="362" font-size="10.5" fill="#555">不锈钢挂臂（下探 200）</text>
  <text x="206" y="378" font-size="9.5" fill="#777">挂点再后退 100–150</text>
  <rect x="404" y="266" width="14" height="10" rx="2" fill="#455a64" stroke="#263238" stroke-width="1.2"/>
  <text x="436" y="298" font-size="10.5" fill="#455a64">挂轨（C 型 / keder）</text>

  <polygon points="410,266 630,298 630,700 410,700" fill="#1565c0" fill-opacity="0.08" stroke="none"/>
  <line x1="410" y1="266" x2="630" y2="298" stroke="#c62828" stroke-width="3.5"/>
  <text x="452" y="248" font-size="11" fill="#c62828">侧杆 ×2（1.2 m，7° 下倾）</text>
  <circle cx="630" cy="298" r="5" fill="#c62828"/>
  <text x="640" y="318" font-size="10.5" fill="#c62828">后横杆 1.6 m（T 形块）</text>
  <line x1="410" y1="266" x2="410" y2="700" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="630" y1="298" x2="630" y2="700" stroke="#1565c0" stroke-width="2.5"/>
  <text x="420" y="470" font-size="11" fill="#1565c0">布体（420D PU / 黑胶）</text>
  <text x="420" y="486" font-size="10" fill="#1565c0">顶 + 后 + 左右 + 前（前片可卷）</text>

  <line x1="382" y1="308" x2="626" y2="302" stroke="#ef6c00" stroke-width="2.5" stroke-dasharray="7 4"/>
  <circle cx="382" cy="308" r="4" fill="#ef6c00"/>
  <circle cx="626" cy="302" r="4" fill="#ef6c00"/>
  <text x="430" y="332" font-size="10.5" fill="#ef6c00">可选斜撑 ×2：后门顶 → 后上角（不加也能用，加了更抗风）</text>

  <line x1="600" y1="700" x2="660" y2="700" stroke="#c62828" stroke-width="4"/>
  <rect x="656" y="690" width="18" height="10" fill="#ef6c00"/>
  <text x="430" y="724" font-size="10.5" fill="#c62828">后底撑杆 1.6 m + 地钉/水袋</text>

  <path d="M412,700 L412,664 L628,664 L628,700" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <circle cx="618" cy="694" r="3.5" fill="#1565c0"/>
  <text x="430" y="682" font-size="10.5" fill="#0d47a1">接水盘 1550×1150×100（下摆入盘）</text>

  <line x1="60" y1="700" x2="60" y2="226" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="66" y="460" font-size="12" fill="#333" transform="rotate(-90 66 460)">H = 2370（M1 实测）</text>
  <line x1="110" y1="700" x2="110" y2="266" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="116" y="470" font-size="12" fill="#333" transform="rotate(-90 116 470)">挂轨 Hr = 2170</text>
  <line x1="410" y1="742" x2="630" y2="742" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <line x1="410" y1="704" x2="410" y2="752" stroke="#555" stroke-width="0.8"/>
  <line x1="630" y1="704" x2="630" y2="752" stroke="#555" stroke-width="0.8"/>
  <text x="500" y="762" font-size="12" fill="#333">D = 1100</text>
  <line x1="700" y1="700" x2="700" y2="298" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="708" y="500" font-size="12" fill="#333" transform="rotate(-90 708 500)">后净高 2010</text>

  <!-- ═══════════════ B. 俯视 ═══════════════ -->
  <line x1="720" y1="70" x2="720" y2="860" stroke="#ddd" stroke-width="1.5"/>
  <text x="760" y="92" font-size="16" font-weight="bold" fill="#1565c0">B · 俯视（无腿，靠顶框 + 斜撑 + 底撑 + 底锚）</text>

  <text x="880" y="118" font-size="11" fill="#888" text-anchor="middle">↑ 车头方向</text>
  <rect x="760" y="100" width="240" height="380" fill="#ececec" stroke="#333" stroke-width="2"/>
  <rect x="780" y="170" width="200" height="300" fill="#e0e0e0" stroke="#616161" stroke-width="1.5"/>
  <text x="880" y="164" font-size="10.5" fill="#444" text-anchor="middle">车顶平台 1600 宽</text>
  <rect x="800" y="200" width="160" height="160" fill="#bbdefb" stroke="#64b5f6" stroke-width="1.2"/>
  <text x="880" y="285" font-size="10.5" fill="#1565c0" text-anchor="middle">太阳能板（示意）</text>
  <rect x="780" y="455" width="200" height="15" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="880" y="449" font-size="10.5" fill="#333" text-anchor="middle">3060 后横梁</text>
  <rect x="788" y="472" width="184" height="14" fill="none" stroke="#6a1b9a" stroke-width="1.6" stroke-dasharray="5 3"/>
  

  <!-- 尾门顶锚点 -->
  <rect x="784" y="476" width="12" height="12" fill="#ef6c00"/>
  <rect x="964" y="476" width="12" height="12" fill="#ef6c00"/>
  <text x="880" y="492" font-size="9.5" fill="#ef6c00" text-anchor="middle">后门顶锚点（2 个）</text>

  <!-- 顶框 -->
  <rect x="790" y="496" width="180" height="8" fill="#455a64" stroke="#263238" stroke-width="1"/>
  <text x="880" y="512" font-size="10.5" fill="#455a64" text-anchor="middle">挂轨 1500（前横杆，固定）</text>
  <line x1="800" y1="498" x2="800" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <line x1="960" y1="498" x2="960" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <line x1="784" y1="630" x2="976" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <text x="880" y="624" font-size="10.5" fill="#c62828" text-anchor="middle">后横杆 1600（顶框后沿）</text>

  <!-- 斜撑 -->
  <line x1="790" y1="488" x2="784" y2="630" stroke="#ef6c00" stroke-width="2.5" stroke-dasharray="7 4"/>
  <line x1="970" y1="488" x2="976" y2="630" stroke="#ef6c00" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="978" y="600" font-size="10.5" fill="#ef6c00">可选斜撑 ×2</text>
  <text x="978" y="616" font-size="9.5" fill="#ef6c00">（门顶→后角，选配）</text>

  <!-- 布/盘 -->
  <rect x="790" y="498" width="180" height="132" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="2.5"/>
  <rect x="787" y="506" width="186" height="118" fill="none" stroke="#0d47a1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="880" y="575" font-size="10.5" fill="#0d47a1" text-anchor="middle">接水盘 1550×1150（虚线）</text>

  <!-- 底撑杆/锚点 -->
  <line x1="784" y1="640" x2="976" y2="640" stroke="#c62828" stroke-width="3" stroke-dasharray="5 3"/>
  <rect x="778" y="646" width="10" height="10" fill="#ef6c00"/>
  <rect x="972" y="646" width="10" height="10" fill="#ef6c00"/>
  <text x="880" y="680" font-size="10" fill="#c62828" text-anchor="middle">底撑杆 1600 + 地钉/水袋</text>
  <text x="770" y="660" font-size="10" fill="#333">无立腿</text>

  <!-- 可选拉绳 -->
  <line x1="784" y1="630" x2="756" y2="694" stroke="#757575" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="976" y1="630" x2="1004" y2="694" stroke="#757575" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="770" y="690" font-size="9.5" fill="#757575">可选拉绳</text>

  <!-- 尺寸 -->
  <line x1="790" y1="704" x2="970" y2="704" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="880" y="722" font-size="12" fill="#333" text-anchor="middle">W = 1500（布宽）</text>
  <line x1="1020" y1="498" x2="1020" y2="630" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1026" y="570" font-size="12" fill="#333" transform="rotate(-90 1026 570)">D = 1100</text>

  <!-- 说明 -->
  <rect x="1044" y="150" width="320" height="180" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  <text x="1062" y="176" font-size="12.5" font-weight="bold" fill="#333">无腿版的力怎么走</text>
  <text x="1062" y="200" font-size="10" fill="#444">后向风 → 后片 → 后横杆</text>
  <text x="1062" y="218" font-size="10" fill="#444">→ 2 根斜撑（可选）→ 后门顶</text>
  <text x="1062" y="242" font-size="10" fill="#444">布面竖向重量 → 2 侧杆</text>
  <text x="1062" y="260" font-size="10" fill="#444">→ 挂臂 → 3060 平台</text>
  <text x="1062" y="284" font-size="10" fill="#444">后片下摆 → 底撑杆</text>
  <text x="1062" y="302" font-size="10" fill="#444">→ 2 个地钉 / 10 L 水袋（硬地）</text>
  <text x="1062" y="322" font-size="9.5" fill="#c62828">基础版：4 杆框 + 底钉；加强：+2 斜撑（门顶）</text>

  <rect x="1044" y="350" width="320" height="190" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
  <text x="1062" y="376" font-size="12.5" font-weight="bold" fill="#8d6e00">成本速记（2026 电商参考）</text>
  <text x="1062" y="400" font-size="10" fill="#444">成品 500–600：只含帐体/布/简单框架/袋</text>
  <text x="1062" y="420" font-size="10" fill="#444">极简版（对标成品）：600–900</text>
  <text x="1062" y="440" font-size="10" fill="#444">耐用版（420D/铝杆/不锈钢）：1 200–1 800</text>
  <text x="1062" y="458" font-size="10" fill="#444">含接水/灰水/花洒：+400–600</text>
  <text x="1062" y="480" font-size="10" fill="#444">成品 + 横向转接：650–900</text>
  <text x="1062" y="498" font-size="10" fill="#444">（基础就是 4 杆框；斜撑选配）</text>
  <text x="1062" y="522" font-size="9.5" fill="#c62828">自己做主要图贴合/可修；极简版和成品同级</text>
</svg>
