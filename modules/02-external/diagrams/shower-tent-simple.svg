<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">车尾横向淋浴帐 · 4 杆框 + 三面帘（无腿版）</text>
  <text x="700" y="56" text-anchor="middle" font-size="12.5" fill="#666">参考你发的侧挂成品：4 杆矩形框 + 布帘 + 车体当一面墙 ｜ 尺寸单位 mm ｜ 以 M1=2370 为例</text>

  <!-- ═══════════════ A. 侧视 ═══════════════ -->
  <text x="48" y="92" font-size="16" font-weight="bold" fill="#1565c0">A · 侧视（无腿 / 无斜撑 / 顶部开放）</text>
  <line x1="40" y1="700" x2="700" y2="700" stroke="#999" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="48" y="724" font-size="11" fill="#888">地面（停车位）</text>

  <path d="M80,660 L80,230 Q80,214 96,214 L380,214 L380,660 Z" fill="#ececec" stroke="#333" stroke-width="2"/>
  <circle cx="160" cy="660" r="34" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="160" cy="660" r="15" fill="#bbb"/>
  <circle cx="330" cy="660" r="34" fill="#444" stroke="#222" stroke-width="2"/>
  <circle cx="330" cy="660" r="15" fill="#bbb"/>
  <line x1="330" y1="300" x2="380" y2="300" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="252" y="322" font-size="10.5" fill="#777">后门顶 2000</text>
  <text x="150" y="420" font-size="12" fill="#666">V80 长轴中顶</text>
  <text x="150" y="438" font-size="10.5" fill="#999">5490 × 1998 × 2345</text>
  <text x="228" y="520" font-size="10.5" fill="#333">车体 = 第四面墙</text>
  <text x="228" y="536" font-size="9.5" fill="#777">（尾门关闭，靠车面不挂布）</text>

  <rect x="180" y="214" width="210" height="12" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="196" y="205" font-size="10.5" fill="#444">3060 车顶平台后横梁</text>
  <path d="M344,226 L354,226 L354,238 L410,238 L410,266 L398,266 L398,250 L344,250 Z" fill="#9e9e9e" stroke="#555" stroke-width="1.5"/>
  <text x="206" y="362" font-size="10.5" fill="#555">不锈钢挂臂（下探 120–150）</text>
  <rect x="404" y="266" width="14" height="10" rx="2" fill="#455a64" stroke="#263238" stroke-width="1.2"/>

  <!-- 三面帘：侧片（蓝色梯形） -->
  <polygon points="410,266 630,298 630,700 410,700" fill="#1565c0" fill-opacity="0.10" stroke="none"/>
  <line x1="410" y1="266" x2="630" y2="298" stroke="#c62828" stroke-width="3.5"/>
  <text x="452" y="248" font-size="11" fill="#c62828">侧臂 ×2（1.05 m）</text>
  <circle cx="630" cy="298" r="5" fill="#c62828"/>
  <text x="640" y="318" font-size="10.5" fill="#c62828">后横杆 1.5 m</text>
  <line x1="410" y1="266" x2="410" y2="700" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="630" y1="298" x2="630" y2="700" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="470" font-size="11" fill="#1565c0">三面帘：外片 + 左右侧片</text>
  <text x="430" y="486" font-size="10" fill="#1565c0">靠车面不挂布（车体当墙）</text>
  <line x1="412" y1="266" x2="412" y2="700" stroke="#8e24aa" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="418" y="620" font-size="9.5" fill="#8e24aa">侧片前边贴/绑车体</text>

  <!-- 顶部开放 -->
  <text x="520" y="316" font-size="10.5" fill="#ef6c00">顶部开放</text>
  <line x1="540" y1="322" x2="540" y2="340" stroke="#ef6c00" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="520" y="354" font-size="9.5" fill="#ef6c00">可加 1.5×1.1 防雨片（选配）</text>
  <path d="M410,266 L630,298" fill="none" stroke="#ef6c00" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- 底部 -->
  <path d="M412,700 L412,664 L628,664 L628,700" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6"/>
  <circle cx="618" cy="694" r="3.5" fill="#1565c0"/>
  <text x="430" y="682" font-size="10.5" fill="#0d47a1">地布 / 接水盘（选配），下摆入内</text>
  <line x1="410" y1="700" x2="410" y2="712" stroke="#333" stroke-width="2"/>
  <line x1="630" y1="700" x2="630" y2="712" stroke="#333" stroke-width="2"/>
  <text x="456" y="736" font-size="10.5" fill="#333">下摆配重 300–500 g + 4 地钉（无底撑杆）</text>

  <!-- 尺寸 -->
  <line x1="60" y1="700" x2="60" y2="226" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="66" y="460" font-size="12" fill="#333" transform="rotate(-90 66 460)">H = 2370（M1 实测）</text>
  <line x1="110" y1="700" x2="110" y2="266" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="116" y="470" font-size="12" fill="#333" transform="rotate(-90 116 470)">挂轨 Hr = 2170</text>
  <line x1="410" y1="742" x2="630" y2="742" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="500" y="762" font-size="12" fill="#333">D = 1000–1100</text>
  <line x1="700" y1="700" x2="700" y2="298" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="708" y="500" font-size="12" fill="#333" transform="rotate(-90 708 500)">后净高 2010</text>

  <!-- ═══════════════ B. 俯视 ═══════════════ -->
  <line x1="720" y1="70" x2="720" y2="860" stroke="#ddd" stroke-width="1.5"/>
  <text x="760" y="92" font-size="16" font-weight="bold" fill="#1565c0">B · 俯视（4 杆框 + 三面帘 + 车体当第四面）</text>

  <text x="880" y="118" font-size="11" fill="#888" text-anchor="middle">↑ 车头方向</text>
  <rect x="760" y="100" width="240" height="380" fill="#ececec" stroke="#333" stroke-width="2"/>
  <rect x="780" y="170" width="200" height="300" fill="#e0e0e0" stroke="#616161" stroke-width="1.5"/>
  <text x="880" y="164" font-size="10.5" fill="#444" text-anchor="middle">车顶平台 1600 宽</text>
  <rect x="800" y="200" width="160" height="160" fill="#bbdefb" stroke="#64b5f6" stroke-width="1.2"/>
  <text x="880" y="285" font-size="10.5" fill="#1565c0" text-anchor="middle">太阳能板（示意）</text>
  <rect x="780" y="455" width="200" height="15" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="880" y="449" font-size="10.5" fill="#333" text-anchor="middle">3060 后横梁</text>
  <text x="880" y="492" font-size="9.5" fill="#333" text-anchor="middle">车体 = 第四面墙（尾门关闭）</text>

  <!-- 前横杆/挂轨 -->
  <rect x="790" y="496" width="180" height="8" fill="#455a64" stroke="#263238" stroke-width="1"/>
  <text x="880" y="512" font-size="10.5" fill="#455a64" text-anchor="middle">前横杆/挂轨 1500（固定）</text>

  <!-- 4 杆框 -->
  <line x1="800" y1="498" x2="800" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <line x1="960" y1="498" x2="960" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <line x1="784" y1="630" x2="976" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <text x="880" y="624" font-size="10.5" fill="#c62828" text-anchor="middle">后横杆 1500</text>

  <!-- 三面帘：U 形（外片 + 左右侧片），靠车面不挂布 -->
  <polyline points="790,498 790,630 970,630 970,498" fill="none" stroke="#1565c0" stroke-width="5"/>
  <text x="880" y="575" font-size="10.5" fill="#0d47a1" text-anchor="middle">三面帘（外片 + 左右侧片）</text>
  <text x="880" y="592" font-size="9.5" fill="#0d47a1" text-anchor="middle">靠车面不挂布 = 车体墙</text>

  <!-- 防雨片（选配） -->
  <rect x="790" y="498" width="180" height="132" fill="#1565c0" fill-opacity="0.05" stroke="#ef6c00" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="880" y="540" font-size="9.5" fill="#ef6c00" text-anchor="middle">可选防雨片 1500×1100</text>

  <!-- 底部 -->
  <rect x="787" y="640" width="186" height="20" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.2"/>
  <text x="880" y="680" font-size="10" fill="#333" text-anchor="middle">地布/接水盘 + 下摆压重 + 4 地钉（无底撑杆）</text>

  <!-- 尺寸 -->
  <line x1="790" y1="704" x2="970" y2="704" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="880" y="722" font-size="12" fill="#333" text-anchor="middle">W = 1500（布宽）</text>
  <line x1="1020" y1="498" x2="1020" y2="630" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1026" y="570" font-size="12" fill="#333" transform="rotate(-90 1026 570)">D = 1000–1100</text>

  <!-- 说明 -->
  <rect x="1044" y="150" width="320" height="170" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  <text x="1062" y="176" font-size="12.5" font-weight="bold" fill="#333">为什么没有腿/斜撑</text>
  <text x="1062" y="200" font-size="10" fill="#444">4 杆框四角锁死 = 刚体矩形</text>
  <text x="1062" y="218" font-size="10" fill="#444">2 侧臂只悬挑 1.0–1.1 m，布很轻</text>
  <text x="1062" y="236" font-size="10" fill="#444">车体当第四面墙，只挂三面布</text>
  <text x="1062" y="254" font-size="10" fill="#444">底部配重/地钉把布面拉住</text>
  <text x="1062" y="278" font-size="9.5" fill="#c62828">风大/硬地再逐项加斜撑、前片、腿</text>

  <rect x="1044" y="340" width="320" height="200" rx="6" fill="#fff8e1" stroke="#f9a825" stroke-width="1.2"/>
  <text x="1062" y="366" font-size="12.5" font-weight="bold" fill="#8d6e00">成本速记（对标成品）</text>
  <text x="1062" y="390" font-size="10" fill="#444">基础版（4 杆 + 三面帘 + 袋 + 地钉）</text>
  <text x="1062" y="408" font-size="12" font-weight="bold" fill="#c62828">600–1 100</text>
  <text x="1062" y="432" font-size="10" fill="#444">+ 防雨片：+100–200</text>
  <text x="1062" y="450" font-size="10" fill="#444">+ 接水盘/灰水/花洒：+400–600</text>
  <text x="1062" y="468" font-size="10" fill="#444">+ 斜撑 2 根：+120–200</text>
  <text x="1062" y="486" font-size="10" fill="#444">+ 前片/立腿：+250–450</text>
  <text x="1062" y="510" font-size="10" fill="#444">成品 + 横向转接：650–900</text>
  <text x="1062" y="530" font-size="9.5" fill="#666">图里成品 500–600；自己做基础版同档</text>
</svg>
