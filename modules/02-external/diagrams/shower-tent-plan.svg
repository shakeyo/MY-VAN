<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">车尾横向淋浴帐 · 俯视与后视</text>
  <text x="700" y="56" text-anchor="middle" font-size="12.5" fill="#666">左：俯视 1 m = 120 px ｜ 右：后视 1 m = 150 px ｜ 尺寸单位 mm</text>

  <!-- ═══════════════════ A. 俯视 ═══════════════════ -->
  <text x="48" y="92" font-size="16" font-weight="bold" fill="#1565c0">A · 俯视（展开）—— 看清「尾门 / 侧片 / 前片」三者的位置关系</text>
  <text x="200" y="118" font-size="11" fill="#888" text-anchor="middle">↑ 车头方向</text>

  <!-- 车体 -->
  <rect x="100" y="100" width="240" height="380" fill="#ececec" stroke="#333" stroke-width="2"/>
  <!-- 平台 -->
  <rect x="120" y="170" width="200" height="300" fill="#e0e0e0" stroke="#616161" stroke-width="1.5"/>
  <text x="220" y="164" font-size="10.5" fill="#444" text-anchor="middle">车顶平台 1600 宽</text>
  <rect x="140" y="200" width="160" height="160" fill="#bbdefb" stroke="#64b5f6" stroke-width="1.2"/>
  <text x="220" y="285" font-size="10.5" fill="#1565c0" text-anchor="middle">太阳能板（示意）</text>
  <!-- 后横梁 -->
  <rect x="120" y="455" width="200" height="15" fill="#555" stroke="#333" stroke-width="1.2"/>
  <text x="220" y="449" font-size="10.5" fill="#333" text-anchor="middle">3060 后横梁</text>
  <!-- 收纳袋（梁下，俯视被遮，虚线） -->
  <rect x="128" y="472" width="184" height="14" fill="none" stroke="#6a1b9a" stroke-width="1.6" stroke-dasharray="5 3"/>

  <!-- 尾门开启弧线 -->
  <path d="M220,480 Q310,480 310,570" fill="none" stroke="#ef6c00" stroke-width="1.4" stroke-dasharray="5 4"/>
  <path d="M220,480 Q130,480 130,570" fill="none" stroke="#ef6c00" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="310" y1="480" x2="310" y2="570" stroke="#ef6c00" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="130" y1="480" x2="130" y2="570" stroke="#ef6c00" stroke-width="1.2" stroke-dasharray="3 3"/>


  <!-- 挂轨 -->
  <rect x="130" y="496" width="180" height="8" fill="#455a64" stroke="#263238" stroke-width="1"/>
  <text x="220" y="512" font-size="10.5" fill="#455a64" text-anchor="middle">挂轨 1500（横向）</text>

  <!-- 布体 footprint -->
  <rect x="130" y="498" width="180" height="132" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="2.5"/>
  <rect x="127" y="506" width="186" height="118" fill="none" stroke="#0d47a1" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="220" y="575" font-size="10.5" fill="#0d47a1" text-anchor="middle">接水盘 1550×1150（虚线）</text>

  <!-- 顶臂 / 后横杆 / 立腿 -->
  <line x1="140" y1="498" x2="140" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <line x1="300" y1="498" x2="300" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <line x1="124" y1="630" x2="316" y2="630" stroke="#c62828" stroke-width="3.5"/>
  <rect x="118" y="624" width="12" height="12" fill="#c62828"/>
  <rect x="310" y="624" width="12" height="12" fill="#c62828"/>
  <text x="220" y="648" font-size="10.5" fill="#c62828" text-anchor="middle">后横杆 1600（伸缩，两端挂立腿）</text>
  <text x="146" y="590" font-size="10" fill="#c62828">顶臂</text>
  <text x="306" y="590" font-size="10" fill="#c62828">顶臂</text>
  <text x="318" y="664" font-size="10" fill="#c62828">立腿 ×2</text>

  <!-- 拉绳 -->
  <line x1="124" y1="630" x2="100" y2="690" stroke="#757575" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="316" y1="630" x2="340" y2="690" stroke="#757575" stroke-width="1.5" stroke-dasharray="5 4"/>
  <polygon points="96,688 104,690 100,696" fill="#757575"/>
  <polygon points="336,688 344,690 340,696" fill="#757575"/>

  <!-- 前片 -->
  <line x1="130" y1="498" x2="310" y2="498" stroke="#8e24aa" stroke-width="3"/>
  <line x1="108" y1="520" x2="130" y2="500" stroke="#8e24aa" stroke-width="0.8"/>
  <text x="44" y="528" font-size="10" fill="#8e24aa">前片（可卷起）</text>

  <!-- 尺寸 -->
  <line x1="130" y1="678" x2="310" y2="678" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <line x1="130" y1="634" x2="130" y2="688" stroke="#555" stroke-width="0.8"/>
  <line x1="310" y1="634" x2="310" y2="688" stroke="#555" stroke-width="0.8"/>
  <text x="220" y="696" font-size="12" fill="#333" text-anchor="middle">W = 1500（布宽）</text>

  <text x="48" y="792" font-size="10.5" fill="#ef6c00">橙虚线 = 尾门 90° 开启弧线：前片放下时，尾门只能开一条缝</text>
  <text x="48" y="812" font-size="10.5" fill="#8e24aa">要开门连通车内：先把前片卷起；门扇落到侧片位置，侧片外留 30–50 mm</text>
  <text x="48" y="832" font-size="10.5" fill="#6a1b9a">紫虚线 = 梁下收纳袋 1550；灰虚线 = 斜拉绳 + 地钉；红杆 = 顶臂 / 立腿 / 后横杆</text>
  <text x="48" y="852" font-size="10.5" fill="#333">臂距 1300；腿距 1600；盘 1550；布 1500（W ≤ 尾门铰链间距 − 50）</text>

  <line x1="360" y1="498" x2="360" y2="630" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="366" y="570" font-size="12" fill="#333" transform="rotate(-90 366 570)">D = 1100</text>

  <line x1="318" y1="480" x2="318" y2="498" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="322" y="492" font-size="9" fill="#555">150</text>

  <!-- 说明框 -->
  <rect x="380" y="620" width="320" height="150" rx="6" fill="#fafafa" stroke="#bbb" stroke-width="1.2"/>
  <text x="396" y="644" font-size="12" font-weight="bold" fill="#333">4 根杆的分工（+1 根横杆）</text>
  <text x="396" y="666" font-size="10.5" fill="#444">顶臂 ×2：挂轨 → 后方 1.2 m，托顶布、决定进深</text>
  <text x="396" y="686" font-size="10.5" fill="#444">立腿 ×2：顶臂末端 → 地面 2.0 m，承重 + 定位</text>
  <text x="396" y="706" font-size="10.5" fill="#444">后横杆 ×1：撑开两顶臂，藏顶布后沿，常驻不拆</text>
  <text x="396" y="726" font-size="10.5" fill="#444">斜拉绳 ×2：抗风主力；5 级以上收帐</text>
  <text x="396" y="750" font-size="10" fill="#c62828">杆是“撑形状”的，抗风靠拉绳 + 地钉 + 车体挡风</text>

  <!-- ═══════════════════ B. 后视 ═══════════════════ -->
  <line x1="740" y1="70" x2="740" y2="860" stroke="#ddd" stroke-width="1.5"/>
  <text x="766" y="92" font-size="16" font-weight="bold" fill="#6a1b9a">B · 后视（收纳袋 / 展开布体轮廓）</text>

  <!-- 平台 + 袋 -->
  <rect x="840" y="340" width="320" height="12" fill="#555" stroke="#333" stroke-width="1"/>
  <rect x="880" y="352" width="240" height="30" rx="12" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2.2"/>
  <line x1="846" y1="350" x2="880" y2="367" stroke="#6a1b9a" stroke-width="0.8"/>
  <text x="766" y="342" font-size="10" fill="#6a1b9a">收纳袋（梁下）</text>
  <text x="766" y="356" font-size="10" fill="#6a1b9a">1600 × 180</text>

  <!-- 车体 -->
  <rect x="850" y="355" width="300" height="345" fill="#ececec" stroke="#333" stroke-width="2"/>
  <line x1="850" y1="370" x2="1150" y2="370" stroke="#888" stroke-width="1"/>
  <!-- 尾门 -->
  <rect x="880" y="370" width="120" height="305" fill="#f5f5f5" stroke="#666" stroke-width="1.2"/>
  <rect x="1000" y="370" width="120" height="305" fill="#f5f5f5" stroke="#666" stroke-width="1.2"/>
  <line x1="1000" y1="370" x2="1000" y2="675" stroke="#666" stroke-width="2"/>
  <rect x="985" y="390" width="30" height="8" fill="#c62828"/>

  <!-- 尾窗 -->
  <rect x="895" y="390" width="90" height="70" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/>
  <rect x="1015" y="390" width="90" height="70" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1"/>
  <!-- 牌照 + 摄像头 + 拉手 -->
  <rect x="970" y="655" width="60" height="28" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="1000" y="674" font-size="9" fill="#333" text-anchor="middle">牌照</text>
  <circle cx="1000" cy="645" r="4" fill="#333"/>
  <text x="1010" y="648" font-size="9" fill="#555">摄像头</text>
  <rect x="890" y="600" width="10" height="40" rx="3" fill="#999"/>
  <rect x="1090" y="600" width="10" height="40" rx="3" fill="#999"/>

  <!-- 尾梯 -->
  <line x1="1130" y1="350" x2="1130" y2="690" stroke="#333" stroke-width="4"/>
  <line x1="1155" y1="350" x2="1155" y2="690" stroke="#333" stroke-width="4"/>
  <line x1="1130" y1="390" x2="1155" y2="390" stroke="#333" stroke-width="3"/>
  <line x1="1130" y1="450" x2="1155" y2="450" stroke="#333" stroke-width="3"/>
  <line x1="1130" y1="510" x2="1155" y2="510" stroke="#333" stroke-width="3"/>
  <line x1="1130" y1="570" x2="1155" y2="570" stroke="#333" stroke-width="3"/>
  <line x1="1130" y1="630" x2="1155" y2="630" stroke="#333" stroke-width="3"/>
  <text x="1120" y="718" font-size="10" fill="#333">尾梯（避让）</text>

  <!-- 展开布体轮廓 -->
  <rect x="887" y="400" width="225" height="300" fill="none" stroke="#1565c0" stroke-width="2" stroke-dasharray="7 4"/>
  <line x1="879" y1="400" x2="879" y2="700" stroke="#c62828" stroke-width="3"/>
  <line x1="1119" y1="400" x2="1119" y2="700" stroke="#c62828" stroke-width="3"/>
  <line x1="879" y1="400" x2="1119" y2="400" stroke="#c62828" stroke-width="3"/>
  <text x="930" y="396" font-size="10" fill="#c62828">后横杆</text>

  <!-- U 形门 / 窗 -->
  <rect x="930" y="420" width="140" height="250" fill="none" stroke="#1565c0" stroke-width="1.6" stroke-dasharray="4 3"/>
  <text x="1000" y="460" font-size="10" fill="#1565c0" text-anchor="middle">后片 U 形拉链门</text>
  <rect x="895" y="400" width="40" height="24" fill="#b3e5fc" stroke="#0288d1" stroke-width="1"/>
  <rect x="1055" y="400" width="40" height="24" fill="#b3e5fc" stroke="#0288d1" stroke-width="1"/>
  <text x="940" y="434" font-size="9" fill="#01579b">左右上角纱窗 + 雨檐</text>

  <!-- 尺寸 -->
  <line x1="850" y1="310" x2="1150" y2="310" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1000" y="304" font-size="11" fill="#333" text-anchor="middle">车宽 1998</text>
  <line x1="880" y1="330" x2="1120" y2="330" stroke="#6a1b9a" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1000" y="324" font-size="9.5" fill="#6a1b9a" text-anchor="middle">袋长 1600</text>
  <line x1="887" y1="730" x2="1112" y2="730" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1000" y="748" font-size="12" fill="#333" text-anchor="middle">W = 1500</text>
  <line x1="820" y1="700" x2="820" y2="400" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="814" y="545" font-size="12" fill="#333" text-anchor="middle" transform="rotate(-90 814 545)">后净高 2010</text>
  <line x1="1190" y1="700" x2="1190" y2="382" stroke="#555" stroke-width="1" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1196" y="545" font-size="12" fill="#333" transform="rotate(-90 1196 545)">袋底 2170</text>

  <!-- 底部说明 -->
  <text x="766" y="790" font-size="11" fill="#666">收纳状态：袋底 2 170 mm，高于后门顶 2 000 mm 约 170 mm——不遮刹车灯/摄像头/牌照灯，也不影响尾门开闭。</text>
  <text x="766" y="810" font-size="11" fill="#666">展开状态：前片放下 = 淋浴模式（尾门只开一条缝）；要开尾门连通车内，先把前片卷起，门扇 90° 后落在侧片位置。</text>
  <text x="766" y="830" font-size="11" fill="#666">侧片与门扇之间留 30–50 mm；若实测门铰间距不足，W 缩到 1 400（W ≤ 铰链间距 − 50）。</text>
</svg>
