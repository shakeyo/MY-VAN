<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#546e7a"/>
    </marker>
    <marker id="arwo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef6c00"/>
    </marker>
  </defs>
  <style>
    .prof{fill:#cfd8dc;stroke:#78909c;stroke-width:1.2}
    .prof2{fill:#eceff1;stroke:#90a4ae;stroke-width:1;stroke-dasharray:4 3}
    .hang{fill:#455a64}
    .bag{fill:#546e7a;stroke:#37474f;stroke-width:1.4}
    .fabric{fill:#1565c0;fill-opacity:.08;stroke:#1565c0;stroke-width:1.2;stroke-dasharray:5 4}
    .dim{stroke:#546e7a;stroke-width:1}
    .dimO{stroke:#ef6c00;stroke-width:1.1}
    .lbl{font-size:9px;fill:#455a64}
    .lblS{font-size:8.5px;fill:#546e7a}
    .ok{fill:#2e7d32}
    .warn{fill:#c62828}
  </style>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">车尾淋浴帐 1000 × 1000 · 2020 折叠框折叠顺序（全水平面折）</text>
  <text x="700" y="54" text-anchor="middle" font-size="12" fill="#666">前横杆 1000 ｜ 侧臂 1000（500+500）｜ 后横杆 1000 整根（左 90° 活动件 + 右快拆搭扣）</text>
  <text x="700" y="70" text-anchor="middle" font-size="12" fill="#666">顶坡 5.7°（前 2 170 / 后 2 070）｜ 2060 后梁 + Z 形挂臂（后伸 200 / 下探 200）｜ 尺寸 mm</text>

  <line x1="700" y1="84" x2="700" y2="862" stroke="#e0e0e0" stroke-width="1.2"/>
  <line x1="24" y1="470" x2="1376" y2="470" stroke="#e0e0e0" stroke-width="1.2"/>

  <!-- ═════════════════ A. 展开 ═════════════════ -->
  <text x="40" y="108" font-size="15" font-weight="bold" fill="#1565c0">A · 展开：1000 × 1000 框 + 平台后梁 + Z 形挂臂</text>
  <text x="40" y="126" font-size="9.5" fill="#777">俯视：前横杆 1000 / 侧臂 1000（500+500）/ 后横杆 1000 整根（左 90° 活动件 + 右快拆搭扣）</text>

  <!-- 俯视框 -->
  <rect x="80" y="156" width="280" height="12" fill="#b0bec5" stroke="#607d8b" stroke-width="1"/>
  <text x="220" y="150" font-size="9" fill="#455a64" text-anchor="middle">2060 平台后梁（20×60，四面 T 槽）</text>
  <rect x="116" y="168" width="8" height="42" class="hang"/>
  <rect x="316" y="168" width="8" height="42" class="hang"/>
  <text x="34" y="176" font-size="8" fill="#37474f">Z 形挂臂</text>
  <text x="34" y="188" font-size="8" fill="#37474f">后伸 200</text>
  <line x1="160" y1="170" x2="160" y2="208" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="154" y="190" font-size="8" fill="#455a64" text-anchor="middle" transform="rotate(-90 154 190)">200</text>

  <rect x="130" y="220" width="180" height="180" class="fabric"/>
