  <path d="M 1058,386 Q 1088,376 1098,340" fill="none" stroke="#ef6c00" stroke-width="1.6" marker-end="url(#arwo)"/>
  <text x="1030" y="194" font-size="9" fill="#455a64" text-anchor="middle">前横杆 1000</text>
  <text x="986" y="330" font-size="8.5" fill="#607d8b">后横杆 500 折 90°</text>
  <text x="1030" y="430" font-size="9" fill="#2e7d32" text-anchor="middle">折后两半都落在侧臂里（500 &lt; 1000）</text>
  <text x="1030" y="446" font-size="8.5" fill="#607d8b" text-anchor="middle">侧臂 1000 不动</text>

  <line x1="915" y1="300" x2="915" y2="400" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="908" y="352" font-size="9" fill="#455a64" transform="rotate(-90 908 352)">500</text>
  <line x1="1145" y1="300" x2="1145" y2="400" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="1152" y="352" font-size="9" fill="#455a64" transform="rotate(-90 1152 352)">500</text>

  <!-- ═════════════════ C. 中折 + 前角折回 ═════════════════ -->
  <text x="40" y="486" font-size="14" font-weight="bold" fill="#1565c0">C · 侧臂中折 180°（1000→500）+ 前角 90° 折回贴前横杆</text>
  <text x="40" y="506" font-size="10" fill="#777">折完两根 500 在前横杆中间正好对合（500 + 500 = 1000）；两个中折合页上下错开装，不用给杆错层</text>

  <text x="330" y="552" font-size="8.5" fill="#455a64" text-anchor="middle">3 层（侧臂 2 层 + 后横杆 1 层，示意）</text>
  <rect x="230" y="600" width="100" height="8" class="prof"/>
  <rect x="230" y="610" width="100" height="8" class="prof"/>
