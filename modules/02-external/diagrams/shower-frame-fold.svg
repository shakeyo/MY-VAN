  </defs>
  <style>
    .prof{fill:#cfd8dc;stroke:#78909c;stroke-width:1.2}
    .prof2{fill:#eceff1;stroke:#90a4ae;stroke-width:1;stroke-dasharray:4 3}
    .hang{fill:#455a64}
    .bag{fill:#546e7a;stroke:#37474f;stroke-width:1.4}
