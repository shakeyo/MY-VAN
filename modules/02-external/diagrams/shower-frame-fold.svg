  <text x="612" y="352" font-size="8.5" fill="#455a64">高 2 170</text>
  <rect x="588" y="352" width="18" height="10" rx="4" class="bag"/>
  <text x="614" y="362" font-size="7.5" fill="#37474f">软袋卷起</text>
  <line x1="496" y1="212" x2="596" y2="212" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="546" y="207" font-size="8.5" fill="#455a64" text-anchor="middle">后伸 200</text>
  <line x1="624" y1="237" x2="624" y2="337" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="632" y="287" font-size="8.5" fill="#455a64" text-anchor="middle" transform="rotate(-90 632 287)">下探 200</text>
  <line x1="540" y1="387" x2="640" y2="387" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="652" y1="337" x2="652" y2="387" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="660" y="362" font-size="8.5" fill="#455a64" text-anchor="middle" transform="rotate(-90 660 362)">100</text>
  <text x="594" y="404" font-size="8" fill="#455a64" text-anchor="middle">后横杆低 100（2 070）</text>
  <text x="640" y="424" font-size="8" fill="#999" text-anchor="middle">车尾外侧 →</text>

  <!-- ═════════════════ B. 折后横杆 ═════════════════ -->
  <text x="730" y="108" font-size="15" font-weight="bold" fill="#1565c0">B · ① 解右端搭扣 → ② 整根后横杆绕左端折 90° 贴左臂</text>
  <text x="730" y="126" font-size="9.5" fill="#777">1000 = 侧臂长 1000：整根折进侧臂范围，不超长、不碰车；无中间套管、无插销、不拆件</text>

  <rect x="870" y="210" width="180" height="200" class="fabric"/>
  <rect x="860" y="200" width="200" height="10" class="prof"/>
  <rect x="860" y="200" width="10" height="210" class="prof"/>
  <rect x="1050" y="200" width="10" height="210" class="prof"/>
  <rect x="860" y="410" width="200" height="10" class="prof2"/>
  <text x="960" y="194" font-size="9" fill="#455a64" text-anchor="middle">前横杆 1000</text>

  <rect x="862" y="212" width="9" height="196" fill="#b0bec5" stroke="#ef6c00" stroke-width="1.5"/>
  <circle cx="865" cy="205" r="4.5" fill="#1565c0"/>
  <circle cx="1055" cy="205" r="4.5" fill="#1565c0"/>
  <circle cx="865" cy="310" r="5" fill="#ef6c00"/>
  <circle cx="1055" cy="310" r="5" fill="#ef6c00"/>
