  <rect x="120" y="210" width="10" height="200" class="prof"/>
  <rect x="310" y="210" width="10" height="200" class="prof"/>
  <rect x="120" y="400" width="200" height="10" class="prof"/>

  <circle cx="125" cy="215" r="4.5" fill="#1565c0"/>
  <circle cx="315" cy="215" r="4.5" fill="#1565c0"/>
  <circle cx="125" cy="310" r="5" fill="#ef6c00"/>
  <circle cx="315" cy="310" r="5" fill="#ef6c00"/>
  <circle cx="125" cy="405" r="5.5" fill="#ef6c00"/>
