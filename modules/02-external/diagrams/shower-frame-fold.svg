  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">车尾淋浴帐 1000 × 1000 · 2020 折叠框折叠顺序（4 格）</text>
  <text x="700" y="57" text-anchor="middle" font-size="12" fill="#666">前横杆 1000 ｜ 侧臂 1000 = 500+500 ｜ 后横杆 2×500（中间 160 mm 套管 + 插销）｜ 2060 平台后梁 + Z 形挂臂（后伸 200 / 下探 200）｜ 尺寸 mm</text>

  <line x1="700" y1="76" x2="700" y2="862" stroke="#e0e0e0" stroke-width="1.2"/>
  <line x1="24" y1="457" x2="1376" y2="457" stroke="#e0e0e0" stroke-width="1.2"/>

  <!-- ═════════════════ A. 展开 ═════════════════ -->
  <text x="40" y="100" font-size="15" font-weight="bold" fill="#1565c0">A · 展开：1000 × 1000 框 + 平台后梁 + 2 个 Z 形挂臂</text>
  <text x="40" y="120" font-size="10" fill="#777">左：俯视（前横杆 1000 / 侧臂 1000 / 后横杆 2×500）　右：侧视 Z 形挂臂（后伸 200 / 下探 200）</text>

