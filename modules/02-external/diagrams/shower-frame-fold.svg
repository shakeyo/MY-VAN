  <circle cx="315" cy="405" r="4" fill="#2e7d32"/>

  <text x="220" y="204" font-size="9" fill="#455a64" text-anchor="middle">前横杆 1000（高 2 170）</text>
  <rect x="135" y="224" width="170" height="9" rx="4.5" class="bag"/>
  <text x="220" y="248" font-size="8.5" fill="#37474f" text-anchor="middle">软袋卷起（90–100 粗 + 2 道魔术贴）</text>
  <text x="220" y="330" font-size="9" fill="#1565c0" text-anchor="middle">布：四面 + 顶（宽 950）</text>
  <text x="220" y="344" font-size="8" fill="#1565c0" text-anchor="middle">随框展开 / 收起</text>
  <text x="220" y="396" font-size="7.5" fill="#455a64" text-anchor="middle">后横杆 1000 整根（左铰 + 右搭扣）</text>
  <text x="140" y="318" font-size="7.5" fill="#ef6c00">中折 180°</text>
  <text x="108" y="320" font-size="8.5" fill="#607d8b" text-anchor="middle" transform="rotate(-90 108 320)">侧臂 1000（500+500）</text>
  <text x="112" y="232" font-size="7.5" fill="#1565c0" text-anchor="end">前角 90°（蓝）</text>
  <text x="114" y="412" font-size="8" fill="#ef6c00" text-anchor="end">左后 90° 活动件</text>
  <text x="330" y="427" font-size="8" fill="#2e7d32">右后 快拆搭扣（绿）</text>

  <line x1="340" y1="215" x2="340" y2="308" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="347" y="262" font-size="8" fill="#455a64" text-anchor="middle" transform="rotate(-90 347 262)">500</text>
  <line x1="340" y1="312" x2="340" y2="405" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="347" y="358" font-size="8" fill="#455a64" text-anchor="middle" transform="rotate(-90 347 358)">500</text>
  <line x1="372" y1="215" x2="372" y2="405" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="379" y="310" font-size="8.5" fill="#455a64" text-anchor="middle" transform="rotate(-90 379 310)">1000（进深）</text>

  <line x1="120" y1="430" x2="320" y2="430" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="220" y="446" font-size="9.5" fill="#333" text-anchor="middle">1000（框宽）</text>

  <!-- 侧面 inset -->
  <rect x="424" y="148" width="252" height="300" rx="6" fill="#fbfbfb" stroke="#ececec" stroke-width="1.2"/>
  <text x="432" y="166" font-size="8.5" fill="#455a64">侧面：2060 后梁 + Z 形挂臂</text>
  <text x="432" y="179" font-size="8" fill="#78909c">后伸 200 / 下探 200 + 前横杆</text>
  <rect x="432" y="196" width="60" height="200" fill="#eceff1"/>
  <line x1="492" y1="196" x2="492" y2="396" stroke="#b0bec5" stroke-width="1" stroke-dasharray="4 3"/>
