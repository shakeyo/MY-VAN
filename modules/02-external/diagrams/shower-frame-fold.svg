  <rect x="330" y="874" width="16" height="8" class="bag"/>
  <text x="352" y="882.5" font-size="9.5" fill="#455a64">常驻软袋（深灰）</text>
  <rect x="475" y="874" width="16" height="8" class="fabric"/>
  <text x="497" y="882.5" font-size="9.5" fill="#455a64">布（半透明蓝）</text>
  <text x="620" y="882.5" font-size="9.5" fill="#777">橙色 = 折叠方向 / 铰点</text>
  <text x="790" y="882.5" font-size="9.5" fill="#2e7d32">绿色 = 快拆搭扣 / 锁点</text>
  <text x="955" y="882.5" font-size="9.5" fill="#1565c0">蓝色 = 前角限位锁点</text>
