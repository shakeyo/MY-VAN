  <rect x="825" y="575" width="230" height="110" rx="12" class="bag"/>
  <text x="940" y="622" font-size="10.5" fill="#eceff1" text-anchor="middle">常驻防水袋 1100 × 280 × 160</text>
  <text x="940" y="640" font-size="9" fill="#cfd8dc" text-anchor="middle">框 + 布 1000 × 180 × 120</text>
  <line x1="833" y1="685" x2="1047" y2="685" stroke="#eceff1" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="940" y="704" font-size="9" fill="#37474f" text-anchor="middle">下沿一整根 #10 拉链 + 底角 8 mm 排水孔</text>

  <path d="M 800,530 Q 760,600 798,660" fill="none" stroke="#ef6c00" stroke-width="1.6" marker-end="url(#arwo)"/>
  <text x="776" y="682" font-size="9" fill="#ef6c00" text-anchor="middle">⑤ 下拉包住</text>

  <line x1="825" y1="724" x2="1055" y2="724" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="940" y="740" font-size="9.5" fill="#333" text-anchor="middle">1000（收起总长）</text>
  <text x="940" y="770" font-size="9" fill="#555" text-anchor="middle">套袋后外面只看得到袋子；袋跟着框走（拆模块时一起拆）</text>
  <text x="940" y="786" font-size="8.5" fill="#777" text-anchor="middle">收起厚度 ≈ 180，进深 ≈ 120</text>

