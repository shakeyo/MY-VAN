  <line x1="1048" y1="408" x2="1062" y2="422" stroke="#c62828" stroke-width="2.2"/>
  <line x1="1062" y1="408" x2="1048" y2="422" stroke="#c62828" stroke-width="2.2"/>

  <path d="M 1044,415 A 180,180 0 0 0 865,235" fill="none" stroke="#ef6c00" stroke-width="1.8" marker-end="url(#arwo)"/>
  <text x="1080" y="176" font-size="9" fill="#ef6c00">② 整根后横杆绕左端</text>
  <text x="1080" y="192" font-size="9" fill="#ef6c00">折 90° 贴左臂（1000 = 侧臂长）</text>
  <text x="1090" y="438" font-size="9" fill="#c62828">① 解右端搭扣</text>
  <text x="960" y="430" font-size="7.5" fill="#90a4ae" text-anchor="middle">虚线 = 后横杆折前位置</text>
  <text x="730" y="300" font-size="8.5" fill="#607d8b">整根后横杆折后</text>
  <text x="730" y="314" font-size="8.5" fill="#607d8b">覆盖整条左臂</text>
  <text x="730" y="442" font-size="8.5" fill="#ef6c00">左端 90° 活动连接件（竖轴）</text>

  <line x1="830" y1="212" x2="830" y2="408" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="823" y="310" font-size="8.5" fill="#455a64" text-anchor="middle" transform="rotate(-90 823 310)">1000（后横杆整根）</text>

  <!-- ═════════════════ C. 中折 + 前角折回 ═════════════════ -->
  <text x="40" y="508" font-size="14.5" font-weight="bold" fill="#1565c0">C · ③ 侧臂中折 180°（1000→500）+ ④ 前角 90° 折回贴前横杆</text>
  <text x="40" y="526" font-size="9.5" fill="#777">折完两根 500 在前横杆中间正好对合（500 + 500 = 1000）；两个中折合页一个装上面、一个装下面，错开 25–40 mm</text>

  <text x="330" y="570" font-size="9" fill="#ef6c00" text-anchor="middle">③ 侧臂中折 180°（1000→500，左右各一）</text>
  <path d="M 205,586 Q 182,614 212,638" fill="none" stroke="#ef6c00" stroke-width="1.6" marker-end="url(#arwo)"/>
  <path d="M 455,586 Q 478,614 448,638" fill="none" stroke="#ef6c00" stroke-width="1.6" marker-end="url(#arwo)"/>
  <text x="152" y="616" font-size="9" fill="#ef6c00" text-anchor="middle">④ 前角 90° 折回</text>
  <text x="508" y="616" font-size="9" fill="#ef6c00" text-anchor="middle">④ 前角 90° 折回</text>
  <text x="330" y="588" font-size="8.5" fill="#607d8b" text-anchor="middle">侧臂各 500（2 层叠合）+ 后横杆随左臂</text>

  <line x1="330" y1="596" x2="330" y2="652" stroke="#b0bec5" stroke-width="1" stroke-dasharray="3 3"/>
