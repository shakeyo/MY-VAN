  <line x1="320" y1="205" x2="320" y2="400" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="313" y="302" font-size="9" fill="#333" transform="rotate(-90 313 302)">1000（进深）</text>

  <!-- 侧视 inset -->
  <rect x="396" y="132" width="300" height="312" rx="6" fill="#fbfbfb" stroke="#ececec" stroke-width="1.2"/>
