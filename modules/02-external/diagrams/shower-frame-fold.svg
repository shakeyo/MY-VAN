  <rect x="271" y="160" width="8" height="40" class="hang"/>
  <text x="26" y="172" font-size="8" fill="#37474f">Z 形挂臂</text>
  <text x="26" y="184" font-size="8" fill="#37474f">后伸 200</text>
  <line x1="110" y1="160" x2="110" y2="200" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="104" y="184" font-size="8" fill="#455a64" transform="rotate(-90 104 184)">200</text>

