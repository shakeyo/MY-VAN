  <text x="456" y="548" font-size="9" fill="#ef6c00">前角 90° 折回</text>
  <text x="330" y="586" font-size="8.5" fill="#607d8b" text-anchor="middle">侧臂各 500（2 层叠合）</text>

  <text x="330" y="658" font-size="9" fill="#455a64" text-anchor="middle">前横杆 1000</text>
  <line x1="230" y1="676" x2="330" y2="676" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="280" y="692" font-size="9" fill="#455a64" text-anchor="middle">500</text>
  <line x1="330" y1="676" x2="430" y2="676" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="380" y="692" font-size="9" fill="#455a64" text-anchor="middle">500</text>
  <line x1="230" y1="716" x2="430" y2="716" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="330" y="732" font-size="9.5" fill="#333" text-anchor="middle">1000（前横杆长度）</text>
  <text x="330" y="756" font-size="9" fill="#2e7d32" text-anchor="middle">两根 500 在中间正好对合（中折合页一个上、一个下，错开 25–40）：不打架、不超长</text>

  <!-- ═════════════════ D. 收好套袋 ═════════════════ -->
  <text x="740" y="486" font-size="14" font-weight="bold" fill="#1565c0">D · 收好：并成 1000 一束，套上常驻防水袋</text>
  <text x="740" y="506" font-size="10" fill="#777">袋顶固定在前横杆下沿（1000 扁铝条 + 2 个 M6 T 螺母）｜展开时袋卷起绑在横杆上方｜拉链在下沿</text>

  <rect x="880" y="532" width="130" height="18" rx="9" fill="#cfd8dc" stroke="#90a4ae" stroke-width="1" stroke-dasharray="4 3"/>
