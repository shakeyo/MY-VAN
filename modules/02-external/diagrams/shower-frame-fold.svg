  <text x="600" y="395" font-size="8.5" fill="#999" text-anchor="middle">车尾外侧 →</text>

  <!-- ═════════════════ B. 折后横杆 ═════════════════ -->
  <text x="740" y="100" font-size="14.5" font-weight="bold" fill="#1565c0">B · 拔中间插销：两段 500 各绕侧臂外端折 90° 贴侧臂</text>
  <text x="740" y="120" font-size="10" fill="#777">后横杆两端都铰在侧臂外端、没有右后角搭扣；收放只在中间拔 / 插一次销</text>

  <rect x="940" y="390" width="80" height="8" class="prof2"/>
  <rect x="1040" y="390" width="80" height="8" class="prof2"/>
  <rect x="930" y="200" width="200" height="10" class="prof"/>
