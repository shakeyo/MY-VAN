  <text x="848" y="612" font-size="8" fill="#37474f" text-anchor="end">M6 T 螺母 ×2</text>
  <path d="M 852,588 L 1068,588 L 1064,636 Q 1062,644 1052,644 L 868,644 Q 858,644 856,636 Z" class="bag"/>
  <text x="960" y="602" font-size="9.5" fill="#eceff1" text-anchor="middle">软袋 1100 × 160 × 110</text>
  <text x="960" y="617" font-size="8.5" fill="#cfd8dc" text-anchor="middle">净空 1050 × 150 × 100（可压缩）</text>
  <text x="960" y="631" font-size="8" fill="#cfd8dc" text-anchor="middle">收起一束 1000 × 140 × 60</text>
  <line x1="866" y1="640" x2="1054" y2="640" stroke="#eceff1" stroke-width="2.5" stroke-dasharray="5 3"/>
  <circle cx="859" cy="639" r="2.5" fill="#eceff1" stroke="#37474f" stroke-width="0.6"/>
  <circle cx="1061" cy="639" r="2.5" fill="#eceff1" stroke="#37474f" stroke-width="0.6"/>
  <text x="960" y="662" font-size="9" fill="#37474f" text-anchor="middle">下沿一整根 #10 拉链 + 底角 8 mm 排水孔</text>
  <line x1="1068" y1="617" x2="1086" y2="617" class="dim"/>
  <text x="1092" y="621" font-size="9" fill="#455a64">约 140 厚（袋高 160）</text>

  <path d="M 812,560 Q 790,618 826,646" fill="none" stroke="#ef6c00" stroke-width="1.8" marker-end="url(#arwo)"/>
  <text x="786" y="548" font-size="9" fill="#ef6c00" text-anchor="middle">⑤ 下拉包住</text>

  <line x1="860" y1="680" x2="1060" y2="680" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="960" y="696" font-size="9.5" fill="#333" text-anchor="middle">1000（收起总长）</text>
  <line x1="852" y1="708" x2="1068" y2="708" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="960" y="724" font-size="9" fill="#455a64" text-anchor="middle">1100（袋长）</text>
  <text x="960" y="748" font-size="8.5" fill="#555" text-anchor="middle">套袋后外面只看得到袋子；袋跟着框走（拆模块时一起拆）</text>
  <text x="960" y="766" font-size="8.5" fill="#777" text-anchor="middle">软袋可压缩：下沿微收、四角倒圆；袋顶挂前横杆下沿、不包横杆</text>

