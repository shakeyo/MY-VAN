  <rect x="230" y="624" width="100" height="8" class="prof"/>
  <rect x="330" y="624" width="100" height="8" class="prof"/>
  <rect x="230" y="642" width="200" height="10" class="prof"/>
  <circle cx="235" cy="647" r="4.5" fill="#1565c0"/>
  <circle cx="425" cy="647" r="4.5" fill="#1565c0"/>
  <circle cx="235" cy="604" r="4" fill="#ef6c00"/>
  <circle cx="425" cy="604" r="4" fill="#ef6c00"/>

  <text x="330" y="664" font-size="9" fill="#455a64" text-anchor="middle">前横杆 1000</text>
  <line x1="230" y1="684" x2="330" y2="684" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="280" y="700" font-size="9" fill="#455a64" text-anchor="middle">500</text>
  <line x1="330" y1="684" x2="430" y2="684" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="380" y="700" font-size="9" fill="#455a64" text-anchor="middle">500</text>
  <line x1="230" y1="712" x2="430" y2="712" class="dim" marker-start="url(#arw)" marker-end="url(#arw)"/>
  <text x="330" y="728" font-size="9.5" fill="#333" text-anchor="middle">1000（前横杆长度）</text>
  <text x="330" y="750" font-size="9" fill="#2e7d32" text-anchor="middle">两根 500 在中间正好对合：不打架、不超长</text>
  <text x="330" y="768" font-size="8.5" fill="#607d8b" text-anchor="middle">两个中折合页一个上、一个下（错开 25–40 mm）；整根后横杆随左臂折进来</text>

  <!-- ═════════════════ D. 收好套袋 ═════════════════ -->
  <text x="730" y="508" font-size="14.5" font-weight="bold" fill="#1565c0">D · 收好：并成 1000 一束，套上常驻软袋（1100 × 160）</text>
  <text x="730" y="526" font-size="9.5" fill="#777">袋顶固定前横杆下沿（1000 扁铝条 + 2 个 M6 T 螺母）｜展开时卷成 90–100 粗 + 2 道魔术贴｜下沿整根 #10 拉链</text>

  <rect x="930" y="540" width="130" height="12" rx="6" class="bag"/>
  <text x="1075" y="556" font-size="8.5" fill="#37474f">展开时：袋卷成 90–100 粗 + 2 道魔术贴</text>
  <rect x="860" y="570" width="200" height="10" class="prof"/>
  <text x="960" y="566" font-size="9" fill="#455a64" text-anchor="middle">前横杆 1000（高 2 170）</text>
