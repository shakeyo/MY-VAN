<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" width="1320" height="900" font-family="sans-serif">
  <defs>
    <marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/>
    </marker>
    <marker id="fb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <text x="660" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">加水自由切换 × 用水自由切换</text>
  <text x="660" y="55" text-anchor="middle" font-size="12.5" fill="#666">绿=加水侧（W1/W2 选灌哪个箱）　蓝=用水侧（A/B 选抽哪个箱）　两套独立，共用一个泵，两箱之间不输水</text>

  <!-- ════════════════ 图例 ════════════════ -->
  <rect x="24" y="70" width="1272" height="58" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="40" y="92" font-size="12" font-weight="bold" fill="#333">图例</text>

  <rect x="92" y="80" width="30" height="22" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="132" y="96" font-size="11" fill="#333">加水口（RV+回吸阀）</text>

  <polygon points="300,80 316,91 300,102 284,91" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="324" y="96" font-size="11" fill="#333">快拆自封</text>

  <circle cx="432" cy="91" r="9" fill="#fff" stroke="#2e7d32" stroke-width="2.5"/>
  <polygon points="427,87 432,95 437,87" fill="#2e7d32"/>
  <text x="448" y="96" font-size="11" fill="#333">副箱底阀</text>

  <circle cx="552" cy="91" r="12" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="552" y="96" text-anchor="middle" font-size="11" font-weight="bold" fill="#b71c1c">P</text>
  <text x="572" y="96" font-size="11" fill="#333">泵（共用）</text>

  <rect x="650" y="82" width="26" height="18" fill="#fff" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="663" y="95" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#e65100">W1</text>
  <text x="684" y="96" font-size="11" fill="#333">切换球阀</text>

  <circle cx="776" cy="91" r="9" fill="#1565c0"/>
  <text x="776" y="95" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">J</text>
  <text x="792" y="96" font-size="11" fill="#333">汇流三通</text>

  <rect x="890" y="79" width="34" height="24" rx="3" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <rect x="895" y="84" width="24" height="14" rx="2" fill="#fff" stroke="#2e7d32" stroke-width="2"/>
  <text x="934" y="96" font-size="11" fill="#333">可移副箱</text>

  <rect x="1032" y="79" width="34" height="24" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1076" y="96" font-size="11" fill="#333">车底主箱（已装）</text>

  <rect x="1178" y="79" width="34" height="24" rx="3" fill="#eceff1" stroke="#607d8b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1220" y="96" font-size="11" fill="#333">车体固定件</text>

  <text x="40" y="122" font-size="10" fill="#c62828">★ 加水不进泵、不依赖电　★ 两注口都装切断阀（缺一个就互溢）　★ 同一组内两阀不同时开，跨组任意组合</text>

  <!-- ════════════════ ① 加水侧 ════════════════ -->
  <text x="24" y="162" font-size="14" font-weight="bold" fill="#2e7d32">① 加水侧：两个口都能灌，W1/W2 选灌哪个箱</text>
  <rect x="24" y="176" width="620" height="196" rx="8" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2" stroke-dasharray="7,4"/>

  <rect x="40" y="200" width="104" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="92" y="218" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">中门加水口</text>
  <text x="92" y="234" text-anchor="middle" font-size="8.5" fill="#1b5e20">RV+回吸切断阀</text>
  <text x="92" y="262" text-anchor="middle" font-size="9" fill="#2e7d32">车侧</text>

  <line x1="144" y1="223" x2="196" y2="223" stroke="#2e7d32" stroke-width="5" marker-end="url(#fg)"/>

  <rect x="40" y="302" width="104" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="92" y="320" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1b5e20">尾门加水口</text>
  <text x="92" y="336" text-anchor="middle" font-size="8.5" fill="#1b5e20">RV+回吸切断阀</text>
  <text x="92" y="364" text-anchor="middle" font-size="9" fill="#2e7d32">车尾</text>

  <line x1="144" y1="325" x2="196" y2="325" stroke="#2e7d32" stroke-width="5"/>
  <line x1="196" y1="325" x2="196" y2="235" stroke="#2e7d32" stroke-width="5"/>

  <circle cx="212" cy="223" r="12" fill="#1565c0"/>
  <text x="212" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">J</text>
  <text x="248" y="202" font-size="9" fill="#1b5e20">两注口汇流</text>

  <line x1="224" y1="223" x2="270" y2="223" stroke="#2e7d32" stroke-width="5"/>
  <line x1="270" y1="223" x2="270" y2="206" stroke="#2e7d32" stroke-width="5"/>
  <line x1="270" y1="223" x2="270" y2="278" stroke="#2e7d32" stroke-width="5"/>

  <line x1="270" y1="206" x2="306" y2="206" stroke="#2e7d32" stroke-width="5"/>
  <rect x="306" y="196" width="30" height="20" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <text x="321" y="211" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">W1</text>
  <line x1="336" y1="206" x2="378" y2="206" stroke="#2e7d32" stroke-width="5" marker-end="url(#fg)"/>
  <text x="321" y="188" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b5e20">灌主箱</text>

  <line x1="270" y1="278" x2="306" y2="278" stroke="#2e7d32" stroke-width="5"/>
  <rect x="306" y="268" width="30" height="20" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <text x="321" y="283" text-anchor="middle" font-size="10" font-weight="bold" fill="#e65100">W2</text>
  <line x1="336" y1="278" x2="378" y2="278" stroke="#2e7d32" stroke-width="5" marker-end="url(#fg)"/>
  <text x="321" y="310" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#1b5e20">灌副箱</text>

  <text x="390" y="210" font-size="10" fill="#1b5e20">→ 车底主箱</text>
  <text x="390" y="282" font-size="10" fill="#1b5e20">→ 副箱给水口</text>

  <text x="470" y="200" font-size="10.5" font-weight="bold" fill="#c62828">★ W1 / W2 择一开</text>
  <text x="470" y="220" font-size="10" fill="#333">同时开会把主/副箱连通，</text>
  <text x="470" y="236" font-size="10" fill="#333">水位互拉、容易溢</text>
  <text x="470" y="262" font-size="10" fill="#1b5e20">为什么先汇流再分目标：</text>
  <text x="470" y="278" font-size="10" fill="#333">龙头在车尾也能灌主箱，</text>
  <text x="470" y="294" font-size="10" fill="#333">在车侧也能灌副箱</text>
  <text x="470" y="322" font-size="9.5" fill="#c62828">注口须高于所服务箱体最高水面</text>
  <text x="470" y="340" font-size="9.5" fill="#c62828">否则回吸切断阀失效、重力倒灌</text>
  <text x="470" y="362" font-size="9.5" fill="#37474f">中门注口 ≠ 车外洗车口（两向隔离）</text>

  <!-- ════════════════ ② 用水侧 ════════════════ -->
  <text x="664" y="162" font-size="14" font-weight="bold" fill="#1565c0">② 用水侧：泵前汇流，A/B 选抽哪个箱</text>
  <rect x="664" y="176" width="632" height="196" rx="8" fill="#f3f8ff" stroke="#1565c0" stroke-width="2.5"/>

  <!-- 车底主箱 -->
  <rect x="680" y="200" width="140" height="52" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="750" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0d47a1">车底主箱</text>
  <text x="750" y="240" text-anchor="middle" font-size="9" fill="#0d47a1">60~100 L · 已装</text>

  <line x1="820" y1="226" x2="858" y2="226" stroke="#1565c0" stroke-width="5"/>
  <rect x="858" y="216" width="28" height="20" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <text x="872" y="231" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e65100">A</text>
  <text x="872" y="252" text-anchor="middle" font-size="9" fill="#e65100">抽主箱</text>
  <line x1="886" y1="226" x2="940" y2="226" stroke="#1565c0" stroke-width="5"/>

  <!-- 副箱 -->
  <rect x="680" y="296" width="140" height="52" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="750" y="318" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1b5e20">车尾副箱</text>
  <text x="750" y="336" text-anchor="middle" font-size="9" fill="#1b5e20">20~25 L · 柜下 · 可拉走</text>

  <line x1="820" y1="322" x2="846" y2="322" stroke="#2e7d32" stroke-width="5"/>
  <polygon points="846,310 868,322 846,334" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="857" y="352" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#e65100">K1/K2</text>
  <line x1="868" y1="322" x2="884" y2="322" stroke="#2e7d32" stroke-width="5"/>
  <rect x="884" y="312" width="28" height="20" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <text x="898" y="327" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e65100">B</text>
  <text x="898" y="348" text-anchor="middle" font-size="9" fill="#e65100">抽副箱</text>
  <line x1="912" y1="322" x2="940" y2="322" stroke="#2e7d32" stroke-width="5"/>

  <!-- 三通 Y -->
  <circle cx="952" cy="274" r="12" fill="#1565c0"/>
  <text x="952" y="279" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Y</text>
  <line x1="940" y1="226" x2="952" y2="226" stroke="#1565c0" stroke-width="5"/>
  <line x1="952" y1="226" x2="952" y2="262" stroke="#1565c0" stroke-width="5"/>
  <line x1="940" y1="322" x2="952" y2="322" stroke="#2e7d32" stroke-width="5"/>
  <line x1="952" y1="286" x2="952" y2="322" stroke="#2e7d32" stroke-width="5"/>
  <text x="990" y="250" text-anchor="middle" font-size="8.5" fill="#1565c0">汇流三通</text>

  <line x1="964" y1="274" x2="996" y2="274" stroke="#1565c0" stroke-width="5"/>

  <!-- 粗滤 -->
  <rect x="996" y="252" width="44" height="44" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/>
  <text x="1018" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#00695c">F</text>
  <line x1="1040" y1="274" x2="1068" y2="274" stroke="#1565c0" stroke-width="5"/>

  <!-- 泵 -->
  <circle cx="1098" cy="274" r="28" fill="#ffebee" stroke="#c62828" stroke-width="3.5"/>
  <text x="1098" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">P</text>
  <text x="1098" y="320" text-anchor="middle" font-size="9" fill="#b71c1c">48V 隔膜泵（共用）</text>

  <line x1="1126" y1="274" x2="1146" y2="274" stroke="#1565c0" stroke-width="5"/>
  <polygon points="1146,264 1162,274 1146,284" fill="#1565c0"/>
  <line x1="1162" y1="264" x2="1162" y2="284" stroke="#1565c0" stroke-width="3"/>
  <text x="1154" y="258" text-anchor="middle" font-size="8.5" fill="#1565c0">止回阀</text>
  <line x1="1162" y1="274" x2="1240" y2="274" stroke="#1565c0" stroke-width="6" marker-end="url(#fb)"/>

  <text x="1100" y="200" text-anchor="middle" font-size="10" font-weight="bold" fill="#1565c0">冷水母管 → 水槽/淋浴/车外取水/尾门花洒</text>
  <text x="1100" y="348" text-anchor="middle" font-size="10" fill="#c62828">★ A / B 择一开</text>
  <text x="1100" y="364" text-anchor="middle" font-size="9.5" fill="#333">两路同开会引空气、压力紊乱</text>

  <text x="690" y="132" font-size="10" fill="#37474f">泵组、母管、热水全部沿用 design.md，不改动</text>

  <!-- ════════════════ ③ 两图对照 ════════════════ -->
  <rect x="24" y="392" width="1272" height="86" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>
  <text x="44" y="416" font-size="12" font-weight="bold" fill="#333">★ 两组阀各管一件事，跨组任意组合</text>

  <rect x="44" y="428" width="230" height="38" rx="5" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="159" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">加水组：W1 / W2</text>
  <text x="159" y="459" text-anchor="middle" font-size="9" fill="#333">管"水从哪里灌进来"</text>

  <rect x="288" y="428" width="230" height="38" rx="5" fill="#f3f8ff" stroke="#1565c0" stroke-width="2"/>
  <text x="403" y="444" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">取水组：A / B</text>
  <text x="403" y="459" text-anchor="middle" font-size="9" fill="#333">管"水从哪里被抽走"</text>

  <text x="548" y="442" font-size="10.5" fill="#c62828">同一组内：两个不同时开</text>
  <text x="548" y="462" font-size="10.5" fill="#1b5e20">跨组之间：任意组合都合法（可边灌主箱边用副箱）</text>
  <text x="960" y="442" font-size="10" fill="#37474f">两箱之间不输水（已确认）</text>
  <text x="960" y="462" font-size="10" fill="#37474f">换箱 = 手动切 A/B</text>

  <!-- ════════════════ ④ 场景卡 ════════════════ -->
  <text x="24" y="514" font-size="14" font-weight="bold" fill="#37474f">④ 场景操作卡（打印贴柜内）</text>
  <rect x="24" y="528" width="860" height="286" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="2"/>

  <text x="44" y="554" font-size="11" font-weight="bold" fill="#333">场景</text>
  <line x1="44" y1="561" x2="864" y2="561" stroke="#bbb" stroke-width="1"/>

  <text x="44" y="586" font-size="10.5" fill="#333">① 水龙头在车侧 → 灌主箱</text>
  <text x="44" y="614" font-size="10.5" fill="#333">② 水龙头在车尾 → 灌主箱</text>
  <text x="44" y="642" font-size="10.5" fill="#333">③ 灌副箱</text>
  <text x="44" y="670" font-size="10.5" fill="#333">④ 副箱拉出去装水</text>
  <text x="44" y="698" font-size="10.5" fill="#333">⑤ 用主箱的水</text>
  <text x="44" y="726" font-size="10.5" fill="#333">⑥ 用副箱的水</text>
  <text x="44" y="754" font-size="10.5" fill="#b71c1c" font-weight="bold">⑦ 边灌主箱边用副箱 ★</text>
  <text x="44" y="782" font-size="10.5" fill="#333">⑧ 两箱都要灌（换着灌）</text>

  <text x="330" y="586" font-size="10" fill="#1b5e20">中门接软管 · W1开 · W2关</text>
  <text x="330" y="614" font-size="10" fill="#1b5e20">尾门接软管 · W1开 · W2关</text>
  <text x="330" y="642" font-size="10" fill="#1b5e20">中门接软管 · W1关 · W2开</text>
  <text x="330" y="670" font-size="10" fill="#c62828">先关 B → 拔 K1 → 关底阀 → 拉走</text>
  <text x="330" y="698" font-size="10" fill="#0d47a1">A开 · B关 · 泵开</text>
  <text x="330" y="726" font-size="10" fill="#0d47a1">A关 · B开 · 泵开</text>
  <text x="330" y="754" font-size="10" fill="#b71c1c" font-weight="bold">W1开 · A关 · B开 · 泵开</text>
  <text x="330" y="782" font-size="10" fill="#37474f">W1 开→关 后 W2 关→开，不同时开</text>

  <text x="640" y="586" font-size="9.5" fill="#333">加水组+取水组可同时处于任意状态</text>
  <text x="640" y="642" font-size="9.5" fill="#333">副箱在泵前被抽，与加水路无交集</text>
  <text x="640" y="754" font-size="9.5" fill="#b71c1c">两套切换独立的价值就在这一行</text>

  <text x="44" y="804" font-size="9.5" fill="#c62828">铁律：同组两阀不同时开 ｜ 拔箱前先关 B ｜ 加满立即关注口 ｜ 注口高于箱体水面 ｜ 加水路绝不并进泵</text>

  <!-- 右侧：接管示意 -->
  <rect x="900" y="528" width="396" height="132" rx="6" fill="#fff8e1" stroke="#ef6c00" stroke-width="2"/>
  <text x="916" y="550" font-size="11" font-weight="bold" fill="#e65100">副箱接入吸水侧（不改泵组）</text>
  <text x="916" y="572" font-size="10" fill="#333">副箱 ─ 底阀 ─ 箱内粗滤 ─ 柔性管 ─ K1 快拆</text>
  <text x="916" y="590" font-size="10" fill="#333">　　→ K2 穿板（柜板）→ B 阀 → 三通 Y</text>
  <text x="916" y="612" font-size="10" fill="#c62828">拔箱三步：关 B → 拔 K1 → 关底阀</text>
  <text x="916" y="630" font-size="10" fill="#1b5e20">B 路原接"车内水桶"，改接副箱即可</text>
  <text x="916" y="650" font-size="10" fill="#37474f">吸水侧是负压，无需新增单向阀</text>

  <rect x="900" y="672" width="396" height="142" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
  <text x="916" y="694" font-size="11" font-weight="bold" fill="#b71c1c">红线（详见 design-tank-portability.md §12）</text>
  <text x="916" y="716" font-size="10" fill="#333">· 加水路并进取水路（水从注口直接进泵）</text>
  <text x="916" y="734" font-size="10" fill="#333">· 注口只装单向阀不装回吸切断阀 / 只装一个</text>
  <text x="916" y="752" font-size="10" fill="#333">· W1/W2 同时开 · A/B 同时开 · 拔箱不关 B</text>
  <text x="916" y="770" font-size="10" fill="#333">· 把 W 组与 A/B 组当同一组阀操作</text>
  <text x="916" y="788" font-size="10" fill="#333">· 注口低于箱体水面 · 中门注口与洗车口共用</text>
  <text x="916" y="806" font-size="10" fill="#333">· 副箱限位全靠摩擦力</text>
</svg>
