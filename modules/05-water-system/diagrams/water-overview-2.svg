<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1180" width="1280" height="1180" font-family="sans-serif">
  <defs>
    <marker id="fc" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker>
    <marker id="fh" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c62828"/></marker>
    <marker id="fg" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker>
    <marker id="fp" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5e35b1"/></marker>
    <marker id="fd" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="3.5" markerHeight="3.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#00838f"/></marker>
  </defs>

  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">全车水路总图（手画版 · 方框+单字符号）</text>
  <text x="640" y="56" text-anchor="middle" font-size="12" fill="#666">蓝=冷水　红=热水　绿=加水　青=夏季旁路(D)　紫=混水　全部符号可一笔手画</text>

  <!-- ══════════ ① 加水区（最上方独立一条带） ══════════ -->
  <rect x="30" y="70" width="1220" height="96" rx="6" fill="#f1f8e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="48" y="94" font-size="14" font-weight="bold" fill="#2e7d32">① 加水（不进泵 · W1/W2 选灌哪个箱）</text>

  <rect x="80" y="108" width="150" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="155" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">中门加水口</text>
  <text x="155" y="143" text-anchor="middle" font-size="9" font-weight="bold" fill="#d84315">★回吸切断阀(必需)</text>

  <rect x="330" y="108" width="150" height="46" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="405" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b5e20">尾门加水口</text>
  <text x="405" y="143" text-anchor="middle" font-size="9" font-weight="bold" fill="#d84315">★回吸切断阀(必需)</text>

  <line x1="230" y1="131" x2="300" y2="131" stroke="#2e7d32" stroke-width="4" marker-end="url(#fg)"/>
  <line x1="480" y1="131" x2="552" y2="131" stroke="#2e7d32" stroke-width="4" marker-end="url(#fg)"/>

  <rect x="558" y="120" width="28" height="22" fill="#fff" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="572" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e65100">W1</text>
  <line x1="586" y1="131" x2="640" y2="131" stroke="#2e7d32" stroke-width="4"/>
  <text x="646" y="136" font-size="10" fill="#1b5e20">→ 车底主箱</text>

  <rect x="800" y="120" width="28" height="22" fill="#fff" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="814" y="136" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#e65100">W2</text>
  <line x1="828" y1="131" x2="882" y2="131" stroke="#2e7d32" stroke-width="4"/>
  <text x="888" y="136" font-size="10" fill="#1b5e20">→ 车尾副箱</text>

  <text x="1030" y="126" font-size="10" font-weight="bold" fill="#c62828">★ W1 / W2 择一开</text>
  <text x="1030" y="145" font-size="9.5" fill="#333">两箱不互相输水</text>

  <!-- ══════════ ② 水源 + 切换 + 泵组 ══════════ -->
  <text x="30" y="206" font-size="14" font-weight="bold" fill="#1565c0">② 水源 + 切换 + 泵组</text>

  <rect x="30" y="220" width="140" height="60" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="100" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#0d47a1">车底主箱</text>
  <text x="100" y="266" text-anchor="middle" font-size="9.5" fill="#0d47a1">主水源 · 已装</text>

  <rect x="30" y="330" width="140" height="78" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="100" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b5e20">车尾副箱</text>
  <text x="100" y="375" text-anchor="middle" font-size="9.5" fill="#1b5e20">第二水源</text>
  <text x="100" y="393" text-anchor="middle" font-size="9" fill="#1b5e20">柜下 · 可拉走</text>

  <line x1="170" y1="250" x2="236" y2="250" stroke="#1565c0" stroke-width="4"/>
  <rect x="236" y="239" width="26" height="22" fill="#fff" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="249" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">A</text>
  <line x1="262" y1="250" x2="320" y2="250" stroke="#1565c0" stroke-width="4"/>

  <line x1="170" y1="369" x2="204" y2="369" stroke="#2e7d32" stroke-width="4"/>
  <polygon points="204,357 226,369 204,381" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
  <line x1="226" y1="369" x2="236" y2="369" stroke="#2e7d32" stroke-width="4"/>
  <rect x="236" y="358" width="26" height="22" fill="#fff" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="249" y="374" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">B</text>
  <line x1="262" y1="369" x2="320" y2="369" stroke="#2e7d32" stroke-width="4"/>

  <line x1="320" y1="250" x2="320" y2="369" stroke="#1565c0" stroke-width="4"/>
  <circle cx="320" cy="310" r="11" fill="#1565c0"/>
  <text x="320" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">Y</text>

  <line x1="331" y1="310" x2="390" y2="310" stroke="#1565c0" stroke-width="4"/>
  <rect x="390" y="288" width="42" height="44" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
  <text x="411" y="316" text-anchor="middle" font-size="13" font-weight="bold" fill="#00695c">F</text>

  <line x1="432" y1="310" x2="470" y2="310" stroke="#1565c0" stroke-width="4"/>
  <circle cx="498" cy="310" r="26" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="498" y="318" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">P</text>
  <text x="498" y="352" text-anchor="middle" font-size="9" fill="#b71c1c">48V隔膜泵</text>

  <line x1="524" y1="310" x2="556" y2="310" stroke="#1565c0" stroke-width="4"/>
  <polygon points="556,300 572,310 556,320" fill="#1565c0"/>
  <line x1="572" y1="300" x2="572" y2="320" stroke="#1565c0" stroke-width="2.5"/>
  <text x="564" y="293" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#d84315">★止回(必需)</text>
  <line x1="572" y1="310" x2="640" y2="310" stroke="#1565c0" stroke-width="5"/>
  <line x1="640" y1="310" x2="640" y2="410" stroke="#1565c0" stroke-width="5"/>

  <!-- ══════════ 冷水主干 y=410 ══════════ -->
  <line x1="640" y1="410" x2="1240" y2="410" stroke="#1565c0" stroke-width="6"/>
  <text x="1140" y="400" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">冷 水 主 干</text>

  <line x1="700" y1="410" x2="700" y2="430" stroke="#1565c0" stroke-width="4"/>
  <circle cx="700" cy="410" r="9" fill="#1565c0"/>
  <!-- ★ 单向阀（阻外部水倒灌）-->
  <polygon points="688,432 712,442 688,452" fill="#1565c0"/>
  <line x1="712" y1="432" x2="712" y2="452" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="700" y1="452" x2="700" y2="462" stroke="#1565c0" stroke-width="4" marker-end="url(#fc)"/>
  <rect x="612" y="468" width="176" height="28" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="700" y="487" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">中门洗车（仅冷水）</text>
  <text x="722" y="440" font-size="8.5" font-weight="bold" fill="#d84315">★单向阀(必需)</text>

  <line x1="900" y1="410" x2="900" y2="456" stroke="#1565c0" stroke-width="4" marker-end="url(#fc)"/>
  <circle cx="900" cy="410" r="9" fill="#1565c0"/>
  <rect x="820" y="462" width="160" height="86" rx="4" fill="#f3f8ff" stroke="#455a64" stroke-width="2.5"/>
  <text x="900" y="484" text-anchor="middle" font-size="12" font-weight="bold" fill="#263238">水槽</text>
  <line x1="830" y1="492" x2="970" y2="492" stroke="#b0bec5" stroke-width="1"/>
  <circle cx="840" cy="510" r="5" fill="#1565c0"/>
  <text x="850" y="514" font-size="9.5" fill="#0d47a1">冷水口</text>
  <circle cx="840" cy="532" r="5" fill="#c62828"/>
  <text x="850" y="536" font-size="9.5" fill="#b71c1c">热水口</text>

  <line x1="1110" y1="410" x2="1110" y2="456" stroke="#1565c0" stroke-width="4" marker-end="url(#fc)"/>
  <circle cx="1110" cy="410" r="9" fill="#1565c0"/>
  <rect x="1022" y="462" width="176" height="28" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1110" y="481" text-anchor="middle" font-size="11" font-weight="bold" fill="#0d47a1">尾门洗车（仅冷水）</text>

  <!-- ══════════ ④ 热水支路 ══════════ -->
  <text x="30" y="600" font-size="14" font-weight="bold" fill="#c62828">④ 热水支路（冷水主干分出 · 蓝进红出）</text>

  <line x1="640" y1="410" x2="640" y2="700" stroke="#1565c0" stroke-width="5"/>
  <circle cx="640" cy="410" r="9" fill="#1565c0"/>

  <circle cx="640" cy="620" r="9" fill="#00838f"/>
  <line x1="640" y1="620" x2="580" y2="620" stroke="#00838f" stroke-width="4"/>
  <text x="626" y="612" text-anchor="end" font-size="9" fill="#006064">D取水</text>

  <rect x="627" y="700" width="26" height="22" fill="#fff" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="640" y="716" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">H</text>
  <text x="640" y="694" text-anchor="middle" font-size="8" fill="#1565c0">冷水进</text>

  <line x1="653" y1="711" x2="692" y2="711" stroke="#1565c0" stroke-width="4" marker-end="url(#fc)"/>
  <rect x="698" y="685" width="120" height="52" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
  <text x="758" y="708" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">小厨宝</text>
  <text x="758" y="726" text-anchor="middle" font-size="9" fill="#b71c1c">7L储水式</text>
  <text x="758" y="679" text-anchor="middle" font-size="8" fill="#1565c0">冷进</text>
  <text x="758" y="746" text-anchor="middle" font-size="8" fill="#c62828">热出</text>

  <line x1="758" y1="737" x2="758" y2="770" stroke="#f9a825" stroke-width="3"/>
  <rect x="690" y="770" width="136" height="38" fill="#fffde7" stroke="#f9a825" stroke-width="2"/>
  <text x="758" y="788" text-anchor="middle" font-size="10" font-weight="bold" fill="#f57f17">泄压阀</text>
  <text x="758" y="801" text-anchor="middle" font-size="8" fill="#c62828">排水出车外</text>

  <line x1="818" y1="711" x2="856" y2="711" stroke="#c62828" stroke-width="4" marker-end="url(#fh)"/>
  <rect x="856" y="700" width="26" height="22" fill="#fff" stroke="#ef6c00" stroke-width="2.5"/>
  <text x="869" y="716" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">O</text>
  <text x="869" y="739" text-anchor="middle" font-size="8" fill="#c62828">热水出</text>

  <!-- ══════════ 热水主干 y=780 ══════════ -->
  <line x1="882" y1="711" x2="900" y2="711" stroke="#c62828" stroke-width="6"/>
  <line x1="900" y1="711" x2="900" y2="780" stroke="#c62828" stroke-width="6"/>
  <line x1="900" y1="780" x2="1240" y2="780" stroke="#c62828" stroke-width="6"/>
  <text x="1120" y="770" text-anchor="middle" font-size="11" font-weight="bold" fill="#c62828">热 水 主 干</text>

  <line x1="580" y1="620" x2="540" y2="620" stroke="#00838f" stroke-width="4"/>
  <line x1="540" y1="620" x2="540" y2="780" stroke="#00838f" stroke-width="4"/>
  <rect x="527" y="680" width="26" height="26" fill="#e0f7fa" stroke="#00838f" stroke-width="2.5"/>
  <text x="540" y="699" text-anchor="middle" font-size="11" font-weight="bold" fill="#006064">D</text>
  <text x="518" y="698" text-anchor="end" font-size="9" fill="#006064">夏季旁路</text>
  <line x1="540" y1="780" x2="900" y2="780" stroke="#00838f" stroke-width="4" marker-end="url(#fd)"/>
  <text x="560" y="812" text-anchor="middle" font-size="8.5" fill="#006064">冷水经D灌入热水主干（阀O之后）·球阀关断即可，不需止回阀</text>

  <line x1="900" y1="780" x2="900" y2="548" stroke="#c62828" stroke-width="4" marker-end="url(#fh)"/>
  <circle cx="900" cy="780" r="9" fill="#c62828"/>

  <!-- ══════════ ⑤ 洗澡（恒温阀，直角矩形） ══════════ -->
  <text x="30" y="880" font-size="14" font-weight="bold" fill="#4527a0">⑤ 洗澡</text>

  <rect x="1040" y="860" width="190" height="70" fill="#ede7f6" stroke="#5e35b1" stroke-width="3"/>
  <text x="1135" y="888" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527a0">[恒] 恒温阀</text>
  <text x="1135" y="908" text-anchor="middle" font-size="9.5" fill="#4527a0">冷(蓝)+热(红)→单出口</text>

  <line x1="1110" y1="490" x2="1110" y2="600" stroke="#1565c0" stroke-width="4"/>
  <line x1="1110" y1="600" x2="1240" y2="600" stroke="#1565c0" stroke-width="4"/>
  <line x1="1240" y1="600" x2="1240" y2="862" stroke="#1565c0" stroke-width="4"/>
  <line x1="1240" y1="862" x2="1230" y2="862" stroke="#1565c0" stroke-width="4" marker-end="url(#fc)"/>
  <text x="1224" y="740" text-anchor="end" font-size="9" font-weight="bold" fill="#1565c0">冷入口</text>

  <circle cx="1110" cy="780" r="9" fill="#c62828"/>
  <line x1="1110" y1="780" x2="1110" y2="836" stroke="#c62828" stroke-width="4" stroke-dasharray="8,4"/>
  <line x1="1110" y1="836" x2="1080" y2="836" stroke="#c62828" stroke-width="4"/>
  <line x1="1080" y1="836" x2="1080" y2="862" stroke="#c62828" stroke-width="4" marker-end="url(#fh)"/>
  <text x="1124" y="832" font-size="9" fill="#c62828">车尾热水预留</text>

  <line x1="1135" y1="930" x2="1135" y2="966" stroke="#5e35b1" stroke-width="4" marker-end="url(#fp)"/>
  <rect x="1005" y="972" width="260" height="28" rx="4" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="1135" y="991" text-anchor="middle" font-size="11" font-weight="bold" fill="#4527a0">⇕ 洗澡花洒（车内+车外共用）</text>

  <!-- ═════ 底部说明 ═════ -->
  <rect x="30" y="1010" width="600" height="56" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="48" y="1034" font-size="11" font-weight="bold" fill="#333">正常季：H开 O开 D关 → 厨宝供热水</text>
  <text x="48" y="1055" font-size="11" fill="#006064">夏季：H关 O关 D开 → 冷水灌热水主干（水槽热/恒温阀热入口都有水）</text>

  <rect x="660" y="1010" width="590" height="56" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="678" y="1034" font-size="11" font-weight="bold" fill="#b71c1c">⚠ 切回正常季：先关D → 再开H/O（防热水倒灌）· A/B、W1/W2 不同时开</text>
  <text x="678" y="1055" font-size="11" fill="#333">水槽冷/热 · 洗车冷水直出 · 洗澡恒温阀冷热混水</text>

  <!-- ═════ 单向阀/止回阀 总清单 ═════ -->
  <rect x="30" y="1078" width="1220" height="88" rx="6" fill="#fff3e0" stroke="#d84315" stroke-width="2"/>
  <text x="48" y="1101" font-size="12" font-weight="bold" fill="#d84315">★ 全车止回/单向阀清单（共 4 处，缺一不可）</text>

  <text x="48" y="1123" font-size="10.5" fill="#333">① 泵出口      止回阀        防停泵倒流→压力开关反复启停</text>
  <text x="48" y="1141" font-size="10.5" fill="#333">② 中门洗车口  单向阀(朝外)   防洗车机自吸把外部脏水倒抽回车</text>

  <text x="480" y="1123" font-size="10.5" fill="#333">③ 中门加水口  回吸切断阀    防满水行车倒挂、两注口互溢</text>
  <text x="480" y="1141" font-size="10.5" fill="#333">④ 尾门加水口  回吸切断阀    同上（两个注口都要装）</text>

  <text x="900" y="1123" font-size="10" fill="#607d8b">不装：小厨宝出水侧(内置防倒流)</text>
  <text x="900" y="1141" font-size="10" fill="#607d8b">不装：A/B吸水侧(负压侧)</text>
  <text x="900" y="1159" font-size="10" fill="#607d8b">不装：尾门洗车口(纯直出无倒灌)</text>
</svg>
