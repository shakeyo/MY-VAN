<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="fc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="fh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
  </defs>

  <text x="640" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">全车水路总图（手画版 · 方框+单字符号）</text>
  <text x="640" y="58" text-anchor="middle" font-size="12.5" fill="#666">DM 管体系 4 分 · 蓝=冷水　红=热水　青=旁路　紫=出水　全部符号可一笔手画</text>

  <!-- ════════ 符号图例 ════════ -->
  <rect x="30" y="76" width="1220" height="74" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="48" y="100" font-size="12" font-weight="bold" fill="#333">符号图例（照此手画）</text>

  <!-- 三通 ┬ -->
  <line x1="175" y1="112" x2="215" y2="112" stroke="#333" stroke-width="3"/>
  <line x1="195" y1="112" x2="195" y2="128" stroke="#333" stroke-width="3"/>
  <text x="195" y="144" text-anchor="middle" font-size="10.5" fill="#333">三通 ┬</text>

  <!-- 球阀 □ -->
  <line x1="258" y1="112" x2="276" y2="112" stroke="#333" stroke-width="3"/>
  <rect x="276" y="103" width="20" height="18" fill="#fff" stroke="#333" stroke-width="2.5"/>
  <line x1="296" y1="112" x2="314" y2="112" stroke="#333" stroke-width="3"/>
  <text x="286" y="144" text-anchor="middle" font-size="10.5" fill="#333">球阀 □</text>

  <!-- 止回阀 ▷| -->
  <line x1="360" y1="112" x2="378" y2="112" stroke="#333" stroke-width="3"/>
  <polygon points="378,104 392,112 378,120" fill="#333"/>
  <line x1="392" y1="104" x2="392" y2="120" stroke="#333" stroke-width="2.5"/>
  <line x1="392" y1="112" x2="410" y2="112" stroke="#333" stroke-width="3"/>
  <text x="385" y="144" text-anchor="middle" font-size="10.5" fill="#333">止回阀 ▷|</text>

  <!-- 设备方框 -->
  <rect x="462" y="102" width="34" height="20" rx="3" fill="#eee" stroke="#333" stroke-width="2.5"/>
  <text x="479" y="117" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">宝</text>
  <text x="479" y="144" text-anchor="middle" font-size="10.5" fill="#333">设备 [字]</text>

  <text x="560" y="112" font-size="11" fill="#555">[宝]=小厨宝　[恒]=恒温阀　[F]=粗滤　(P)=泵　▭=水箱/水桶</text>
  <text x="560" y="134" font-size="10.5" fill="#c62828">球阀：A/B=水源切换　H=厨宝进水　O=厨宝出水　D=夏季旁路</text>

  <!-- ════════ ① 水源 ════════ -->
  <text x="30" y="192" font-size="14" font-weight="bold" fill="#1565c0">① 水源</text>

  <rect x="30" y="208" width="150" height="66" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="105" y="234" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0d47a1">车底清水箱</text>
  <text x="105" y="256" text-anchor="middle" font-size="10" fill="#0d47a1">▭ 主水源</text>

  <rect x="30" y="308" width="150" height="80" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="3"/>
  <text x="105" y="334" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1b5e20">车内取水桶</text>
  <text x="105" y="353" text-anchor="middle" font-size="10" fill="#1b5e20">▭ 备用 · 带盖</text>
  <text x="105" y="372" text-anchor="middle" font-size="9.5" fill="#c62828">盖开 φ3~5 通气孔</text>

  <!-- ════════ ② 切换 + ③ 泵组 ════════ -->
  <text x="270" y="192" font-size="14" font-weight="bold" fill="#ef6c00">② 切换（手动）</text>

  <line x1="180" y1="241" x2="270" y2="241" stroke="#1565c0" stroke-width="5"/>
  <line x1="270" y1="241" x2="288" y2="241" stroke="#1565c0" stroke-width="5"/>
  <rect x="288" y="231" width="24" height="20" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <text x="300" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">A</text>
  <line x1="312" y1="241" x2="340" y2="241" stroke="#1565c0" stroke-width="5"/>

  <line x1="180" y1="348" x2="270" y2="348" stroke="#1565c0" stroke-width="5"/>
  <line x1="270" y1="348" x2="288" y2="348" stroke="#1565c0" stroke-width="5"/>
  <rect x="288" y="338" width="24" height="20" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <text x="300" y="353" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">B</text>
  <line x1="312" y1="348" x2="340" y2="348" stroke="#1565c0" stroke-width="5"/>

  <!-- 汇流三通 1 -->
  <line x1="340" y1="241" x2="380" y2="241" stroke="#1565c0" stroke-width="5"/>
  <line x1="340" y1="348" x2="380" y2="348" stroke="#1565c0" stroke-width="5"/>
  <line x1="380" y1="241" x2="380" y2="348" stroke="#1565c0" stroke-width="5"/>
  <line x1="380" y1="295" x2="420" y2="295" stroke="#1565c0" stroke-width="5" marker-end="url(#fc)"/>
  <circle cx="380" cy="295" r="12" fill="#1565c0"/>
  <text x="380" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">1</text>

  <!-- 泵组 -->
  <text x="430" y="192" font-size="14" font-weight="bold" fill="#c62828">③ 泵组</text>

  <rect x="424" y="272" width="46" height="46" rx="4" fill="#e0f2f1" stroke="#00897b" stroke-width="3"/>
  <text x="447" y="301" text-anchor="middle" font-size="14" font-weight="bold" fill="#00695c">F</text>

  <line x1="470" y1="295" x2="500" y2="295" stroke="#1565c0" stroke-width="5"/>

  <circle cx="530" cy="295" r="30" fill="#ffebee" stroke="#c62828" stroke-width="3.5"/>
  <text x="530" y="303" text-anchor="middle" font-size="17" font-weight="bold" fill="#b71c1c">P</text>
  <text x="530" y="345" text-anchor="middle" font-size="10" fill="#b71c1c">48V 隔膜泵</text>

  <line x1="560" y1="295" x2="590" y2="295" stroke="#1565c0" stroke-width="5"/>
  <polygon points="590,285 606,295 590,305" fill="#1565c0"/>
  <line x1="606" y1="285" x2="606" y2="305" stroke="#1565c0" stroke-width="3"/>
  <text x="598" y="278" text-anchor="middle" font-size="9.5" fill="#1565c0">止回阀</text>
  <line x1="606" y1="295" x2="650" y2="295" stroke="#1565c0" stroke-width="5"/>

  <!-- ════════ ④ 冷水主干 ════════ -->
  <text x="670" y="192" font-size="14" font-weight="bold" fill="#1565c0">④ 冷水主干（贯穿全车）</text>
  <line x1="650" y1="295" x2="1230" y2="295" stroke="#1565c0" stroke-width="7"/>
  <text x="900" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#1565c0">冷 水 主 干</text>
  <circle cx="660" cy="295" r="12" fill="#c62828"/>
  <text x="660" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">2</text>
  <text x="676" y="322" font-size="9.5" font-weight="bold" fill="#c62828">② 分热水支路</text>

  <!-- 分支 3/4/5：向下 -->
  <line x1="700" y1="295" x2="700" y2="378" stroke="#1565c0" stroke-width="5" marker-end="url(#fc)"/>
  <circle cx="700" cy="295" r="12" fill="#1565c0"/>
  <text x="700" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">3</text>
  <rect x="620" y="384" width="160" height="44" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="700" y="411" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0d47a1">水槽冷水口</text>

  <line x1="890" y1="295" x2="890" y2="378" stroke="#1565c0" stroke-width="5" marker-end="url(#fc)"/>
  <circle cx="890" cy="295" r="12" fill="#1565c0"/>
  <text x="890" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">4</text>
  <rect x="810" y="384" width="160" height="44" rx="5" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
  <text x="890" y="411" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0d47a1">外置取水（冷）</text>

  <line x1="1060" y1="295" x2="1060" y2="378" stroke="#1565c0" stroke-width="5" marker-end="url(#fc)"/>
  <circle cx="1060" cy="295" r="12" fill="#1565c0"/>
  <text x="1060" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">5</text>
  <rect x="980" y="384" width="160" height="44" rx="5" fill="#eceff1" stroke="#607d8b" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="1060" y="411" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#37474f">车尾冷水（现有）</text>

  <!-- 主干末端：三通 8 → 恒温阀冷入口 + 阀 D -->
  <line x1="1180" y1="295" x2="1180" y2="378" stroke="#1565c0" stroke-width="5" marker-end="url(#fc)"/>
  <circle cx="1180" cy="295" r="12" fill="#1565c0"/>
  <text x="1180" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">8</text>
  <text x="1196" y="290" font-size="9.5" font-weight="bold" fill="#1565c0">⑧ 分冷入口+球D</text>

  <!-- 阀 D 旁路：冷水主干 → 热水主干 -->
  <line x1="1192" y1="295" x2="1230" y2="295" stroke="#00838f" stroke-width="5"/>
  <line x1="1230" y1="295" x2="1230" y2="440" stroke="#00838f" stroke-width="5"/>
  <rect x="1218" y="440" width="24" height="20" fill="#fff" stroke="#00838f" stroke-width="3"/>
  <text x="1230" y="455" text-anchor="middle" font-size="11" font-weight="bold" fill="#006064">D</text>
  <text x="1252" y="430" font-size="9.5" font-weight="bold" fill="#006064">阀D</text>

  <!-- ════════ ⑤ 热水支路 ════════ -->
  <text x="30" y="500" font-size="14" font-weight="bold" fill="#c62828">⑤ 热水支路（自冷水主干分出）</text>

  <!-- 三通 2：主干分出热水支路（在泵后 650 处，避开三通1）-->
  <line x1="660" y1="295" x2="660" y2="700" stroke="#c62828" stroke-width="5"/>
  <line x1="660" y1="700" x2="330" y2="700" stroke="#c62828" stroke-width="5"/>
  <line x1="330" y1="700" x2="330" y2="560" stroke="#c62828" stroke-width="5"/>
  <line x1="330" y1="560" x2="430" y2="560" stroke="#c62828" stroke-width="5"/>

  <line x1="380" y1="560" x2="430" y2="560" stroke="#c62828" stroke-width="5"/>
  <rect x="430" y="550" width="24" height="20" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <text x="442" y="565" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">H</text>
  <line x1="454" y1="560" x2="490" y2="560" stroke="#c62828" stroke-width="5" marker-end="url(#fh)"/>

  <rect x="494" y="534" width="120" height="52" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="3"/>
  <text x="554" y="557" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">小厨宝</text>
  <text x="554" y="576" text-anchor="middle" font-size="9.5" fill="#b71c1c">7L 储水式</text>

  <line x1="614" y1="560" x2="650" y2="560" stroke="#c62828" stroke-width="5" marker-end="url(#fh)"/>
  <rect x="650" y="550" width="24" height="20" fill="#fff" stroke="#ef6c00" stroke-width="3"/>
  <text x="662" y="565" text-anchor="middle" font-size="11" font-weight="bold" fill="#e65100">O</text>
  <line x1="674" y1="560" x2="710" y2="560" stroke="#c62828" stroke-width="5"/>

  <!-- 阀D 汇入点（球O 之后） -->
  <circle cx="710" cy="560" r="12" fill="#00838f"/>
  <text x="710" y="565" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">9</text>
  <line x1="1230" y1="460" x2="1230" y2="560" stroke="#00838f" stroke-width="5"/>
  <line x1="1230" y1="560" x2="722" y2="560" stroke="#00838f" stroke-width="5"/>
  <text x="980" y="550" text-anchor="middle" font-size="10" font-weight="bold" fill="#006064">⑨ 球D 汇入热水主干（球O 之后）</text>

  <!-- 热水主干 -->
  <line x1="722" y1="560" x2="1230" y2="560" stroke="#c62828" stroke-width="7"/>
  <text x="980" y="586" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">热 水 主 干</text>

  <!-- 滞压阀 -->
  <line x1="554" y1="586" x2="554" y2="616" stroke="#f9a825" stroke-width="3"/>
  <rect x="480" y="616" width="148" height="44" rx="5" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
  <text x="554" y="637" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#f57f17">泄压阀</text>
  <text x="554" y="653" text-anchor="middle" font-size="9" fill="#c62828">排水出车外</text>

  <!-- 热水分支 6/7 -->
  <line x1="830" y1="560" x2="830" y2="650" stroke="#c62828" stroke-width="5" marker-end="url(#fh)"/>
  <circle cx="830" cy="560" r="12" fill="#c62828"/>
  <text x="830" y="565" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">6</text>
  <rect x="750" y="656" width="160" height="44" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="2.5"/>
  <text x="830" y="683" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b71c1c">水槽热水口</text>

  <line x1="1000" y1="560" x2="1000" y2="650" stroke="#c62828" stroke-width="5" stroke-dasharray="9,4" marker-end="url(#fh)"/>
  <circle cx="1000" cy="560" r="12" fill="#c62828"/>
  <text x="1000" y="565" text-anchor="middle" font-size="11" font-weight="bold" fill="#fff">7</text>
  <rect x="920" y="656" width="160" height="44" rx="5" fill="#eceff1" stroke="#607d8b" stroke-width="2.5" stroke-dasharray="7,4"/>
  <text x="1000" y="676" text-anchor="middle" font-size="11" font-weight="bold" fill="#37474f">车尾热水预留</text>
  <text x="1000" y="692" text-anchor="middle" font-size="9" fill="#c62828">封堵 · 本期铺管</text>

  <!-- ════════ ⑥ 淋浴 ════════ -->
  <text x="30" y="740" font-size="14" font-weight="bold" fill="#4527a0">⑥ 淋浴（唯一调温点）</text>

  <line x1="1180" y1="378" x2="1180" y2="760" stroke="#1565c0" stroke-width="5"/>
  <line x1="1180" y1="760" x2="1140" y2="760" stroke="#1565c0" stroke-width="5" marker-end="url(#fc)"/>
  <text x="1194" y="420" font-size="10" font-weight="bold" fill="#1565c0">冷入口</text>

  <line x1="1104" y1="560" x2="1104" y2="724" stroke="#c62828" stroke-width="5" marker-end="url(#fh)"/>
  <text x="1114" y="700" font-size="10" font-weight="bold" fill="#c62828">热入口</text>

  <rect x="860" y="728" width="270" height="76" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="3.5"/>
  <text x="995" y="754" text-anchor="middle" font-size="13" font-weight="bold" fill="#4527a0">[恒] 淋浴恒温混水阀</text>
  <text x="995" y="774" text-anchor="middle" font-size="10" fill="#4527a0">冷入口 + 热入口 → 单出口</text>
  <text x="995" y="792" text-anchor="middle" font-size="9.5" fill="#2e7d32">★ 全车唯一需要调温的点</text>

  <line x1="860" y1="766" x2="800" y2="766" stroke="#7b1fa2" stroke-width="5" marker-end="url(#fh)"/>
  <rect x="650" y="744" width="146" height="44" rx="5" fill="#ede7f6" stroke="#5e35b1" stroke-width="2.5"/>
  <text x="723" y="771" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#4527a0">车内花洒</text>

  <!-- ════════ 底部说明 ════════ -->
  <rect x="30" y="828" width="600" height="56" rx="6" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="48" y="850" font-size="11" font-weight="bold" fill="#333">正常季：球H 开 · 球O 开 · 球D 关　→　厨宝供热水，三处热水点正常</text>
  <text x="48" y="872" font-size="11" font-weight="bold" fill="#006064">夏季：球H 关 · 球O 关 · 球D 开　→　冷水灌入热水主干（见夏季状态图）</text>

  <rect x="660" y="828" width="590" height="56" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="1.5"/>
  <text x="678" y="850" font-size="11" font-weight="bold" fill="#b71c1c">⚠ 泵运转中绝不切换球阀 A/B · 拆厨宝先断电泄压再拆管</text>
  <text x="678" y="872" font-size="11" fill="#333">已删件勿加回：阀C 旁通（重复）、厨宝出水侧止回阀（同压无倒灌）</text>
</svg>
