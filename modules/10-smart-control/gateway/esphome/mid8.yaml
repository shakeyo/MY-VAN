# 中门 8 路模块（配电箱内，地址 0x02，软件设置）—— 纯负载
# Y1 主灯 / Y2 氛围灯+睡眠灯 / Y3 后窗排气扇 / Y4 上水泵(48V直切+续流二极管)
# Y5 电控水阀 / Y6 冰箱 / Y7 倒车灯（车尾并进） / Y8 预留
#
# 【硬件变更】LED 全部移到中门 16DO 模块（地址 0x05），见 do16.yaml。
#   本文件不再有任何 LED 通道；负载 on_state 只调用 do16.yaml 里的 led_* 脚本。
#   原 中8.Y3/Y5 曾被当作 LED 用的设计已废弃（现 Y3=排气扇、Y5=水阀，均为负载）。
# 【按键动作】= 执行 act_xxx script（prod 在 scenes.yaml）

switch:
  - platform: template
    name: "MainLight 主灯"
    id: sw_main_light
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x09]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xF9]
    on_state:
      # 主控键1 LED（16DO.Y5）
      - script.execute: led_main
  - platform: template
    name: "Ambient 氛围灯"
    id: sw_ambient
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDD, 0xC9]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9C, 0x39]
    on_state:
      # 主控键2 LED（16DO.Y6）
      - script.execute: led_ambient
  - platform: template
    name: "FanRear 后窗排气扇"
    id: sw_fan_rear
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x02, 0xFF, 0x00, 0x2D, 0xC9]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x02, 0x00, 0x00, 0x6C, 0x39]
    on_state:
      # 主控键3 LED（16DO.Y7）
      - script.execute: led_fan
  - platform: template
    name: "Pump 上水泵"
    id: sw_pump
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x03, 0xFF, 0x00, 0x7C, 0x09]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x03, 0x00, 0x00, 0x3D, 0xF9]
    on_state:
      # 双控：入口键3 LED（16DO.Y3）+ 主控键4 LED（16DO.Y8），一起亮灭
      - script.execute: led_pump
  - platform: template
    name: "Valve 电控水阀"
    id: sw_valve
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x04, 0xFF, 0x00, 0xCD, 0xC8]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x04, 0x00, 0x00, 0x8C, 0x38]
    on_state:
      # 入口键1 排水 LED（16DO.Y1）
      - script.execute: led_drain
  - platform: template
    name: "Fridge 冰箱"
    id: sw_fridge
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x05, 0xFF, 0x00, 0x9C, 0x08]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x05, 0x00, 0x00, 0xDD, 0xF8]
    on_state:
      # 主控键5 冰箱 LED（16DO.Y9）
      - script.execute: led_fridge
  - platform: template
    name: "Reverse 倒车灯"
    id: sw_reverse
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x06, 0xFF, 0x00, 0x6C, 0x08]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x06, 0x00, 0x00, 0x2D, 0xF8]
  # Y8（线圈 0x0007）预留：帧 [0x02, 0x05, 0x00, 0x07, 0xFF/0x00, 0x00, 0x3D, 0xC8 / 0x7C, 0x38]

# 按键由 base.yaml 的 read_upload 按模块地址分发 publish_state（X1~X8 位图）
binary_sensor:
  - platform: template
    name: "DoorDrain 入口-排水"
    id: bs_door_drain
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_drain
  - platform: template
    name: "DoorOutdoor 入口-户外灯"
    id: bs_door_outdoor
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_outdoor
  - platform: template
    name: "DoorPump 入口-上水泵"
    id: bs_door_pump
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_pump_in
  - platform: template
    name: "DoorCamp 入口-离车驻车"
    id: bs_door_camp
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_camp
  - platform: template
    name: "BedLight 主控-主灯"
    id: bs_bed_light
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: 'id(hold_triggered) = false;'
      - script.execute: key1_hold_timer
    on_release:
      - script.stop: key1_hold_timer
      - if:
          condition:
            lambda: 'return !id(hold_triggered);'
          then:
            - switch.toggle: sw_main_light
      - lambda: 'id(hold_triggered) = false;'
  - platform: template
    name: "BedAmbient 主控-氛围灯"
    id: bs_bed_ambient
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_ambient
  - platform: template
    name: "BedFan 主控-排气扇"
    id: bs_bed_fan
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_fan
  - platform: template
    name: "BedPump 主控-上水泵"
    id: bs_bed_pump
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_pump_bed
