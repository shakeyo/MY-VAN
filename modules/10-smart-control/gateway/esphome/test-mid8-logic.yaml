  - platform: template
    name: "BedFan 主控-排气扇"
    id: bs_bed_fan
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_fan
  - platform: template
    name: "BedPump 主控-上水泵"
    id: bs_bed_pump
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
