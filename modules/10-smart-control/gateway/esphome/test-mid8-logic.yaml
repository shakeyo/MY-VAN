# =============================================================
# 阶段3：中8 模块全逻辑验证（桌面，模块地址 2，厂家软件已改）
# 验证目标：中8 全部按键逻辑——双控/场景循环/长按全关/断电恢复
#   - 杜邦线短接 DI↔GND 模拟按键（0.5s 松手）
#   - 跨模块动作（入口-户外灯 → 额头.R2）此处只打日志，上车用 prod 验证
#   - web 测试按钮可直接触发三个场景循环
# 烧录: esphome run test-mid8-logic.yaml
# =============================================================

substitutions:
  name: myvan-485-gateway
  friendly_name: 485网关

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - lambda: 'gpio_set_direction(GPIO_NUM_5, GPIO_MODE_OUTPUT);'
        - delay: 3s
        # 确保模块输入主动上传开启（0031H=1，掉电保存状态不确定，每次上电写一次）
        - lambda: 'gpio_set_level(GPIO_NUM_5, 1);'
        - delay: 1ms
        - uart.write:
            id: rs485_bus
            data: [0x02, 0x06, 0x00, 0x31, 0x00, 0x01, 0x19, 0xF6]
        - lambda: 'id(rs485_bus).flush();'
        - lambda: 'gpio_set_level(GPIO_NUM_5, 0);'
        - delay: 10ms
        # 安全负载 + LED：上电强制关（主灯/氛围灯/冰箱 RESTORE，测断电恢复）
        - switch.turn_off: sw_fan_rear
        - switch.turn_off: sw_pump
        - switch.turn_off: sw_valve
        - switch.turn_off: sw_led_camp_green
        - switch.turn_off: sw_led_camp_red

