    name: "DoorDrain 入口-排水"
    id: bs_door_drain
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_drain
  - platform: template
    name: "DoorOutdoor 入口-户外灯"
    id: bs_door_outdoor
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_outdoor
  - platform: template
    name: "DoorPump 入口-上水泵"
    id: bs_door_pump
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_pump_in
  - platform: template
    name: "DoorCamp 入口-离车驻车"
    id: bs_door_camp
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_camp
  - platform: template
    name: "BedLight 主控-主灯"
    id: bs_bed_light
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: 'id(hold_triggered) = false;'
      - script.execute: key1_hold_timer
    on_release:
      - script.stop: key1_hold_timer
      - if:
          condition:
            lambda: 'return !id(hold_triggered);'
          then:
            - switch.toggle: sw_main_light
      - lambda: 'id(hold_triggered) = false;'
  - platform: template
    name: "BedAmbient 主控-氛围灯"
    id: bs_bed_ambient
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
