switch:
  - platform: template
    name: "MainLight 主灯"
    id: sw_main_light
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - logger.log: 'switch: 置DE=1 写帧发出'
      - lambda: 'gpio_set_level(GPIO_NUM_5, 1);'
      - delay: 1ms
      - uart.write:
          id: rs485_bus
          data: [0x02, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x09]
      - lambda: 'id(rs485_bus).flush();'
      - lambda: 'gpio_set_level(GPIO_NUM_5, 0);'
      - delay: 10ms
    on_turn_off:
      - logger.log: 'switch: 置DE=1 写帧发出'
      - lambda: 'gpio_set_level(GPIO_NUM_5, 1);'
      - delay: 1ms
      - uart.write:
          id: rs485_bus
          data: [0x02, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xF9]
      - lambda: 'id(rs485_bus).flush();'
      - lambda: 'gpio_set_level(GPIO_NUM_5, 0);'
