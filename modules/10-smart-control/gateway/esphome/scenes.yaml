# 场景自动化脚本（按键动作 / 灯光模式 / 离车驻车 / 排气扇 / 主控键1 长按）
#
# 【LED 变更】LED 全部在中门 16DO（地址 0x05），见 relay-mid-16do.yaml。
#   场景键 LED 为**单色**（switch-assignment.md §LED 策略：亮=进入模式，灭=正常）：
#     离车/驻车 LED = 16DO.Y4（sw_led_y4）
#     灯光模式 LED  = 16DO.Y10（sw_led_y10）
#   原红绿双色脚本（sw_led_camp_red/green、sw_led_scene_red/green）已废弃。
#
# 【场景键节流 2026-10-23 实测】场景键一次触发要改 10+ 路继电器（每路一帧 485），
#   DI 抖动/连按会让写帧瞬间打满 rs485_write 队列（ESPHome 2026.7 queued 默认
#   max_runs=5）→ 超出的写帧被静默丢弃 → 表现为「继电器时动时不动」。
#   处理：① rs485.yaml 的 rs485_write 加 max_runs: 20；
#         ② 各 *_scene_next 末尾加 delay: 600ms，靠 mode: single 丢弃 600ms 内的重复触发。

script:
  # ---- 按键动作（每键一个，对应各模块文件 on_press 的 script.execute）----
  - id: act_spot
    then:
      - switch.toggle: sw_spot
  - id: act_dsp
    then:
      - switch.toggle: sw_dsp
  - id: act_reverse          # 驾驶室键2 → 跨模块切 中8.Y7 倒车灯（纯手动）
    then:
      - switch.toggle: sw_reverse
  - id: act_scene
    then:
      - script.execute: light_scene_next
  - id: act_drain
    then:
      - switch.toggle: sw_valve
  - id: act_outdoor
    then:
      - switch.toggle: sw_outdoor
  - id: act_pump_in
    then:
      - switch.toggle: sw_pump
  - id: act_camp
    then:
      - script.execute: camp_scene_next
  - id: act_ambient
    then:
      - switch.toggle: sw_ambient
  - id: act_fan
    then:
      - script.execute: fan_scene_next
  - id: act_pump_bed
    then:
      - switch.toggle: sw_pump
  - id: act_fridge
    then:
      - switch.toggle: sw_fridge
  - id: act_scene_bed
    then:
      - script.execute: light_scene_next

  # 灯光模式：0 全关 → 1 明亮 → 2 夜灯 循环
  - id: light_scene_next
    mode: single
    then:
      - lambda: 'id(light_scene) = (id(light_scene) + 1) % 3;'
      - script.execute: apply_light_scene
      - delay: 600ms   # 场景键节流：见文件头说明（mode: single 会把 600ms 内的重复触发丢掉）

  - id: apply_light_scene
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(light_scene) == 1;'
          then:
            - logger.log: "场景: 灯光-明亮"
            # 明亮：主灯 + 氛围灯全开；模式 LED 亮
            - switch.turn_on: sw_main_light
            - switch.turn_on: sw_ambient
            - switch.turn_on: sw_led_y10
      - if:
          condition:
            lambda: 'return id(light_scene) == 2;'
          then:
            - logger.log: "场景: 灯光-夜灯"
            # 夜灯：仅氛围灯；模式 LED 亮（单色无法区分档位，亮=已进入模式）
            - switch.turn_off: sw_main_light
            - switch.turn_on: sw_ambient
            - switch.turn_on: sw_led_y10
      - if:
          condition:
            lambda: 'return id(light_scene) == 0;'
          then:
            - logger.log: "场景: 灯光-全关"
            # 全关；模式 LED 灭
            - switch.turn_off: sw_main_light
            - switch.turn_off: sw_ambient
            - switch.turn_off: sw_led_y10

  # 离车/驻车：0 正常 → 1 离车 → 2 驻车 循环
  - id: camp_scene_next
    mode: single
    then:
      - lambda: 'id(camp_scene) = (id(camp_scene) + 1) % 3;'
      - script.execute: apply_camp_scene
      - delay: 600ms   # 场景键节流：见文件头说明

  - id: apply_camp_scene
    mode: single
    then:
      - if:
          condition:
            lambda: 'return id(camp_scene) == 1;'
          then:
            - logger.log: "场景: 离车"
            # 离车：负载全关（冰箱不断电，后续由 HA 远程控制）；模式 LED 亮
            - switch.turn_off: sw_main_light
            - switch.turn_off: sw_ambient
            - switch.turn_off: sw_fan_rear
            - switch.turn_off: sw_pump
            - switch.turn_off: sw_valve
            - switch.turn_off: sw_spot
            - switch.turn_off: sw_outdoor
            - switch.turn_off: sw_dsp
            - switch.turn_off: sw_fan_pass
            - switch.turn_off: sw_reverse
            - switch.turn_on: sw_led_y4
            # 灯光/排气扇场景同步为全关
            - lambda: 'id(light_scene) = 0;'
            - switch.turn_off: sw_led_y10
            - lambda: 'id(fan_scene) = 0;'
      - if:
          condition:
            lambda: 'return id(camp_scene) == 2;'
          then:
            - logger.log: "场景: 驻车"
            # 驻车：主灯 + 氛围灯开（暖光需灯自身支持，继电器只能开关）；模式 LED 亮
            - switch.turn_on: sw_main_light
            - switch.turn_on: sw_ambient
            - switch.turn_on: sw_led_y4
            # 灯光场景同步为明亮
            - lambda: 'id(light_scene) = 1;'
            - switch.turn_on: sw_led_y10
      - if:
          condition:
            lambda: 'return id(camp_scene) == 0;'
          then:
            - logger.log: "场景: 正常"
            # 正常：模式 LED 灭，不动负载
            - switch.turn_off: sw_led_y4

  # 排气扇：0 全关 → 1 仅后窗 → 2 全开 循环
  # （LED 由 led_fan 脚本跟随 sw_fan_rear 状态，见 relay-mid-16do.yaml）
  - id: fan_scene_next
    mode: single
    then:
      - lambda: 'id(fan_scene) = (id(fan_scene) + 1) % 3;'
      - if:
          condition:
            lambda: 'return id(fan_scene) == 0;'
          then:
            - logger.log: "场景: 排气扇-全关"
            - switch.turn_off: sw_fan_rear
            - switch.turn_off: sw_fan_pass
      - if:
          condition:
            lambda: 'return id(fan_scene) == 1;'
          then:
            - logger.log: "场景: 排气扇-后窗"
            - switch.turn_on: sw_fan_rear
            - switch.turn_off: sw_fan_pass
      - if:
          condition:
            lambda: 'return id(fan_scene) == 2;'
          then:
            - logger.log: "场景: 排气扇-全开"
            - switch.turn_on: sw_fan_rear
            - switch.turn_on: sw_fan_pass
      - delay: 600ms   # 场景键节流：见文件头说明

  # 主控键1 长按 2s 计时器（到达则灯光全关，短按逻辑在 on_release 里）
  - id: key1_hold_timer
    mode: restart
    then:
      - delay: 2s
      - lambda: 'id(hold_triggered) = true;'
      - logger.log: "按键: 主灯长按 2s → 灯光全关"
      - switch.turn_off: sw_main_light
      - switch.turn_off: sw_ambient
      - lambda: 'id(light_scene) = 0;'
      - switch.turn_off: sw_led_y10
