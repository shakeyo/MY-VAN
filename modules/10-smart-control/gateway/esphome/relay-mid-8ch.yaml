# 中门 8 路模块（配电箱内，地址 0x02，软件设置）—— 4 路负载 + 4 路预留（Y4/Y5/Y6/Y8）
# Y1 主灯+睡眠灯 / Y2 氛围灯带 / Y3 后横床顶灯 / Y4-Y5 预留
# Y6 预留（冰箱改常电直连） / Y7 车尾灯 / Y8 预留
# （后窗排气扇→中4.Y3、上水泵→中4.Y1、电控水阀→中4.Y2，2026-10 已迁走）
#
# 【LED（2026-10-30 决8 终局）】本模块不再承担任何 LED：
#   有负载的键 → LED 负载侧直连（并在该路 Y 的 NO）；
#   两个场景键（灯光模式 / 离车驻车）→ 双色 LED 由 **8DO 模块（0x07）** 驱动，见 relay-led-8ch.yaml。
#   曾经的「Y8 离车驻车逻辑 LED」已作废（Y8 回归预留）。

# 【按键动作】= 执行 act_xxx script（prod 在 scenes.yaml）

switch:
  - platform: template
    name: "[中8.Y1] 主灯"
    id: sw_main_light
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x09]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xF9]
  - platform: template
    name: "[中8.Y2] 氛围灯带"
    id: sw_ambient
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDD, 0xC9]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9C, 0x39]
  # ---- Y3：后横床圆形顶灯（2026-10-31 从氛围灯里拆出，可独立控制）----
  # 圆形扁平小灯，3~8W（0.3~0.7A）。功率小，但仍走中8（与灯带同柜、F12-2 同源）。
  - platform: template
    name: "[中8.Y3] 后横床顶灯"
    id: sw_bed_dome
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x02, 0xFF, 0x00, 0x2D, 0xC9]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x02, 0x00, 0x00, 0x6C, 0x39]
  # ---- Y6：预留（10A）----
  # 冰箱已改为常电直连（2026-10-31，见 §决9）：不经本模块任何通道，
  # 全局断电用独立大功率继电器解决。
  - platform: template
    name: "[中8.Y7] 车尾灯"
    id: sw_reverse
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x06, 0xFF, 0x00, 0x6C, 0x08]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x06, 0x00, 0x00, 0x2D, 0xF8]
    on_state:
      # 倒车灯 LED 在驾驶室柜，由 8DO(0x07) Y5 同步（固件跟随真实状态，见 决8）
      - script.execute: led_reverse_sync
      # 入口键3「车尾灯」LED 走 16DO.Y3（决10，中门柜本地）
      - script.execute: led_door_reverse
  # ---- Y3/Y4/Y5/Y8：预留（线圈 0x0002 / 0x0003 / 0x0004 / 0x0007）----

# 按键由 base.yaml 的 read_upload 按模块地址分发 publish_state（X1~X8 位图）
#
# 【面板终局 2026-10-30（switch-assignment.md §决策更新 决1/决2）】
#   入口面板只剩 **2 个 485 键**（离车/驻车键 2026-10-30 移到驾驶室B.X2，见 决8）：
#     X1 排水 → X2 上水泵                    （X3-X8 全空）
#   踏板兜底物理开关已取消（改睡眠模式自动收回，见 决7）。
#   中门主控 6 键（原 X5-X8）**已取消**，由 P4 车机大屏 + 手机面板 + 床头 2 键替代，
#   故本文件只保留入口 3 键实体；X5-X8 的位图位**照样解析但不发布任何状态**。
#   ⚠ 位图位号不可改：模块丝印 X1..X8 固定对应 bit0..bit7（见 base.yaml read_upload）。
#   入口键2「户外灯」已移驾驶室（决3），本模块不再有该键。
binary_sensor:
  # ═══════════════════════════════════════════════════════════════
  # 入口面板 4 键（2026-11-04 决10 定稿）
  #   X1 上水泵 / X2 户外灯 / X3 车尾灯（双控）/ X4 预留（预埋）
  #   LED 全部走中门柜 16DO(0x05) Y1-Y4，见 relay-mid-16do.yaml
  # ═══════════════════════════════════════════════════════════════
  - platform: template
    name: "[中8.DI1] 入口-上水泵"
    id: bs_door_pump
    on_press:
      - script.execute: act_pump_in
  - platform: template
    name: "[中8.DI2] 入口-户外灯"
    id: bs_door_outdoor
    # 户外灯负载在 额头.R2（额头柜），跨模块执行；LED 走 16DO.Y2
    on_press:
      - script.execute: act_outdoor
  - platform: template
    name: "[中8.DI3] 入口-车尾灯"
    id: bs_door_reverse
    # 双控：与 驾驶室A.DI2 同切 中8.Y7（同一实体 sw_reverse，状态天然同步）
    on_press:
      - script.execute: act_reverse
  # X4 = 预留（14P 位6 淡绿已预埋，将来装按钮直接接）
  #
  # ── 已下线 ──
  #   bs_door_drain  [中8.DI1] 入口-排水  → 排水键取消（决10：入口改上水泵/户外灯/车尾灯/预留）
  #   bs_bed_light/ambient/fan/pump [X5-X8] → 中门主控 6 键取消（决2）
  #   注意：随 bs_bed_light 一起作废的还有「主控键1 长按 2s 灯光全关」——该交互依赖已取消的实体。
#   X5-X8 空出来后可留给未来分散独立按钮（见 switch-assignment.md §五）。
