# =============================================================
# MPPT 光伏控制器（易科 Fcu，地址 0x10）—— 监控 + 控制 + 本地自动化
#
# 协议源：energy/mppt-protocol.md（11 条关键帧 CRC 已独立复算通过）
# 挂载：由 prod.yaml 以 package 引入；依赖 base.yaml 的 uart(rs485_bus) 与 rs485_write
#
# ⚠ 波特率：MPPT 最高只支持 9600（代码 4，与继电器模块的代码 1 不同）。
#   本文件所有帧都按 9600 发出，因此**必须先完成 build-guide.md §4.7 总线改造**
#   （4 个继电器模块改 9600 + 固件 4 处 baud_rate 改 9600），否则总线打架、全部乱码。
#
# ⚠ 轮询间隔 ≥1s（协议要求）；本文件用 10s。
# =============================================================

substitutions:
  mppt_addr: "0x10"        # MPPT 从站地址

# 本地时间（时钟同步 0xDF 用；日发电量 0 点清零依赖 MPPT 内部时钟）
time:
  - platform: sntp
    id: esphome_time
    timezone: Asia/Shanghai
    servers: [ntp.aliyun.com, pool.ntp.org]
    on_time_sync:
      # 校时成功后立即同步 MPPT 时钟，之后每日 0:05 再校一次
      - script.execute: solar_sync_clock

# ============ 监控实体（0xA3 控制码 0x02 轮询，返回 38 字节） ============
# 数据由 mppt_poll 脚本解析后 publish_state，实体本身只做展示
sensor:
  - platform: template
    name: "SolarPV PV电压"
    id: solar_pv_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    update_interval: never
  - platform: template
    name: "SolarBat 电池电压"
    id: solar_bat_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    update_interval: never
  - platform: template
    name: "SolarChg 充电电流"
    id: solar_chg_current
    unit_of_measurement: "A"
    accuracy_decimals: 2
    device_class: current
    state_class: measurement
    update_interval: never
  - platform: template
    name: "SolarPower 发电功率"
    id: solar_power
    unit_of_measurement: "W"
    accuracy_decimals: 0
    device_class: power
    state_class: measurement
    update_interval: never
  - platform: template
    name: "SolarDay 日发电量"
    id: solar_day_energy
    unit_of_measurement: "Wh"
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing
    update_interval: never
  - platform: template
    name: "SolarTotal 总发电量"
    id: solar_total_energy
    unit_of_measurement: "Wh"
    accuracy_decimals: 0
    device_class: energy
    state_class: total_increasing
    update_interval: never
  - platform: template
    name: "SolarTemp 控制器温度"
    id: solar_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never
  - platform: template
    name: "SolarBatTemp 电池温度"
    id: solar_bat_temp
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: never

text_sensor:
  - platform: template
    name: "SolarState 充电状态"
    id: solar_state
    update_interval: never
  - platform: template
    name: "SolarAlert 告警"
    id: solar_alert
    update_interval: never
  # 充电趋势（24h，每点 5 分钟）：base64 编码的 uint16 小端数组，面板解码后画折线。
  # 格式："v1:<count>:<idx>:<base64>"  count=已采集点数, idx=当前写指针（用于还原时间顺序）
  - platform: template
    name: "SolarTrend 充电趋势"
    id: solar_trend
    update_interval: never

# ============ 控制实体 ============
switch:
  - platform: template
    name: "SolarCharge 充电输出"
    id: sw_solar_charge
    restore_mode: RESTORE_DEFAULT_ON    # 上电默认允许充电，避免误断太阳能
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x10, 0xC0, 0x03, 0x00, 0x00, 0x00, 0x00, 0x5F, 0xC1]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x10, 0xC0, 0x04, 0x00, 0x00, 0x00, 0x00, 0xEA, 0x01]
  - platform: template
    name: "SolarEnable 允许充电"
    id: sw_solar_enable
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x10, 0xC0, 0x01, 0x00, 0x00, 0x00, 0x00, 0x26, 0x01]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x10, 0xC0, 0x02, 0x00, 0x00, 0x00, 0x00, 0x62, 0x01]

number:
  - platform: template
    name: "SolarLimit 充电限流"
    id: num_solar_limit
    unit_of_measurement: "A"
    min_value: 0
    max_value: 40            # 实际上限由 0xA2 读回（偏移 17-18），此处按 40A 量级兜底
    step: 0.01
    optimistic: true
    restore_value: true
    initial_value: 30.0
    on_value:
      # 0xD0/0x25：限流，数据3高 数据4低，÷100 → 写入值 = 安培 × 100
      - lambda: |-
          uint16_t v = (uint16_t) (x * 100.0f);
          std::vector<uint8_t> f = {0x10, 0xD0, 0x25, 0x00, 0x00,
                                    (uint8_t)(v >> 8), (uint8_t)(v & 0xFF),
                                    0x00, 0x00, 0x00, 0x00, 0x00, 0x00};
          // CRC16-Modbus 覆盖前 11 字节（去掉末尾 2 字节占位）
          uint16_t crc = 0xFFFF;
          for (int k = 0; k < 11; k++) {
            crc ^= f[k];
            for (int b = 0; b < 8; b++) crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
          }
          f[11] = (uint8_t) crc;
          f[12] = (uint8_t) (crc >> 8);
          id(rs485_write)->execute(f);

# ============ 按钮：一次性维护动作 ============
button:
  - platform: template
    name: "SolarA 设为远程控制"
    id: btn_solar_remote
    # DC 输出控制方式 = 远程控制（0xD0/0x0C 数据4=4），掉电保存
    on_press:
      - script.execute:
          id: rs485_write
          frame: [0x10, 0xD0, 0x0C, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0xF2, 0x4D]
  - platform: template
    name: "SolarB 时钟同步"
    id: btn_solar_clock
    # 0xDF 单控校时（日发电量 0 点清零依赖内部时钟）。时间来自 ESP32 本地时间。
    on_press:
      - script.execute: solar_sync_clock
  - platform: template
    name: "SolarC 读设置参数"
    id: btn_solar_read_cfg
    # 0xA2/02 读配置，日志打印电池类型/额定电压/电流上限（防配置被误改）
    on_press:
      - script.execute: solar_read_config
  - platform: template
    name: "SolarD 蜂鸣器消音"
    id: btn_solar_buzzer
    on_press:
      - script.execute:
          id: rs485_write
          frame: [0x10, 0xC0, 0x05, 0x00, 0x00, 0x00, 0x00, 0xD7, 0xC1]

# ============ 轮询与解析 ============
# MPPT 应答与继电器模块的上传帧同挂一条总线、同落在一个 UART 缓冲里。
# base.yaml 的 read_upload 只认继电器上传帧（FC04）；MPPT 帧由本文件的
# solar_read 独立扫描同一缓冲，两个 reader 互不干扰（各自 mode: single）。
interval:
  - interval: 10s
    then:
      - script.execute: solar_poll
  - interval: 100ms
    then:
      - script.execute: solar_read
  # 充电趋势采样：每 5 分钟一点（避开轮询瞬间，错开 30s 以免与其他定时撞车）
  - interval: 5min
    then:
      - delay: 30s              # 错开 10s 轮询，确保 solar_ok/power 是最新的
      - script.execute: trend_sample

globals:
  - id: solar_ok            # 本次轮询是否收到有效应答
    type: bool
    initial_value: 'false'
  - id: solar_miss          # 连续无应答次数（3 次判定离线）
    type: int
    initial_value: '0'
  - id: solar_lowpwr_cnt    # 发电功率 <5W 的连续次数（每次 10s；180 次 = 30 分钟）
    type: int
    initial_value: '0'
  - id: solar_standby       # 是否已进入待机断电
    type: bool
    initial_value: 'false'
  # ---- 充电趋势环形缓冲（面板画 24h 折线用）----
  # MPPT 自身只有「日发电量/总发电量」两个累计值，**没有历史曲线**，
  # 故在固件里自己攒：每 5 分钟记一个功率(W)，288 点 = 24 小时 = 576 字节。
  # ⚠ 纯 RAM，重启清零。长期趋势待 HA/InfluxDB 就位后另做（见 README）。
  # ⚠ 用 std::array 而非 std::vector：vector 的 initial_value 会让
  #   GlobalsComponent 构造函数产生重载歧义（已实测编译报错）。
  - id: trend_power
    type: std::array<uint16_t, 288>
    initial_value: '{0}'
  - id: trend_idx           # 下一个写入位置（0~287 循环）
    type: int
    initial_value: '0'
  - id: trend_count         # 已采集点数（<288 时表示还没攒满）
    type: int
    initial_value: '0'

script:
  # 发 0xA3/02 查询实时数据（38 字节应答）
  - id: solar_poll
    mode: single
    then:
      - lambda: 'id(solar_ok) = false;'
      - script.execute:
          id: rs485_write
          frame: [0x10, 0xA3, 0x02, 0x00, 0x00, 0x00, 0x00, 0x6B, 0x92]

  # 扫描 UART 缓冲里的 MPPT 应答帧（地址 0x10），CRC + 帧长双校验后分发
  # 帧格式：<addr> <命令> <控制码> <数据...> <CRC低> <CRC高>，定长
  - id: solar_read
    mode: single
    then:
      - lambda: |-
          uint8_t buf[96];
          int len = 0;
          while (id(rs485_bus).available() && len < 96) {
            uint8_t b;
            if (id(rs485_bus).read_byte(&b)) buf[len++] = b;
          }
          for (int i = 0; i + 3 < len; i++) {
            if (buf[i] != 0x10) continue;                 // MPPT 地址
            uint8_t cmd = buf[i+1];
            int flen = 0;
            if (cmd == 0xA3) flen = 38;                    // 实时数据（控制码 02）
            else if (cmd == 0xA2) flen = 65;               // 设置参数
            else if (cmd == 0xC0 || cmd == 0xD0 || cmd == 0xDF) flen = 13;  // 原样返回
            else if (cmd == 0xEE) flen = 13;               // 错误帧
            if (flen == 0) continue;
            if (i + flen > len) continue;                  // 帧未收全，等下次
            uint16_t crc = 0xFFFF;
            for (int k = i; k < i + flen - 2; k++) {
              crc ^= buf[k];
              for (int bit = 0; bit < 8; bit++) {
                if (crc & 1) crc = (crc >> 1) ^ 0xA001;
                else crc >>= 1;
              }
            }
            if ((uint8_t) crc != buf[i+flen-2] || (uint8_t) (crc >> 8) != buf[i+flen-1]) continue;

            if (cmd == 0xEE) {
              ESP_LOGE("mppt", "错误帧: 错误码=%02X 原命令=%02X 原控制码=%02X",
                       buf[i+2], buf[i+3], buf[i+4]);
            } else if (cmd == 0xA3 && buf[i+2] == 0x02) {
              std::vector<uint8_t> d(buf + i, buf + i + flen);
              id(solar_parse)->execute(d);
            } else if (cmd == 0xA2) {
              // 开机自检：打印额定电压 / 电流上限，防配置被误改
              ESP_LOGI("mppt", "设置参数: 额定电压=%d 电流上限=%d.%02d A",
                       buf[i+17], buf[i+18], buf[i+19]);
            } else {
              ESP_LOGI("mppt", "命令 %02X 应答正常（控制码 %02X）", cmd, buf[i+2]);
            }
            break;
          }

  # 读设置参数 0xA2/02（用于开机自检与误改排查）
  - id: solar_read_config
    mode: single
    then:
      - script.execute:
          id: rs485_write
          frame: [0x10, 0xA2, 0x02, 0x00, 0x00, 0x00, 0x00, 0x6A, 0x43]

  # 时钟同步：0xDF + 年(后两位) 月 日 时 分 秒 星期 ...
  - id: solar_sync_clock
    mode: single
    then:
      - lambda: |-
          auto t = id(esphome_time).now();
          if (!t.is_valid()) { ESP_LOGW("mppt", "时钟未同步，跳过校时"); return; }
          std::vector<uint8_t> f = {0x10, 0xDF,
            (uint8_t)(t.year % 100), (uint8_t)t.month, (uint8_t)t.day_of_month,
            (uint8_t)t.hour, (uint8_t)t.minute, (uint8_t)t.second,
            0x00, 0x01, 0x00, 0x00, 0x00, 0x00};
          // 帧长 13：前 11 字节 + CRC2
          f.resize(13);
          uint16_t crc = 0xFFFF;
          for (int k = 0; k < 11; k++) {
            crc ^= f[k];
            for (int b = 0; b < 8; b++) crc = (crc & 1) ? ((crc >> 1) ^ 0xA001) : (crc >> 1);
          }
          f[11] = (uint8_t) crc;
          f[12] = (uint8_t) (crc >> 8);
          id(rs485_write)->execute(f);

  # 解析 0xA3 应答（38 字节）并按位/偏移 publish
  # 帧结构：<addr> A3 02 <33 字节数据> <CRC2>  → 共 38 字节
  - id: solar_parse
    mode: single
    parameters:
      d: std::vector<uint8_t>
    then:
      - lambda: |-
          // 有符号温度：值 >4096 为负温 -(值-4096)/10
          auto temp = [](uint16_t raw) -> float {
            return raw > 4096 ? -(float)(raw - 4096) / 10.0f : (float)raw / 10.0f;
          };
          auto u32 = [&](int i) -> uint32_t {
            return ((uint32_t)d[i] << 24) | ((uint32_t)d[i+1] << 16) |
                   ((uint32_t)d[i+2] << 8) | (uint32_t)d[i+3];
          };
          id(solar_pv_voltage).publish_state(((uint16_t)d[6] << 8 | d[7]) / 10.0f);
          id(solar_bat_voltage).publish_state(((uint16_t)d[8] << 8 | d[9]) / 100.0f);
          id(solar_chg_current).publish_state(((uint16_t)d[10] << 8 | d[11]) / 100.0f);
          id(solar_temp).publish_state(temp((uint16_t)d[12] << 8 | d[13]));
          id(solar_bat_temp).publish_state(temp((uint16_t)d[16] << 8 | d[17]));
          id(solar_day_energy).publish_state((float)u32(20));
          id(solar_total_energy).publish_state((float)u32(24));
          id(solar_power).publish_state((float)((uint16_t)d[30] << 8 | d[31]));

          // 告警位（偏移 3）
          uint8_t a = d[3];
          std::string alert;
          if (a & 0x01) alert += "电池识别错误 ";
          if (a & 0x02) alert += "过放保护 ";
          if (a & 0x04) alert += "风扇故障 ";
          if (a & 0x08) alert += "过温 ";
          if (a & 0x10) alert += "DC输出短路 ";
          if (a & 0xE0) alert += "温度传感器故障 ";
          id(solar_alert).publish_state(alert.empty() ? "无" : alert);

          // 充电状态位（偏移 4）
          uint8_t c = d[4];
          std::string st;
          if (c & 0x01) st += "充电中 ";
          if (c & 0x02) st += "均充 ";
          if (c & 0x04) st += "MPPT跟踪 ";
          if (c & 0x08) st += "浮充 ";
          if (c & 0x10) st += "限流中 ";
          if (c & 0x20) st += "降额中 ";
          if (c & 0x40) st += "远程禁充 ";
          if (c & 0x80) st += "PV过压 ";
          id(solar_state).publish_state(st.empty() ? "停充" : st);

          // 控制状态 bit0 = 充电输出继电器，回读真实状态校正开关
          bool relay_on = d[5] & 0x01;
          if (id(sw_solar_charge).state != relay_on) {
            if (relay_on) id(sw_solar_charge).turn_on(); else id(sw_solar_charge).turn_off();
          }

          id(solar_ok) = true;
          id(solar_miss) = 0;

  # ---- 充电趋势采样（每 5 分钟一点，288 点 = 24h）----
  # 只记录「收到的有效功率」，MPPT 离线时记 0（曲线断层即代表离线/夜间）。
  # 编码格式 "v1:<count>:<idx>:<base64>"
  #   base64 存 uint16 小端序列，按 **时间正序** 输出（从最旧到最新），
  #   面板拿到就能直接画，不用再处理环形回绕。
  - id: trend_sample
    mode: single
    then:
      - lambda: |-
          const int CAP = 288;                       // 288 × 5min = 24h（= std::array 大小）

          float w = id(solar_ok) ? id(solar_power).state : 0.0f;
          if (w < 0) w = 0;
          if (w > 65535) w = 65535;

          int i = id(trend_idx) % CAP;
          id(trend_power)[i] = (uint16_t) w;
          id(trend_idx) = (i + 1) % CAP;
          if (id(trend_count) < CAP) id(trend_count)++;

          // 按时间正序展开：最旧 → 最新（环形回绕时从 idx 开始读）
          int n = id(trend_count);
          int start = (n == CAP) ? (int)id(trend_idx) : 0;
          std::string raw;
          raw.reserve(CAP * 2);
          for (int k = 0; k < n; k++) {
            uint16_t v = id(trend_power)[(start + k) % CAP];
            raw.push_back((char)(v & 0xFF));         // 小端低字节
            raw.push_back((char)(v >> 8));
          }

          // base64 编码（ESPHome 无现成库，这里手写 20 行）
          static const char* B64 =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
          std::string out;
          out.reserve((raw.size() + 2) / 3 * 4);
          size_t p = 0;
          while (p + 2 < raw.size()) {
            uint32_t v = ((uint8_t)raw[p] << 16) | ((uint8_t)raw[p+1] << 8) | (uint8_t)raw[p+2];
            out.push_back(B64[(v >> 18) & 0x3F]);
            out.push_back(B64[(v >> 12) & 0x3F]);
            out.push_back(B64[(v >> 6) & 0x3F]);
            out.push_back(B64[v & 0x3F]);
            p += 3;
          }
          if (p < raw.size()) {                      // 尾部 1~2 字节补 '='
            uint32_t v = ((uint8_t)raw[p] << 16);
            bool two = (p + 1 < raw.size());
            if (two) v |= ((uint8_t)raw[p+1] << 8);
            out.push_back(B64[(v >> 18) & 0x3F]);
            out.push_back(B64[(v >> 12) & 0x3F]);
            out.push_back(two ? B64[(v >> 6) & 0x3F] : '=');
            out.push_back('=');
          }

          char head[32];
          snprintf(head, sizeof(head), "v1:%d:%d:", n, (int)id(trend_idx));
          id(solar_trend).publish_state(std::string(head) + out);
