# 485 写帧公共件：DE 方向控制 + 校验和工具
#
# 【为什么需要这个文件】
# 早期每个开关的 on_turn_on/off 都手抄 5 行（DE 置 1 → delay → uart.write → flush → DE 置 0），
# 全车 30+ 个通道 = 数百行重复，且每个帧的 CRC 靠手算，改一处通道极易漏改。
# 现改为「一个脚本 + 一个 lambda 助手」，通道定义只写一条帧：
#
#   - script.execute:
#       id: rs485_write
#       frame: [0x02, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x09]
#
# 【DE/RE 时序】使能脚（DE+RE 并接）高 = 发送、低 = 接收。
#   当前接 **GPIO17**（紧邻 RX 16）——2026-09 由 GPIO5 改到 17。
#   ⚠ 引脚号集中在 base.yaml 的 substitutions（de_pin），本文件用 ${de_pin} 引用，
#     再换引脚只改一处。
# ESPHome 2026.7 下 digitalWrite 是静默空操作，必须用 gpio_set_level（历史踩坑）。
# 发送后不能长延迟占住发送模式：模块回包在请求后 ~10ms 内到达，flush() 保证最后
# 一个字节移出移位寄存器后立即切回接收，避免回包整个落在接收器关闭的窗口里。

script:
  # 发一帧 485（含 DE 切换）。调用方只管给帧，时序全在这里。
  - id: rs485_write
    mode: queued          # 多路按键几乎同时触发时不丢帧，串行排队发送
    # ⚠ ESPHome 2026.7 的 queued 默认 max_runs=5（1 运行 + 4 排队）。
    #   场景键一次要改 10+ 路继电器（每路一帧），连按两下就打满队列，
    #   超出的写帧被**静默丢弃** → 「继电器时动时不动」。
    #   实测 2026-10-23 日志：Script 'rs485_write' max instances reached!
    #   每帧约 25ms，20 个实例 ≈ 0.5s 缓冲，足够场景连发。
    max_runs: 20
    parameters:
      frame: std::vector<uint8_t>
    then:
      - lambda: 'gpio_set_level(${de_pin}, 1);'
      - delay: 1ms
      - uart.write:
          id: rs485_bus
          data: !lambda 'return frame;'
      - lambda: 'id(rs485_bus).flush();'
      # 2026-10 实测：同一开关连点 10 次会漏 1~2 次（继电器不动作）。
      # 原因：flush() 在 uart.idf 框架下不保证移位寄存器已排空，DE 过早拉低
      # → 帧尾 2 字节 CRC 偶发截断 → 模块按 Modbus 规范静默丢弃（CRC 错不应答）。
      # 8 字节 @38400 = 2.08ms，此处补 2ms 余量让最后字节真正移出。
      # ⚠ 不可再加长：模块回包在请求后约 10ms 内到达，占住发送模式会错过接收窗口。
      - delay: 2ms
      - lambda: 'gpio_set_level(${de_pin}, 0);'
      # 帧后间隔：原 10ms → 20ms。桌面实测（2026-10）放宽到 20ms 以降低
      # 与模块主动上传帧 / 多路连点撞车的概率；连点响应略慢但不丢帧优先。
      - delay: 20ms
