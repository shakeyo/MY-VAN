# =============================================================
# 中门 16DO 模块（中门柜内，地址 0x05，一个 485 地址 = 一个设备）
#
# 【状态 2026-11-04 · 决10 重新启用】
#   用途：**入口面板 4 键的 LED 驱动**（Y1-Y4），Y5-Y8 备用。
#   为什么启用：入口面板与中门柜同柜，LED 阴走几厘米；
#     若改走额头 8DO 则要飞 3~4m 网线，且 8DO 只剩 Y6-Y8 三路（不够 4 键）。
#   接线（吸地开关）：
#     LED 阳极 → +12V 控+
#     LED 阴极 → 串 1~3.3kΩ → 本模块对应 Y 的 COM
#     Y 的 NO → 模块 GND
#     → Y 吸合 = 阴极回 GND = 灯亮
#
# 【LED 映射（决10）】
#   Y1  入口键1 上水泵 LED   ← 中4.Y1（泵）
#   Y2  入口键2 户外灯 LED   ← 额头.R2
#   Y3  入口键3 车尾灯 LED   ← 中8.Y7（与驾驶室键2 双控同一实体）
#   Y4  入口键4 预留 LED     ← 预埋待用（14P 位12 橙）
#   Y5-Y8  备用（未来入口扩展键）
#
# 【地址】0x05 —— 继电器模块 0x02/0x03（中门）、0x05~0x0F（额头柜）、
#   MPPT=0x10、485 传感器建议 0x20 起，故 0x05 空闲。
#   ⚠ 实物到货后必须用厂家软件把地址改成 5、波特率改成与全车一致（9600），
#     否则本文件所有帧的站号都不对。
#
# 【线圈地址规律】与中8/中4 同系列：线圈 0000H = 通道 1，通道 N = 地址 N-1
#   （手册「汇控数字量输入输出系列」表 2.1 已确认）。
#
# 【状态跟踪方式】LED 用 internal template switch + lambda 解析帧，全部 optimistic。
#   负载侧在 on_state 里调用对应的 led_* 脚本（定义在本文件底部）。
# =============================================================

switch:
  # ============ Y1-Y4：入口面板 4 键 LED ============
  - platform: template
    name: "[16DO.Y1] 入口-上水泵LED"
    id: sw_led_y1
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    internal: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8D, 0xBE]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCC, 0x4E]
  - platform: template
    name: "[16DO.Y2] 入口-户外灯LED"
    id: sw_led_y2
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    internal: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDC, 0x7E]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9D, 0x8E]
  - platform: template
    name: "[16DO.Y3] 入口-车尾灯LED"
    id: sw_led_y3
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    internal: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x02, 0xFF, 0x00, 0x2C, 0x7E]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x02, 0x00, 0x00, 0x6D, 0x8E]
  - platform: template
    name: "[16DO.Y4] 入口-预留键LED"
    id: sw_led_y4
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    internal: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x03, 0xFF, 0x00, 0x7D, 0xBE]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x03, 0x00, 0x00, 0x3C, 0x4E]

  # ============ Y5-Y16：预留（未来入口扩展键 / 未来负载） ============
  # 需要时按上面同样的格式追加：Y5=0x0004、Y6=0x0005 ... Y16=0x000F
  # 帧生成：站号 05 + FC05 + 线圈地址(高/低) + FF00(开)/0000(关) + CRC16-Modbus(低字节在前)

# ============ LED 控制脚本（负载 on_state 调用的唯一入口） ============
script:
  - id: led_door_pump        # 入口键1 上水泵 LED ← 中4.Y1（泵）
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_pump).state;'}
          then: [switch.turn_on: sw_led_y1]
          else: [switch.turn_off: sw_led_y1]
  - id: led_door_outdoor     # 入口键2 户外灯 LED ← 额头.R2
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_outdoor).state;'}
          then: [switch.turn_on: sw_led_y2]
          else: [switch.turn_off: sw_led_y2]
  - id: led_door_reverse     # 入口键3 车尾灯 LED ← 中8.Y7（双控，与驾驶室键2 同实体）
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_reverse).state;'}
          then: [switch.turn_on: sw_led_y3]
          else: [switch.turn_off: sw_led_y3]
