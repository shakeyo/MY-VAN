# =============================================================
# 继电器模块汇总入口（485 继电器 / DO 模块）
#
# 本文件只做两件事：
#   1. 汇总在役继电器模块的 !include（prod.yaml 只 include 本文件）
#   2. 作为「模块 × 站号 × 路数 × 职责」的唯一索引表
#
# 【为什么站号不提到这里】站号已写死在各自的 Modbus 帧里
#   （frame 首字节），且每个帧尾的 CRC 由站号+功能码+寄存器+值算定。
#   ESPHome substitutions 是纯文本替换，不会重算 CRC —— 把站号提成
#   ${addr_xxx} 会导致「改了站号，CRC 没跟着变」，帧被模块静默丢弃。
#   故站号与帧、CRC 必须同文件存放；本表仅作对照，改站号时按表逐文件改。
#
# 【公共部分在哪】DE/RE 方向时序、排队与重发间隔、CRC 正确性坑，
#   已全部收敛在 rs485.yaml 的 rs485_write 脚本，各模块只需给一条帧。
#
# =============================================================

packages:
  # ═══ 中门配电箱（0x02~0x03）—— 中8/中4 地址保持原样，不改 ═══
  relay_mid_8ch: !include relay-mid-8ch.yaml        # 0x02 8DI+8DO 10A（已实测确认，勿动）
  relay_mid_4ch: !include relay-mid-4ch.yaml        # 0x03 4DI+4DO 5A（已设好，勿动）
  # ─── 分界线：0x04 不分配 ───
  # ═══ 额头柜（0x05~0x07）═══
  relay_cabin_a: !include relay-cabin-a-4ch.yaml    # 0x05 4DI+4DO 5A  驾驶室功率键
  relay_cabin_b: !include relay-cabin-b-4ch.yaml    # 0x06 4DI+4DO 5A  驾驶室场景键
  relay_led_8ch: !include relay-led-8ch.yaml        # 0x07 8DO 5A      场景双色 LED
  # 已退役 / 未使用：
  # relay_mid_16do: !include relay-mid-16do.yaml    # 库存备用
  # （relay-forehead-8ch.yaml 旧文件已作废，勿再 include）

# =============================================================
# 模块索引（2026-10-30 · 决8 + 站号定稿）
#
# 【编号规则】只针对继电器模块（MPPT 等能源设备不参与本规则）：
#   0x01         留空（中门预留位）
#   0x02 ~ 0x03  中门配电箱（中8 / 中4）—— **沿用原有地址，不改**
#   0x04         分界线（不分配）
#   0x05 ~ 0x0F  额头柜（驾驶室A / 驾驶室B / 8DO / 0x08~0x0F 预留 8 个）
#   → 以后加模块：中门用 0x01，额头往后排 0x08、0x09…，永不重编
#
# | 站号 | 文件                    | 位置   | 规格        | 职责                                        |
# |------|-------------------------|--------|-------------|---------------------------------------------|
# | 0x01 | （留空）                 | 中门箱 | —           | 中门预留位                                   |
# | 0x02 | relay-mid-8ch.yaml      | 中门箱 | 8DI+8DO 10A | 主灯/氛围/冰箱/车尾灯 + **Y3 踏板收回**        |
# | 0x03 | relay-mid-4ch.yaml      | 中门箱 | 4DI+4DO 5A  | 泵线圈/水阀/后窗扇（Y4 预留）                  |
# | 0x04 | —                       | —      | —           | **分界线（不分配）**                          |
# | 0x05 | relay-cabin-a-4ch.yaml  | 额头柜 | 4DI+4DO 5A  | 射灯/DSP 大继电器线圈 + 户外灯 + 副驾扇 + 4 键 |
# | 0x06 | relay-cabin-b-4ch.yaml  | 额头柜 | 4DI+4DO 5A  | 驾驶室场景键 2（灯光模式 / 离车驻车）           |
# | 0x07 | relay-led-8ch.yaml      | 额头柜 | 8DO 5A      | 场景键双色 LED ×2 + 倒车灯 LED                 |
# | 0x08~0x0F | （预留）            | 额头柜 | —           | 额头柜扩展（8 个位置）                        |
#
# 能源设备同挂此总线（不参与上面的编号规则）：0x10=MPPT；485 传感器建议 0x20 起
#   （库仑计 TF03K 为 19200，走独立 UART，不在本总线）
#   所有模块地址均由厂家软件设置，固件内帧的站号必须与实物一致
#
# 【通道 → 线圈地址规律】通道 N = 线圈地址 N-1：Y1=0x0000、Y2=0x0001 …
#
# 【DI 上传】各模块 DI 由 base.yaml 的 read_upload 按站号分发 publish_state：
#   0x02→中8(2 键在用)、0x03→中4(全空)、0x05→驾驶室A(4 DI)、0x06→驾驶室B(2 DI)、0x07→8DO(无 DI)
#   上电时对各模块写一次 FC06 0031H=1 开启输入主动上传（见 base.yaml on_boot）。
#
# 【LED 策略（决8 终局）】
#   ① 有负载的键 → **负载侧直连**：LED 阳极 +12V、阴极串 1~3.3kΩ 并到该路 Y 的 NO；
#   ② 无负载可并的场景键 → **8DO(0x07) 驱动双色 LED**：
#       Y1/Y2 = 灯光模式 红/绿   Y3/Y4 = 离车驻车 红/绿   Y5 = 倒车灯（跟随 中8.Y7）
#   接法均为「吸地开关」：Y.COM = LED 阴极、Y.NO = GND、阳极 = +12V。
#   颜色跟真实档位走（led_scene_sync / led_camp_sync），不跟按键次数。
# =============================================================
