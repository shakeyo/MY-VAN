# =============================================================
# 继电器模块汇总入口（485 继电器 / DO 模块）
#
# 本文件只做两件事：
#   1. 汇总 4 个继电器模块的 !include（prod.yaml 只 include 本文件）
#   2. 作为「模块 × 站号 × 路数 × 职责」的唯一索引表
#
# 【为什么站号不提到这里】站号已写死在各自的 Modbus 帧里
#   （frame 首字节），且每个帧尾的 CRC 由站号+功能码+寄存器+值算定。
#   ESPHome substitutions 是纯文本替换，不会重算 CRC —— 把站号提成
#   ${addr_xxx} 会导致「改了站号，CRC 没跟着变」，帧被模块静默丢弃。
#   故站号与帧、CRC 必须同文件存放；本表仅作对照，改站号时按表逐文件改。
#
# 【公共部分在哪】DE/RE 方向时序、排队与重发间隔、CRC 正确性坑，
#   已全部收敛在 rs485.yaml 的 rs485_write 脚本，各模块只需给一条帧。
#
# =============================================================

packages:
  relay_forehead_8ch: !include relay-forehead-8ch.yaml
  relay_mid_8ch: !include relay-mid-8ch.yaml
  relay_mid_4ch: !include relay-mid-4ch.yaml
  relay_mid_16do: !include relay-mid-16do.yaml

# =============================================================
# 模块索引
#
# | 文件                     | 位置 | 路数 | 站号 | 职责                       | DO 规格 |
# |--------------------------|------|------|------|----------------------------|---------|
# | relay-forehead-8ch.yaml  | 额头柜 |  8  | 0x01 | 射灯/户外灯/DSP/副驾排气扇/MPPT接触器(备选) | 10A |
# | relay-mid-8ch.yaml       | 中门配电箱 | 8 | 0x02 | 纯负载：主灯/氛围/排气扇/上水泵48V/水阀/冰箱/倒车灯 | 10A |
# | relay-mid-4ch.yaml       | 中门柜 |  4  | 0x03 | 低功率负载：上水泵线圈/水阀/后窗排气扇；5A 规格 | 5A |
# | relay-mid-16do.yaml      | 中门柜 |  16 | 0x05 | 全部 LED（12 现用 + 4 预留），无 DI      | 5A |
#
# 地址占用：1=额头 2=中8 3=中4 5=16DO；0x04 原车尾模块预留（已取消，倒车灯并进 中8.Y7）
#   能源设备同挂此总线：0x10=MPPT；485 传感器建议 0x20 起
#   （库仑计 TF03K 为 19200，走独立 UART，不在本总线）
#   所有模块地址均由厂家软件设置，固件内帧的站号必须与实物一致
#
# 【通道 → 线圈地址规律】通道 N = 线圈地址 N-1（4 个模块同系列，均成立）
#   Y1=0x0000、Y2=0x0001 … Y8=0x0007；16DO 的 Y1~Y16 = 0x0000~0x000F
#   ⚠ 与 MPPT 的波特率代码不同：继电器模块 9600 = 代码 1（MPPT 是代码 4）
#
# 【DI 上传】各模块 DI 由 base.yaml 的 read_upload 按站号分发 publish_state：
#   0x01→额头(8 DI)、0x02→中8、0x03→中4(4 DI)。16DO 无 DI。
#   上电时对各负载模块写一次 FC06 0031H=1 开启输入主动上传（见 base.yaml on_boot）。
#
# 【LED 策略】LED 全部集中到 relay-mid-16do.yaml；负载模块的 on_state
#   只调用其 led_* 脚本，负载模块自身不再占用任何 LED 通道。
# =============================================================
