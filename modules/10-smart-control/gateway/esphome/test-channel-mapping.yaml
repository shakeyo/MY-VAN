# =============================================================
# 阶段2：全通道映射验证（上车第一步 / 桌面预检）
# 验证目标：4 个模块全部通道的读写映射，不执行任何生产逻辑
#   - web_server 逐个点开关 → 继电器动作 + 状态回读
#   - 按物理按键 → 只打日志（按键 DI 映射确认），不触发动作
#   - 主灯键例外：按下会真的切灯（无害，兼作端到端抽验）
# 按键架构：模块主动上传驱动（0031H=1），零轮询，按键即发帧
# 烧录: esphome run test-channel-mapping.yaml
#
# 模块地址: 额头 0x01 / 中8 0x02 / 中4 0x03 / 16DO 0x05
# ⚠ 16DO 待购：未装时本固件照常跑，只是 16DO 的开关点了没反应（正常现象）。
#   到货后先用厂家软件把地址改成 5、波特率改成与全车一致，再验证。
# ⚠ 波特率 38400（出厂默认）；全车终局 9600，见 build-guide.md §4.7
# =============================================================

substitutions:
  name: myvan-485-gateway
  friendly_name: 485网关
  # 485 收发器使能脚（DE+RE 并接）：高=发送、低=接收
  # 2026-09 由 GPIO5 改到 GPIO17（紧邻 RX 16）
  de_pin: GPIO_NUM_17

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - lambda: 'gpio_set_direction(${de_pin}, GPIO_MODE_OUTPUT);'
        - delay: 3s          # 等模块上电就绪
        # 四个模块输入主动上传开启（保持寄存器 0031H=1；掉电保存状态不确定，每次上电写一次）
        # 16DO 无 DI，但同系列固件保留该寄存器，写一次无害（未装时无响应属正常）
        - script.execute: boot_enable_upload
        # 安全负载：每次上电强制关（覆盖 restore 恢复值）
        - switch.turn_off: sw_spot
        - switch.turn_off: sw_outdoor
        - switch.turn_off: sw_dsp
        - switch.turn_off: sw_fan_pass
        - switch.turn_off: sw_fan_rear
        - switch.turn_off: sw_pump
        - switch.turn_off: sw_valve
        - switch.turn_off: sw_reverse
        - script.execute: led_all_off

api:
  encryption:
    key: "BTGcLeExk4xanEi/1zwV6fVzQJiULFGZDbkXac4eFCw="

ota:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

web_server:
  port: 80

wifi:
  networks:
    - ssid: "ooxx"            # 家里调试（占位符，改成真实家庭 wifi）
      password: www.baidu.com
    # - ssid: "my-van"         # 车上网络（路由/热点方案定后启用，优先级 2）
    #   password: ""
  use_address: 192.168.5.18
  ap:
    ssid: "myvan-ap"          # 兜底 AP（调试用），与车上热点名区分
    password: "12345678"
captive_portal:

logger:
  level: INFO

uart:
  id: rs485_bus
  tx_pin: GPIO15
  rx_pin: GPIO16
  baud_rate: 38400

# ============ 485 写帧公共件（DE 时序 + 参数化写帧） ============
script:
  - id: rs485_write
    mode: queued
    parameters:
      frame: std::vector<uint8_t>
    then:
      - lambda: 'gpio_set_level(${de_pin}, 1);'
      - delay: 1ms
      - uart.write:
          id: rs485_bus
          data: !lambda 'return frame;'
      - lambda: 'id(rs485_bus).flush();'
      - lambda: 'gpio_set_level(${de_pin}, 0);'
      - delay: 10ms

  # 上电开启四个模块的主动上传（帧已按 0031H=1 算好 CRC）
  - id: boot_enable_upload
    then:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x06, 0x00, 0x31, 0x00, 0x01, 0x19, 0xC5]
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x06, 0x00, 0x31, 0x00, 0x01, 0x19, 0xF6]
      - script.execute:
          id: rs485_write
          frame: [0x03, 0x06, 0x00, 0x31, 0x00, 0x01, 0x18, 0x27]

  # ============ DI 上传解析（与生产 base.yaml 同逻辑） ============
  - id: read_upload
    mode: single
    then:
      - lambda: |-
          uint8_t buf[64];
          int len = 0;
          while (id(rs485_bus).available() && len < 64) {
            uint8_t b;
            if (id(rs485_bus).read_byte(&b)) buf[len++] = b;
          }
          // 上传帧: <模块地址> 04 <字节数N> <N 字节位图> <CRC低> <CRC高>
          // 位图 bit0 = 模块 X1。N 按模块通道数自适应（中8=2 字节、中4 可能=1 字节）。
          for (int i = 0; i + 4 < len; i++) {
            if (buf[i] != 0x01 && buf[i] != 0x02 && buf[i] != 0x03) continue;
            if (buf[i+1] != 0x04) continue;
            uint8_t n = buf[i+2];
            if (n < 1 || n > 2) continue;
            if (i + 3 + n + 2 > len) continue;
            uint16_t crc = 0xFFFF;
            for (int k = i; k < i + 3 + n; k++) {
              crc ^= buf[k];
              for (int bit = 0; bit < 8; bit++) {
                if (crc & 1) crc = (crc >> 1) ^ 0xA001;
                else crc >>= 1;
              }
            }
            if ((uint8_t) crc != buf[i+3+n] || (uint8_t) (crc >> 8) != buf[i+3+n+1]) continue;
            uint16_t r = 0;
            for (int k = 0; k < n; k++) r = (r << 8) | buf[i+3+k];
            ESP_LOGI("di", "keys addr=%02X n=%d: %04X", buf[i], n, r);
            switch (buf[i]) {
              case 0x01:  // 额头
                id(bs_cabin_spot).publish_state(r & 0x01);
                id(bs_cabin_reverse).publish_state(r & 0x02);
                id(bs_cabin_dsp).publish_state(r & 0x04);
                id(bs_cabin_fan).publish_state(r & 0x08);
                id(bs_cabin_scene).publish_state(r & 0x20);
                break;
              case 0x02:  // 中8
                id(bs_door_drain).publish_state(r & 0x01);
                id(bs_door_outdoor).publish_state(r & 0x02);
                id(bs_door_pump).publish_state(r & 0x04);
                id(bs_door_camp).publish_state(r & 0x08);
                id(bs_bed_light).publish_state(r & 0x10);
                id(bs_bed_ambient).publish_state(r & 0x20);
                id(bs_bed_fan).publish_state(r & 0x40);
                id(bs_bed_pump).publish_state(r & 0x80);
                break;
              case 0x03:  // 中4（4 路 DI）
                id(bs_bed_fridge).publish_state(r & 0x01);
                id(bs_bed_scene).publish_state(r & 0x02);
                break;
            }
            break;
          }

  # 全部 LED 灭（16DO）
  - id: led_all_off
    mode: restart
    then:
      - switch.turn_off: sw_led_y1
      - switch.turn_off: sw_led_y2
      - switch.turn_off: sw_led_y3
      - switch.turn_off: sw_led_y4
      - switch.turn_off: sw_led_y5
      - switch.turn_off: sw_led_y6
      - switch.turn_off: sw_led_y7
      - switch.turn_off: sw_led_y8
      - switch.turn_off: sw_led_y9
      - switch.turn_off: sw_led_y10

  # ---- 按键动作：本测试固件全部只打日志（主灯键例外，见 mid8 段）----
  - id: act_spot
    then: [{logger.log: 'key: 驾驶室-射灯'}]
  - id: act_reverse
    then: [{logger.log: 'key: 驾驶室-倒车灯（中8.Y7 跨模块）'}]
  - id: act_dsp
    then: [{logger.log: 'key: 驾驶室-DSP'}]
  - id: act_scene
    then: [{logger.log: 'key: 驾驶室-灯光模式'}]
  - id: act_drain
    then: [{logger.log: 'key: 入口-排水'}]
  - id: act_outdoor
    then: [{logger.log: 'key: 入口-户外灯'}]
  - id: act_pump_in
    then: [{logger.log: 'key: 入口-上水泵'}]
  - id: act_camp
    then: [{logger.log: 'key: 入口-离车驻车'}]
  - id: act_ambient
    then: [{logger.log: 'key: 主控-氛围灯'}]
  - id: act_fan
    then: [{logger.log: 'key: 主控-排气扇'}]
  - id: act_pump_bed
    then: [{logger.log: 'key: 主控-上水泵'}]
  - id: act_fridge
    then: [{logger.log: 'key: 主控-冰箱'}]
  - id: act_scene_bed
    then: [{logger.log: 'key: 主控-灯光模式'}]
  - id: key1_hold_timer
    mode: restart
    then:
      - delay: 2s
      - logger.log: 'key: 主控-主灯 长按 2s（只读，不动作）'

  - id: led_drain
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_valve).state;'}
          then: [switch.turn_on: sw_led_y1]
          else: [switch.turn_off: sw_led_y1]
  - id: led_outdoor
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_outdoor).state;'}
          then: [switch.turn_on: sw_led_y2]
          else: [switch.turn_off: sw_led_y2]
  - id: led_pump
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_pump).state;'}
          then:
            - switch.turn_on: sw_led_y3
            - switch.turn_on: sw_led_y8
          else:
            - switch.turn_off: sw_led_y3
            - switch.turn_off: sw_led_y8
  - id: led_main
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_main_light).state;'}
          then: [switch.turn_on: sw_led_y5]
          else: [switch.turn_off: sw_led_y5]
  - id: led_ambient
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_ambient).state;'}
          then: [switch.turn_on: sw_led_y6]
          else: [switch.turn_off: sw_led_y6]
  - id: led_fan
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_fan_rear).state;'}
          then: [switch.turn_on: sw_led_y7]
          else: [switch.turn_off: sw_led_y7]
  - id: led_fridge
    mode: restart
    then:
      - if:
          condition: {lambda: 'return id(sw_fridge).state;'}
          then: [switch.turn_on: sw_led_y9]
          else: [switch.turn_off: sw_led_y9]

# ============ 按键（按键只打日志；主灯键真的切灯，兼作端到端抽验） ============
binary_sensor:
  - platform: template
    name: "CabinSpot 驾驶室-射灯"
    id: bs_cabin_spot
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_spot}]
  - platform: template
    name: "CabinReverse 驾驶室-倒车灯"
    id: bs_cabin_reverse
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_reverse}]
  - platform: template
    name: "CabinDsp 驾驶室-DSP"
    id: bs_cabin_dsp
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_dsp}]
  - platform: template
    name: "CabinFan 驾驶室-换气风扇"
    id: bs_cabin_fan
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
  - platform: template
    name: "CabinScene 驾驶室-灯光模式"
    id: bs_cabin_scene
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_scene}]
  - platform: template
    name: "DoorDrain 入口-排水"
    id: bs_door_drain
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_drain}]
  - platform: template
    name: "DoorOutdoor 入口-户外灯"
    id: bs_door_outdoor
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_outdoor}]
  - platform: template
    name: "DoorPump 入口-上水泵"
    id: bs_door_pump
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_pump_in}]
  - platform: template
    name: "DoorCamp 入口-离车驻车"
    id: bs_door_camp
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_camp}]
  - platform: template
    name: "BedLight 主控-主灯"
    id: bs_bed_light
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press:
      - lambda: 'id(hold_triggered) = false;'
      - script.execute: key1_hold_timer
    on_release:
      - script.stop: key1_hold_timer
      - if:
          condition:
            lambda: 'return !id(hold_triggered);'
          then:
            - switch.toggle: sw_main_light
      - lambda: 'id(hold_triggered) = false;'
  - platform: template
    name: "BedAmbient 主控-氛围灯"
    id: bs_bed_ambient
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_ambient}]
  - platform: template
    name: "BedFan 主控-排气扇"
    id: bs_bed_fan
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_fan}]
  - platform: template
    name: "BedPump 主控-上水泵"
    id: bs_bed_pump
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_pump_bed}]
  - platform: template
    name: "BedFridge 主控-冰箱"
    id: bs_bed_fridge
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_fridge}]
  - platform: template
    name: "BedScene 主控-灯光模式"
    id: bs_bed_scene
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_scene_bed}]

# ============ DI 上传驱动 ============
interval:
  - interval: 100ms
    then:
      - script.execute: read_upload

globals:
  - id: light_scene
    type: int
    initial_value: '0'
  - id: camp_scene
    type: int
    initial_value: '0'
  - id: fan_scene
    type: int
    initial_value: '0'
  - id: hold_triggered
    type: bool
    initial_value: 'false'

# ============ 额头模块（0x01）：负载 + 按键 ============
switch:
  - platform: template
    name: "Spot 射灯"
    id: sw_spot
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x3A]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xCA]
  - platform: template
    name: "Outdoor 户外灯"
    id: sw_outdoor
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDD, 0xFA]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9C, 0x0A]
    on_state:
      - script.execute: led_outdoor
  - platform: template
    name: "DSP"
    id: sw_dsp
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x02, 0xFF, 0x00, 0x2D, 0xFA]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x02, 0x00, 0x00, 0x6C, 0x0A]
  - platform: template
    name: "FanPass 副驾排气扇"
    id: sw_fan_pass
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x03, 0xFF, 0x00, 0x7C, 0x3A]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x03, 0x00, 0x00, 0x3D, 0xCA]

  # ============ 中8 模块（0x02）：纯负载 ============
  - platform: template
    name: "MainLight 主灯"
    id: sw_main_light
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x09]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xF9]
    on_state:
      - script.execute: led_main
  - platform: template
    name: "Ambient 氛围灯"
    id: sw_ambient
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDD, 0xC9]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9C, 0x39]
    on_state:
      - script.execute: led_ambient
  - platform: template
    name: "FanRear 后窗排气扇"
    id: sw_fan_rear
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x02, 0xFF, 0x00, 0x2D, 0xC9]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x02, 0x00, 0x00, 0x6C, 0x39]
    on_state:
      - script.execute: led_fan
  - platform: template
    name: "Pump 上水泵"
    id: sw_pump
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x03, 0xFF, 0x00, 0x7C, 0x09]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x03, 0x00, 0x00, 0x3D, 0xF9]
    on_state:
      - script.execute: led_pump
  - platform: template
    name: "Valve 电控水阀"
    id: sw_valve
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x04, 0xFF, 0x00, 0xCD, 0xC8]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x04, 0x00, 0x00, 0x8C, 0x38]
    on_state:
      - script.execute: led_drain
  - platform: template
    name: "Fridge 冰箱"
    id: sw_fridge
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x05, 0xFF, 0x00, 0x9C, 0x08]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x05, 0x00, 0x00, 0xDD, 0xF8]
    on_state:
      - script.execute: led_fridge
  - platform: template
    name: "Reverse 倒车灯"
    id: sw_reverse
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x06, 0xFF, 0x00, 0x6C, 0x08]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x06, 0x00, 0x00, 0x2D, 0xF8]

  # ============ 16DO 模块（0x05）：全部 LED ============
  - platform: template
    name: "LedY1 入口排水LED"
    id: sw_led_y1
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8D, 0xBE]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCC, 0x4E]
  - platform: template
    name: "LedY2 入口户外灯LED"
    id: sw_led_y2
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x05, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDC, 0x7E]
    on_turn_off:
      - script.execute:
          id: rs485_write
