          data: [0x01, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x3A]
      - lambda: 'id(rs485_bus).flush();'
      - lambda: 'gpio_set_level(GPIO_NUM_5, 0);'
      - delay: 10ms
    on_turn_off:
      - lambda: 'gpio_set_level(GPIO_NUM_5, 1);'
      - delay: 1ms
      - uart.write:
          id: rs485_bus
          data: [0x01, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xCA]
      - lambda: 'id(rs485_bus).flush();'
      - lambda: 'gpio_set_level(GPIO_NUM_5, 0);'
