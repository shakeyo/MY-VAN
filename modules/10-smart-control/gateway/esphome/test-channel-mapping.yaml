      - script.execute: act_camp
  - platform: template
    name: "BedLight 主控-主灯"
    id: bs_bed_light
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - lambda: 'id(hold_triggered) = false;'
      - script.execute: key1_hold_timer
    on_release:
      - script.stop: key1_hold_timer
      - if:
          condition:
            lambda: 'return !id(hold_triggered);'
          then:
            - switch.toggle: sw_main_light
      - lambda: 'id(hold_triggered) = false;'
  - platform: template
    name: "BedAmbient 主控-氛围灯"
    id: bs_bed_ambient
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_ambient
  - platform: template
    name: "BedFan 主控-排气扇"
    id: bs_bed_fan
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_fan
  - platform: template
    name: "BedPump 主控-上水泵"
    id: bs_bed_pump
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_pump_bed

  # ---- 中4（0x03）----
  - platform: template
    name: "BedFridge 主控-冰箱"
    id: bs_bed_fridge
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_fridge
  - platform: template
    name: "BedScene 主控-灯光模式"
    id: bs_bed_scene
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - script.execute: act_scene_bed

# ============ 只读验证：按键动作只打日志，不执行生产逻辑 ============
# DI 按键：模块主动上传驱动（0031H=1 已开启），100ms 只读缓冲解析，零轮询
interval:
  - interval: 100ms
    then:
      - script.execute: read_upload

script:
  - id: act_spot
    then:
      - logger.log: 'key: 驾驶室-射灯'
  - id: act_dsp
    then:
      - logger.log: 'key: 驾驶室-DSP'
  - id: act_scene
    then:
      - logger.log: 'key: 驾驶室-灯光模式'
  - id: act_drain
    then:
      - logger.log: 'key: 入口-排水'
  - id: act_outdoor
    then:
      - logger.log: 'key: 入口-户外灯'
  - id: act_pump_in
    then:
      - logger.log: 'key: 入口-上水泵'
  - id: act_camp
    then:
      - logger.log: 'key: 入口-离车驻车'
  - id: act_ambient
    then:
      - logger.log: 'key: 主控-氛围灯'
  - id: act_fan
    then:
      - logger.log: 'key: 主控-排气扇'
  - id: act_pump_bed
    then:
      - logger.log: 'key: 主控-上水泵'
  - id: act_fridge
    then:
      - logger.log: 'key: 主控-冰箱'
  - id: act_scene_bed
    then:
      - logger.log: 'key: 主控-灯光模式'
  - id: key1_hold_timer
    mode: restart
    then:
      - delay: 2s
      - logger.log: 'key: 主控-主灯 长按 2s（只读，不动作）'
  - id: read_upload
    mode: single
    then:
      - lambda: |-
          uint8_t buf[64];
          int len = 0;
          while (id(rs485_bus).available() && len < 64) {
            uint8_t b;
            if (id(rs485_bus).read_byte(&b)) buf[len++] = b;
          }
          // 上传帧: <模块地址> 04 02 <16位位图> <CRC低> <CRC高>，位图 bit0=X1 ... bit7=X8，按下/释放各一次
          for (int i = 0; i + 6 < len; i++) {
            if (buf[i+1] == 0x04 && buf[i+2] == 0x02) {
              uint16_t crc = 0xFFFF;
              for (int k = i; k < i + 5; k++) {
                crc ^= buf[k];
                for (int bit = 0; bit < 8; bit++) {
                  if (crc & 1) crc = (crc >> 1) ^ 0xA001;
                  else crc >>= 1;
                }
              }
              if ((uint8_t) crc == buf[i+5] && (uint8_t) (crc >> 8) == buf[i+6]) {
                uint16_t r = ((uint16_t) buf[i+3] << 8) | buf[i+4];
                ESP_LOGI("di", "keys addr=%02X: %04X", buf[i], r);
                switch (buf[i]) {
                  case 0x01:  // 额头
                    id(bs_cabin_spot).publish_state(r & 0x01);
                    id(bs_cabin_reverse).publish_state(r & 0x02);
                    id(bs_cabin_dsp).publish_state(r & 0x04);
                    id(bs_cabin_fan).publish_state(r & 0x08);
                    id(bs_cabin_scene).publish_state(r & 0x20);
                    break;
                  case 0x02:  // 中8
                    id(bs_door_drain).publish_state(r & 0x01);
                    id(bs_door_outdoor).publish_state(r & 0x02);
                    id(bs_door_pump).publish_state(r & 0x04);
                    id(bs_door_camp).publish_state(r & 0x08);
                    id(bs_bed_light).publish_state(r & 0x10);
                    id(bs_bed_ambient).publish_state(r & 0x20);
                    id(bs_bed_fan).publish_state(r & 0x40);
                    id(bs_bed_pump).publish_state(r & 0x80);
                    break;
                  case 0x03:  // 中4
                    id(bs_bed_fridge).publish_state(r & 0x01);
                    id(bs_bed_scene).publish_state(r & 0x02);
                    break;
                }
                break;
              }
            }
          }
