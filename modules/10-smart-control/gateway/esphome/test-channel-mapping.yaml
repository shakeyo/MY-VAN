# =============================================================
# 阶段2：全通道映射验证（上车第一步 / 桌面预检）
# 验证目标：3 个模块全部通道的读写映射，不执行任何生产逻辑
#   - web_server 逐个点开关 → 继电器动作 + 状态回读（16 路）
#   - 按物理按键 → 只打日志（按键 DI 映射确认），不触发动作
#   - 主灯键例外：按下会真的切灯（无害，兼作端到端抽验）
# 按键架构：模块主动上传驱动（0031H=1），零轮询，按键即发帧
# 烧录: esphome run test-channel-mapping.yaml
# 模块地址: 额头 0x01 / 中8 0x02 / 中4 0x03
# =============================================================

substitutions:
  name: myvan-485-gateway
  friendly_name: 485网关

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - lambda: 'gpio_set_direction(GPIO_NUM_5, GPIO_MODE_OUTPUT);'
        - delay: 3s          # 等模块上电就绪
        # 三个模块输入主动上传开启（保持寄存器 0031H=1）
        - lambda: 'gpio_set_level(GPIO_NUM_5, 1);'
        - delay: 1ms
        - uart.write:
            id: rs485_bus
            data: [0x01, 0x06, 0x00, 0x31, 0x00, 0x01, 0x19, 0xC5]
        - lambda: 'id(rs485_bus).flush();'
        - lambda: 'gpio_set_level(GPIO_NUM_5, 0);'
        - delay: 10ms
        - lambda: 'gpio_set_level(GPIO_NUM_5, 1);'
        - delay: 1ms
        - uart.write:
            id: rs485_bus
            data: [0x02, 0x06, 0x00, 0x31, 0x00, 0x01, 0x19, 0xF6]
        - lambda: 'id(rs485_bus).flush();'
        - lambda: 'gpio_set_level(GPIO_NUM_5, 0);'
        - delay: 10ms
        - lambda: 'gpio_set_level(GPIO_NUM_5, 1);'
        - delay: 1ms
        - uart.write:
            id: rs485_bus
            data: [0x03, 0x06, 0x00, 0x31, 0x00, 0x01, 0x18, 0x27]
        - lambda: 'id(rs485_bus).flush();'
        - lambda: 'gpio_set_level(GPIO_NUM_5, 0);'
        - delay: 10ms
        # 安全负载：每次上电强制关（覆盖 restore 恢复值）
        - switch.turn_off: sw_spot
        - switch.turn_off: sw_outdoor
        - switch.turn_off: sw_dsp
        - switch.turn_off: sw_fan_pass
        - switch.turn_off: sw_fan_rear
        - switch.turn_off: sw_pump
        - switch.turn_off: sw_valve
        # LED DO：强制灭，与场景 globals 初始值（全关/正常）保持一致
        - switch.turn_off: sw_led_outdoor
        - switch.turn_off: sw_led_camp_green
        - switch.turn_off: sw_led_camp_red
        - switch.turn_off: sw_led_scene_red
        - switch.turn_off: sw_led_scene_green
        - switch.turn_off: sw_led_fridge

api:
  encryption:
    key: "BTGcLeExk4xanEi/1zwV6fVzQJiULFGZDbkXac4eFCw="

ota:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

web_server:
  port: 80

wifi:
