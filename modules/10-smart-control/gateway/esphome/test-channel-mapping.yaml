# =============================================================
# 阶段2：全通道映射验证（上车第一步 / 桌面预检）
# 验证目标：4 个模块全部通道的读写映射，不执行任何生产逻辑
#   - web_server 逐个点开关 → 继电器动作 + 状态回读
#   - 按物理按键 → 只打日志（按键 DI 映射确认），不触发动作
#   - 主灯键例外：按下会真的切灯（无害，兼作端到端抽验）
# 按键架构：模块主动上传驱动（0031H=1），零轮询，按键即发帧
# 烧录: esphome run test-channel-mapping.yaml
#
# 模块地址: 额头 0x01 / 中8 0x02 / 中4 0x03（16DO 0x05 已于 2026-10-30 退役，本测试件不再含 0x05）
# LED 验证：按键 LED 为「负载侧直连」（并在负载 Y 的 NO，随负载动作，无需固件）；
#   仅 2 个场景键逻辑 LED 在本文件里：中8.Y8 = 离车/驻车（02 05 00 07 …）、中4.Y4 = 灯光模式（03 05 00 03 …）
# ⚠ 波特率 38400（出厂默认）；全车终局 9600，见 build-guide.md §4.7
# =============================================================

substitutions:
  name: myvan-485-gateway
  friendly_name: 485网关
  # 485 收发器使能脚（DE+RE 并接）：高=发送、低=接收
  # 2026-09 由 GPIO5 改到 GPIO17（紧邻 RX 16）
  de_pin: GPIO_NUM_17

esphome:
  name: ${name}
  name_add_mac_suffix: false
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100
      then:
        - lambda: 'gpio_set_direction(${de_pin}, GPIO_MODE_OUTPUT);'
        - delay: 3s          # 等模块上电就绪
        # 四个模块输入主动上传开启（保持寄存器 0031H=1；掉电保存状态不确定，每次上电写一次）
        # 16DO 无 DI，但同系列固件保留该寄存器，写一次无害（未装时无响应属正常）
        - script.execute: boot_enable_upload
        # 安全负载：每次上电强制关（覆盖 restore 恢复值）
        - switch.turn_off: sw_spot
        - switch.turn_off: sw_outdoor
        - switch.turn_off: sw_dsp
        - switch.turn_off: sw_fan_pass
        - switch.turn_off: sw_fan_rear
        - switch.turn_off: sw_pump
        - switch.turn_off: sw_valve
        - switch.turn_off: sw_reverse
        - script.execute: led_all_off

api:
  encryption:
    key: "BTGcLeExk4xanEi/1zwV6fVzQJiULFGZDbkXac4eFCw="

ota:

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

web_server:
  port: 80

wifi:
  # 按顺序尝试；都连不上则自动开下方 AP（车上无路由器时直接可用）
  networks:
    - ssid: !secret wifi_home_ssid       # 家里 wifi ooxx（192.168.5.x）
      password: !secret wifi_home_password
    - ssid: !secret wifi_phone_ssid      # 手机热点 iWife（172.20.10.x）——车上无路由器时用
      password: !secret wifi_phone_password
    # - ssid: !secret wifi_van_ssid      # 车上 GL.iNet（192.168.8.x）——路由器到位后启用
    #   password: !secret wifi_van_password
  # ⚠ 不要设 use_address：写死 IP 会让 OTA 在其他网段失效，交给 mDNS 自动发现
  ap:
    ssid: "myvan-ap"          # 兜底 AP（调试用），与车上热点名区分
    password: "12345678"
captive_portal:

logger:
  level: INFO

uart:
  id: rs485_bus
  tx_pin: GPIO15
  rx_pin: GPIO16
  baud_rate: 38400

# ============ 485 写帧公共件（DE 时序 + 参数化写帧） ============
script:
  - id: rs485_write
    mode: queued
    parameters:
      frame: std::vector<uint8_t>
    then:
      - lambda: 'gpio_set_level(${de_pin}, 1);'
      - delay: 1ms
      - uart.write:
          id: rs485_bus
          data: !lambda 'return frame;'
      - lambda: 'id(rs485_bus).flush();'
      - lambda: 'gpio_set_level(${de_pin}, 0);'
      - delay: 10ms

  # 上电开启四个模块的主动上传（帧已按 0031H=1 算好 CRC）
  - id: boot_enable_upload
    then:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x06, 0x00, 0x31, 0x00, 0x01, 0x19, 0xC5]
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x06, 0x00, 0x31, 0x00, 0x01, 0x19, 0xF6]
      - script.execute:
          id: rs485_write
          frame: [0x03, 0x06, 0x00, 0x31, 0x00, 0x01, 0x18, 0x27]

  # ============ DI 上传解析（与生产 base.yaml 同逻辑） ============
  - id: read_upload
    mode: single
    then:
      - lambda: |-
          uint8_t buf[64];
          int len = 0;
          while (id(rs485_bus).available() && len < 64) {
            uint8_t b;
            if (id(rs485_bus).read_byte(&b)) buf[len++] = b;
          }
          // 上传帧: <模块地址> 04 <字节数N> <N 字节位图> <CRC低> <CRC高>
          // 位图 bit0 = 模块 X1。N 按模块通道数自适应（中8=2 字节、中4 可能=1 字节）。
          for (int i = 0; i + 4 < len; i++) {
            if (buf[i] != 0x01 && buf[i] != 0x02 && buf[i] != 0x03) continue;
            if (buf[i+1] != 0x04) continue;
            uint8_t n = buf[i+2];
            if (n < 1 || n > 2) continue;
            if (i + 3 + n + 2 > len) continue;
            uint16_t crc = 0xFFFF;
            for (int k = i; k < i + 3 + n; k++) {
              crc ^= buf[k];
              for (int bit = 0; bit < 8; bit++) {
                if (crc & 1) crc = (crc >> 1) ^ 0xA001;
                else crc >>= 1;
              }
            }
            if ((uint8_t) crc != buf[i+3+n] || (uint8_t) (crc >> 8) != buf[i+3+n+1]) continue;
            uint16_t r = 0;
            for (int k = 0; k < n; k++) r = (r << 8) | buf[i+3+k];
            ESP_LOGI("di", "keys addr=%02X n=%d: %04X", buf[i], n, r);
            // 【面板终局 2026-10-30（决1/决2/决3）】只发布在役按键；位号与模块丝印严格对应
            switch (buf[i]) {
              case 0x01:  // 额头 8 DI：X1 射灯 / X2 倒车灯 / X3 DSP / X4 换气风扇 / X5 户外灯 / X6 灯光模式
                id(bs_cabin_spot).publish_state(r & 0x01);
                id(bs_cabin_reverse).publish_state(r & 0x02);
                id(bs_cabin_dsp).publish_state(r & 0x04);
                id(bs_cabin_fan).publish_state(r & 0x08);
                id(bs_cabin_outdoor).publish_state(r & 0x10);
                id(bs_cabin_scene).publish_state(r & 0x20);
                break;
              case 0x02:  // 中8 8 DI：X1 排水 / X2 上水泵 / X4 离车驻车（X3 空，X5-X8 主控 6 键已取消）
                id(bs_door_drain).publish_state(r & 0x01);
                id(bs_door_pump).publish_state(r & 0x04);
                id(bs_door_camp).publish_state(r & 0x08);
                break;
              case 0x03:  // 中4 4 DI：全部空出（键5 冰箱 / 键6 灯光模式已随主控面板取消）
                break;
            }
            break;
          }

  # 逻辑 LED 全灭（决4：只剩 2 个场景键逻辑 LED；其余按键 LED 为负载侧直连，不经固件）
  - id: led_all_off
    mode: restart
    then:
      - switch.turn_off: sw_led_camp
      - switch.turn_off: sw_led_scene

  # ---- 按键动作：本测试固件全部只打日志（主灯键例外，见 mid8 段）----
  - id: act_spot
    then: [{logger.log: 'key: 驾驶室-射灯'}]
  - id: act_reverse
    then: [{logger.log: 'key: 驾驶室-倒车灯（中8.Y7 跨模块）'}]
  - id: act_dsp
    then: [{logger.log: 'key: 驾驶室-DSP'}]
  - id: act_scene
    then: [{logger.log: 'key: 驾驶室-灯光模式'}]
  - id: act_drain
    then: [{logger.log: 'key: 入口-排水'}]
  - id: act_outdoor
    then: [{logger.log: 'key: 驾驶室-户外灯（决3：由入口移到额头.DI5）'}]
  - id: act_pump_in
    then: [{logger.log: 'key: 入口-上水泵'}]
  - id: act_camp
    then: [{logger.log: 'key: 入口-离车驻车'}]
  - id: act_fan
    then: [{logger.log: 'key: 驾驶室-换气风扇（蓝牙扇，无继电器）'}]


# ============ 按键（按键只打日志；主灯键真的切灯，兼作端到端抽验） ============
binary_sensor:
  - platform: template
    name: "CabinSpot 驾驶室-射灯"
    id: bs_cabin_spot
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_spot}]
  - platform: template
    name: "CabinReverse 驾驶室-倒车灯"
    id: bs_cabin_reverse
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_reverse}]
  - platform: template
    name: "CabinDsp 驾驶室-DSP"
    id: bs_cabin_dsp
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_dsp}]
  - platform: template
    name: "CabinFan 驾驶室-换气风扇"
    id: bs_cabin_fan
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
  - platform: template
    name: "CabinOutdoor 驾驶室-户外灯"
    id: bs_cabin_outdoor
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_outdoor}]
  - platform: template
    name: "CabinScene 驾驶室-灯光模式"
    id: bs_cabin_scene
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_scene}]
  - platform: template
    name: "DoorDrain 入口-排水"
    id: bs_door_drain
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_drain}]
  - platform: template
    name: "DoorPump 入口-上水泵"
    id: bs_door_pump
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_pump_in}]
  - platform: template
    name: "DoorCamp 入口-离车驻车"
    id: bs_door_camp
    filters: [{delayed_on: 50ms}, {delayed_off: 50ms}]
    on_press: [{script.execute: act_camp}]

# ============ DI 上传驱动 ============
interval:
  - interval: 100ms
    then:
      - script.execute: read_upload

globals:
  - id: light_scene
    type: int
    initial_value: '0'
  - id: camp_scene
    type: int
    initial_value: '0'
  - id: fan_scene
    type: int
    initial_value: '0'

# ============ 额头模块（0x01）：负载 + 按键 ============
switch:
  - platform: template
    name: "Spot 射灯"
    id: sw_spot
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x3A]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xCA]
  - platform: template
    name: "Outdoor 户外灯"
    id: sw_outdoor
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDD, 0xFA]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9C, 0x0A]
  - platform: template
    name: "DSP"
    id: sw_dsp
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x02, 0xFF, 0x00, 0x2D, 0xFA]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x02, 0x00, 0x00, 0x6C, 0x0A]
  - platform: template
    name: "FanPass 副驾排气扇"
    id: sw_fan_pass
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x03, 0xFF, 0x00, 0x7C, 0x3A]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x01, 0x05, 0x00, 0x03, 0x00, 0x00, 0x3D, 0xCA]

  # ============ 中8 模块（0x02）：纯负载 ============
  - platform: template
    name: "MainLight 主灯"
    id: sw_main_light
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x09]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xF9]
  - platform: template
    name: "Ambient 氛围灯"
    id: sw_ambient
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDD, 0xC9]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9C, 0x39]
  - platform: template
    name: "FanRear 后窗排气扇"
    id: sw_fan_rear
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x02, 0xFF, 0x00, 0x2D, 0xC9]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x02, 0x00, 0x00, 0x6C, 0x39]
  - platform: template
    name: "Pump 上水泵"
    id: sw_pump
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x03, 0xFF, 0x00, 0x7C, 0x09]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x03, 0x00, 0x00, 0x3D, 0xF9]
  - platform: template
    name: "Valve 电控水阀（中4.Y2）"
    id: sw_valve
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x03, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDC, 0x18]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x03, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9D, 0xE8]
  - platform: template
    name: "Fridge 冰箱"
    id: sw_fridge
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x05, 0xFF, 0x00, 0x9C, 0x08]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x05, 0x00, 0x00, 0xDD, 0xF8]
  - platform: template
    name: "Reverse 倒车灯"
    id: sw_reverse
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x06, 0xFF, 0x00, 0x6C, 0x08]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x06, 0x00, 0x00, 0x2D, 0xF8]

  # ============ 场景键逻辑 LED（决4：16DO 退役，改用负载模块空余 DO） ============
  - platform: template
    name: "CampLed 离车驻车LED（中8.Y8）"
    id: sw_led_camp
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x07, 0xFF, 0x00, 0x3D, 0xC8]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x02, 0x05, 0x00, 0x07, 0x00, 0x00, 0x7C, 0x38]
  - platform: template
    name: "SceneLed 灯光模式LED（中4.Y4）"
    id: sw_led_scene
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x03, 0x05, 0x00, 0x03, 0xFF, 0x00, 0x7D, 0xD8]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x03, 0x05, 0x00, 0x03, 0x00, 0x00, 0x3C, 0x28]
