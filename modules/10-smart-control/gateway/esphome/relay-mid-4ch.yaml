# 中门 4 路模块（中门柜内/桌面，地址 0x07，软件设置）
#
# 【2026-10 迁移】原 DO 四路全空（未来负载扩展）。现将三个低功率负载从中8(0x06)
#   迁到本模块，腾出中8 的通道，并让桌面只有中4 一块模块时也能测负载：
#     Y1 = 上水泵（切外部继电器的 12V 控制线圈；48V 由该外部继电器隔离）
#     Y2 = 电控水阀（12V 常闭球阀，控制级小电流）
#     Y3 = 后窗排气扇（4 小风扇）
#     Y4 = 预留（场景键 LED 已改由 8DO 驱动）
#   ⚠ 本模块 DO 为 5A 规格，**不得接 10A 级负载**（主灯/氛围灯/冰箱仍在 中8）。
#   ⚠ switch 的 id 保持不变（sw_pump/sw_valve/sw_fan_rear），
#     因此 base.yaml / scenes.yaml 的引用无需改动。
#
# DI: DI1 主控键5（冰箱）/ DI2 主控键6（灯光模式）/ DI3-4 预留
#
# 【LED 终局（switch-assignment.md §决策更新 决4）】16DO 退役备用，LED 改为：
#   · 有负载可并的 → 负载侧直连（并到负载继电器 NO 输出）；
#   · 无负载可并的场景键 → 空余 DO 当逻辑 LED：
#       （2026-10-30 决8 更新：场景键双色 LED 已集中到 8DO 模块 0x03，见 relay-led-8ch.yaml
#        本模块 Y1-Y4 现全部回归负载/预留，不再承担 LED）
#   本文件其余 3 路（泵/水阀/排气扇）为负载，不再驱动任何 LED。
# 【按键动作】= 执行 act_xxx script（prod 在 scenes.yaml）

# 线圈地址：Y1=0x0000、Y2=0x0001、Y3=0x0002、Y4=0x0003（通道 N = 地址 N-1）
switch:
  # ---- Y1：上水泵（切外部继电器的 12V 线圈，48V 侧由外部继电器隔离）----
  - platform: template
    name: "[中4.Y1] 上水泵"
    id: sw_pump
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x07, 0x05, 0x00, 0x00, 0xFF, 0x00, 0x8C, 0x5C]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x07, 0x05, 0x00, 0x00, 0x00, 0x00, 0xCD, 0xAC]
  # ---- Y2：电控水阀（12V 常闭球阀，通电开/断电关）----
  - platform: template
    name: "[中4.Y2] 电控水阀"
    id: sw_valve
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x07, 0x05, 0x00, 0x01, 0xFF, 0x00, 0xDD, 0x9C]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x07, 0x05, 0x00, 0x01, 0x00, 0x00, 0x9C, 0x6C]
  # ---- Y3：后窗排气扇（4 小风扇）----
  - platform: template
    name: "[中4.Y3] 后窗排气扇"
    id: sw_fan_rear
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    on_turn_on:
      - script.execute:
          id: rs485_write
          frame: [0x07, 0x05, 0x00, 0x02, 0xFF, 0x00, 0x2D, 0x9C]
    on_turn_off:
      - script.execute:
          id: rs485_write
          frame: [0x07, 0x05, 0x00, 0x02, 0x00, 0x00, 0x6C, 0x6C]
  # ---- Y4：预留（线圈 0x0003）；场景键 LED 已改由 8DO(0x03) 驱动，见 relay-led-8ch.yaml ----

# 按键由 base.yaml 的 read_upload 按模块地址分发 publish_state（X1~X4 位图）
#
# 【面板终局 2026-10-30（switch-assignment.md §决策更新 决2）】中门主控 6 键**已取消**：
#   原 DI1「键5 冰箱」、DI2「键6 灯光模式」随面板一起下线，4 路 DI 全部空出。
#   冰箱改由 P4 车机大屏 / 手机面板控制（`[中8.Y6] 冰箱` 实体仍在，只是没有物理键）。
#   DI1-DI4 现全部留给**未来分散独立按钮**（床头/储物仓/户外等），
#   接线后在本文件加 binary_sensor 即可，不必动负载接线。
binary_sensor: []

# 已取消（决2，2026-10-30 固件层面下线）：
#   bs_bed_fridge  [中4.DI1] 主控-键5 冰箱
#   bs_bed_scene   [中4.DI2] 主控-键6 灯光模式
#   灯光模式循环仍保留「驾驶室键6（额头.DI6）」→ act_scene 这一条入口。
