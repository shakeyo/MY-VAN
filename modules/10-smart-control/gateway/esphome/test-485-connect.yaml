      - lambda: 'id(rs485_bus).flush();'
      - output.turn_off: de_pin
      - delay: 300ms
      - lambda: |-
          uint8_t buf[64];
          int len = 0;
          while (id(rs485_bus).available() && len < sizeof(buf)) {
            uint8_t byte;
