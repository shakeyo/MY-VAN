button:
  - platform: template
    name: "Relay1Toggle 继电器1切换"
    on_press:
      - script.execute: send_modbus_frame
  - platform: template
    name: "监听总线3秒"
    on_press:
      - script.execute: listen_bus
  - platform: template
    name: "Probe FC04读DI1"
    on_press:
      - script.execute: probe_fc04_di1
  - platform: template
    name: "Probe FC04读0x32"
    on_press:
      - script.execute: probe_fc04_0032
  - platform: template
    name: "Probe FC03读DO1"
    on_press:
      - script.execute: probe_fc03_do1
  - platform: template
    name: "Probe FC06写DO1"
    on_press:
      - script.execute: probe_fc06_do1
  - platform: template
    name: "Probe FC05写DO1"
    on_press:
      - script.execute: probe_fc05_do1
  - platform: template
    name: "Probe FC05写DO1关"
    on_press:
      - script.execute: probe_fc05_do1_off
  - platform: template
    name: "Probe FC01读DO1"
    on_press:
      - script.execute: probe_fc01_do1
  - platform: template
    name: "Probe FC01读DO2"
    on_press:
      - script.execute: probe_fc01_do2
  - platform: template
    name: "Probe FC05写DO2"
    on_press:
      - script.execute: probe_fc05_do2
