            if (len == 5) ESP_LOGI("probe", "  → 异常帧! 异常码 0x%02X (1=非法功能码 2=非法地址 3=非法数据)", buf[2]);
          } else {
            ESP_LOGI("probe", "无响应");
          }

  - id: probe_fc01_do1
    mode: single
    then:
      - logger.log: "发 FC01 读线圈 0x0000 (DO1)"
      - output.turn_on: de_pin
      - delay: 1ms
