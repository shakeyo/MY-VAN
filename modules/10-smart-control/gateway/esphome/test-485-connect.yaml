            ESP_LOGI("probe", "响应 %d 字节:", len);
            for (int i = 0; i < len; i++) ESP_LOGI("probe", "  0x%02X", buf[i]);
            if (len == 5) ESP_LOGI("probe", "  → 异常帧! 异常码 0x%02X (1=非法功能码 2=非法地址 3=非法数据)", buf[2]);
          } else {
            ESP_LOGI("probe", "无响应");
          }

  - id: probe_fc03_do1
    mode: single
    then:
      - logger.log: "发 FC03 读保持寄存器 0x0000 (DO1)"
      - output.turn_on: de_pin
      - delay: 1ms
      - uart.write:
          id: rs485_bus
          data: [0x01, 0x03, 0x00, 0x00, 0x00, 0x01, 0x0A, 0x84]
      - lambda: 'id(rs485_bus).flush();'
      - output.turn_off: de_pin
      - delay: 300ms
      - lambda: |-
          uint8_t buf[64];
          int len = 0;
          while (id(rs485_bus).available() && len < sizeof(buf)) {
