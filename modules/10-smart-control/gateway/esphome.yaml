# ESPHome 配置模板

```yaml
esphome:
  name: rv-485-gateway
  friendly_name: "房车485网关"
  board: esp32-s3-devkitc-1

wifi:
  ssid: "xxoo"
  password: "www.baidu.com"
  manual_ip:
    static_ip: 192.168.8.20
    gateway: 192.168.8.1
    subnet: 255.255.255.0

api:
  encryption:
    key: "你的加密密钥"

ota:
  password: "你的OTA密码"

logger:
  level: INFO

# 485 串口配置（MAX3485 3.3V 直连）
uart:
  id: uart_485
  tx_pin: GPIO15
  rx_pin: GPIO16
  baud_rate: 38400
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_485
  uart_id: uart_485
  flow_control_pin: GPIO5

# ===== 继电器控制（按实际地址修改）=====
switch:
  - platform: modbus_controller
    modbus_controller_id: relay_ctrl
    name: "房车顶灯"
    id: rv_light_top
    register_type: coil
    address: 0x0000
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: modbus_controller
    modbus_controller_id: relay_ctrl
    name: "房车水泵"
    id: rv_water_pump
    register_type: coil
    address: 0x0001
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: modbus_controller
    modbus_controller_id: relay_ctrl
    name: "房车换气扇"
    id: rv_fan
    register_type: coil
    address: 0x0002
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: modbus_controller
    modbus_controller_id: relay_ctrl
    name: "逆变器总开关"
    id: rv_inverter
    register_type: coil
    address: 0x0003
    restore_mode: RESTORE_DEFAULT_OFF

modbus_controller:
  - id: relay_ctrl
    address: 0x01
    modbus_id: modbus_485
    setup_priority: -10
    command_throttle: 50ms
    update_interval: 2s

# ===== 温湿度传感器（485型，地址0x02）=====
sensor:
  - platform: modbus_controller
    modbus_controller_id: env_sensor
    name: "车内温度"
    id: indoor_temp
    register_type: holding
    address: 0x0001
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: env_sensor
    name: "车内湿度"
    id: indoor_humidity
    register_type: holding
    address: 0x0002
    unit_of_measurement: "%"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - multiply: 0.1

modbus_controller:
  - id: env_sensor
    address: 0x02
    modbus_id: modbus_485
    update_interval: 5s
```
