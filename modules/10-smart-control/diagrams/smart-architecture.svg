    <rect x="440" y="856" width="18" height="14" rx="3" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="466" y="868" font-size="11" fill="#333">485 继电器模块（终端执行）</text>
    <line x1="590" y1="863" x2="616" y2="863" stroke="#00838f" stroke-width="4"/>
