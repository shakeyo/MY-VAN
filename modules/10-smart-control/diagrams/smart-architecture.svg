    <line x1="740" y1="863" x2="766" y2="863" stroke="#1565c0" stroke-width="3"/>
    <text x="774" y="868" font-size="11" fill="#333">WiFi / 网络</text>
    <line x1="860" y1="863" x2="886" y2="863" stroke="#9e9e9e" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="894" y="868" font-size="11" fill="#333">虚线 = 后期 / 待选型</text>
    <text x="1020" y="868" font-size="10.5" fill="#777">按键/传感器详细接线见 04-power-system 与 sensors/</text>
