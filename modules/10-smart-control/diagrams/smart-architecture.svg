<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="1280" height="900" font-family="sans-serif">
  <text x="640" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">智能控制总体架构（三级：中枢 N100 → 边缘 ESP32 → 终端 485）</text>
  <text x="640" y="52" text-anchor="middle" font-size="12" fill="#666">HA 不承载安全关键自动化 —— 安全逻辑全在 ESP32 本地（断网照跑），HA 挂了只丢 UI/远程/通知（见 n100-ha/design.md）</text>

  <!-- ================= N100 中枢 ================= -->
  <rect x="240" y="64" width="800" height="156" rx="10" fill="#f1f8e9" stroke="#558b2f" stroke-width="3"/>
  <text x="640" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#33691e">N100 中枢 — HAOS（Supervisor · PVE 虚拟机）· 7×24 常开（待实测功耗定策略）</text>
  <g font-size="11.5">
    <rect x="256" y="102" width="184" height="34" rx="5" fill="#fff" stroke="#7cb342" stroke-width="2"/>
    <text x="348" y="123" text-anchor="middle" fill="#33691e" font-weight="bold">HA Dashboard</text>
    <rect x="452" y="102" width="184" height="34" rx="5" fill="#fff" stroke="#7cb342" stroke-width="2"/>
    <text x="544" y="118" text-anchor="middle" fill="#33691e" font-weight="bold">能源面板</text>
    <text x="544" y="131" text-anchor="middle" fill="#558b2f" font-size="10">SolarTotal + PZEM 电量</text>
    <rect x="648" y="102" width="184" height="34" rx="5" fill="#fff" stroke="#7cb342" stroke-width="2"/>
    <text x="740" y="118" text-anchor="middle" fill="#33691e" font-weight="bold">历史 / 通知</text>
    <text x="740" y="131" text-anchor="middle" fill="#558b2f" font-size="10">Companion App 推送</text>
    <rect x="844" y="102" width="184" height="34" rx="5" fill="#fff" stroke="#7cb342" stroke-width="2"/>
    <text x="936" y="118" text-anchor="middle" fill="#33691e" font-weight="bold">Tailscale 远程</text>
    <text x="936" y="131" text-anchor="middle" fill="#558b2f" font-size="10">车外手机 / PC 访问</text>

    <rect x="256" y="146" width="184" height="34" rx="5" fill="#fff" stroke="#7cb342" stroke-width="2"/>
    <text x="348" y="162" text-anchor="middle" fill="#33691e" font-weight="bold">机器人：HA Assist 语音</text>
    <text x="348" y="175" text-anchor="middle" fill="#558b2f" font-size="10">唤醒词 + TTS + 表情渲染</text>
    <rect x="452" y="146" width="184" height="34" rx="5" fill="#fff" stroke="#7cb342" stroke-width="2" stroke-dasharray="5,3"/>
    <text x="544" y="162" text-anchor="middle" fill="#33691e" font-weight="bold">Frigate AI 监控</text>
    <text x="544" y="175" text-anchor="middle" fill="#558b2f" font-size="10">后期 · 人形/车辆识别</text>
    <rect x="648" y="146" width="184" height="34" rx="5" fill="#fff" stroke="#7cb342" stroke-width="2"/>
    <text x="740" y="162" text-anchor="middle" fill="#33691e" font-weight="bold">Mosquitto MQTT</text>
    <text x="740" y="175" text-anchor="middle" fill="#558b2f" font-size="10">OBD / 传感器数据汇聚</text>
    <rect x="844" y="146" width="184" height="34" rx="5" fill="#fff" stroke="#7cb342" stroke-width="2"/>
    <text x="936" y="162" text-anchor="middle" fill="#33691e" font-weight="bold">非关键高阶自动化</text>
    <text x="936" y="175" text-anchor="middle" fill="#558b2f" font-size="10">天气 / 日程 / 回家检测</text>
  </g>
  <text x="640" y="206" text-anchor="middle" font-size="10.5" fill="#558b2f">供电：12V 常电母线（DCDC 输出，见 04-power-system）</text>

  <!-- ================= ESP32 边缘 ================= -->
  <rect x="80" y="290" width="420" height="130" rx="10" fill="#ede7f6" stroke="#5e35b1" stroke-width="3"/>
  <text x="290" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#4527a0">ESP32-S3 网关（ESPHome）— 中门配电箱 · 断网可用</text>
  <g font-size="11">
    <rect x="96" y="328" width="188" height="40" rx="5" fill="#fff" stroke="#9575cd" stroke-width="2"/>
    <text x="190" y="345" text-anchor="middle" fill="#4527a0" font-weight="bold">485 桥接（9600 8N1）</text>
    <text x="190" y="360" text-anchor="middle" fill="#5e35b1" font-size="10">全车单总线 · MAX3485</text>
    <rect x="292" y="328" width="192" height="40" rx="5" fill="#fff" stroke="#9575cd" stroke-width="2"/>
    <text x="388" y="345" text-anchor="middle" fill="#4527a0" font-weight="bold">按键主动上传驱动</text>
    <text x="388" y="360" text-anchor="middle" fill="#5e35b1" font-size="10">按键即发帧 ≤100ms · 零轮询</text>
    <rect x="96" y="376" width="276" height="34" rx="5" fill="#fff" stroke="#9575cd" stroke-width="2"/>
    <text x="234" y="397" text-anchor="middle" fill="#4527a0" font-weight="bold">本地自动化：按键联动 / 离车·驻车 / 灯光场景 / 长按全关</text>
    <rect x="380" y="376" width="104" height="34" rx="5" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="432" y="390" text-anchor="middle" fill="#b71c1c" font-weight="bold" font-size="10">安全关键</text>
    <text x="432" y="403" text-anchor="middle" fill="#b71c1c" font-size="10">低温禁充/待机断电</text>
  </g>

  <!-- N100 ↔ ESP32 WiFi -->
  <path d="M520,220 L520,258 L340,258 L340,290" fill="none" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-b)"/>
  <text x="430" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#1565c0">WiFi 固定 IP 192.168.8.20 · ESPHome native API（自动发现实体）</text>
  <defs>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#00838f"/>
    </marker>
  </defs>

  <!-- ================= 物理按键 ================= -->
  <rect x="600" y="290" width="460" height="130" rx="10" fill="#eceff1" stroke="#546e7a" stroke-width="3"/>
  <text x="830" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#37474f">物理按键（3 个面板）— 最终冗余入口（机械，永远可用）</text>
  <g font-size="11.5">
    <text x="620" y="340" fill="#333" font-weight="bold">驾驶室 6 键</text>
    <text x="830" y="340" fill="#555">→ 额头模块（同柜直连，14 芯）</text>
    <text x="620" y="366" fill="#333" font-weight="bold">入口 4 键</text>
    <text x="830" y="366" fill="#555">→ 中8（14 芯 A：排水/户外灯/水泵/离车）</text>
    <text x="620" y="392" fill="#333" font-weight="bold">主控 6 键</text>
    <text x="830" y="392" fill="#555">→ 键1-4 中8（14 芯 B）+ 键5-6 中4（8P 短跳线）</text>
  </g>
  <text x="830" y="412" text-anchor="middle" font-size="10.5" fill="#777">按钮线走线槽，与功率线分槽；线色/芯位见 04-power-system/14core-cable.svg</text>

  <!-- 面板 → 模块（DI 键） -->
  <g stroke="#1565c0" stroke-width="2" fill="none">
    <path d="M640,420 L410,520"/>
    <path d="M740,420 L540,520"/>
    <path d="M860,420 L640,520"/>
    <path d="M920,420 L730,520"/>
  </g>
  <text x="540" y="462" font-size="10.5" fill="#1565c0">DI 按键信号（进模块 X1-X8）</text>

  <!-- ================= 485 总线 ================= -->
  <text x="100" y="466" font-size="13" font-weight="bold" fill="#00838f">RS485 总线（9600 8N1 · 手拉手菊花链 · 严禁星型）</text>
  <line x1="100" y1="480" x2="1190" y2="480" stroke="#00838f" stroke-width="4"/>
  <line x1="100" y1="488" x2="1190" y2="488" stroke="#00838f" stroke-width="3" stroke-dasharray="8,5"/>
  <text x="1160" y="504" text-anchor="end" font-size="10.5" fill="#00838f">A（实线）/ B（虚线）· RVSP 屏蔽双绞 · 屏蔽层单端接地（ESP32 端）</text>

  <!-- 终端电阻 -->
  <g>
    <rect x="96" y="470" width="10" height="28" rx="2" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="101" y="512" text-anchor="middle" font-size="10.5" fill="#333">120Ω</text>
    <rect x="1186" y="470" width="10" height="28" rx="2" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="1191" y="512" text-anchor="middle" font-size="10.5" fill="#333">120Ω</text>
  </g>
  <text x="1191" y="526" text-anchor="middle" font-size="9.5" fill="#777">末端=中4端</text>
  <text x="1191" y="538" text-anchor="middle" font-size="9.5" fill="#777">（装车尾后移）</text>

  <!-- ESP32 → 总线 -->
  <path d="M290,420 L290,480" stroke="#00838f" stroke-width="3" marker-end="url(#arrow-g)"/>
  <text x="300" y="448" font-size="10.5" fill="#00838f">网关挂接点（并线）</text>

  <!-- 节点：继电器模块 -->
  <g>
    <line x1="380" y1="488" x2="380" y2="520" stroke="#00838f" stroke-width="2.5"/>
    <rect x="318" y="520" width="124" height="84" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
    <text x="380" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">额头 8 路</text>
    <text x="380" y="556" text-anchor="middle" font-size="10" fill="#333">地址 1 · 额头柜</text>
    <text x="380" y="572" text-anchor="middle" font-size="10" fill="#555">射灯/户外灯/</text>
    <text x="380" y="585" text-anchor="middle" font-size="10" fill="#555">DSP/副驾风扇</text>
    <text x="380" y="598" text-anchor="middle" font-size="10" fill="#555">+ 驾驶室 6 键 DI</text>
  </g>
  <g>
    <line x1="550" y1="488" x2="550" y2="520" stroke="#00838f" stroke-width="2.5"/>
    <rect x="488" y="520" width="124" height="84" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
    <text x="550" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">中门 8 路</text>
    <text x="550" y="556" text-anchor="middle" font-size="10" fill="#333">地址 2 · 中门配电箱</text>
    <text x="550" y="572" text-anchor="middle" font-size="10" fill="#555">主灯/氛围/扇/泵/</text>
    <text x="550" y="585" text-anchor="middle" font-size="10" fill="#555">阀/冰箱 + LED DO</text>
    <text x="550" y="598" text-anchor="middle" font-size="10" fill="#555">+ 入口/主控键 DI</text>
  </g>
  <g>
    <line x1="720" y1="488" x2="720" y2="520" stroke="#00838f" stroke-width="2.5"/>
    <rect x="658" y="520" width="124" height="84" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2.5"/>
    <text x="720" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#e65100">中门 4 路</text>
    <text x="720" y="556" text-anchor="middle" font-size="10" fill="#333">地址 3 · 中门柜</text>
    <text x="720" y="572" text-anchor="middle" font-size="10" fill="#555">主控键5-6 LED DO</text>
    <text x="720" y="585" text-anchor="middle" font-size="10" fill="#777">（已接线未通电，</text>
    <text x="720" y="598" text-anchor="middle" font-size="10" fill="#777">插保险即上线）</text>
  </g>
  <g>
    <line x1="880" y1="488" x2="880" y2="520" stroke="#9e9e9e" stroke-width="2.5" stroke-dasharray="6,4"/>
    <rect x="818" y="520" width="124" height="84" rx="6" fill="#fafafa" stroke="#9e9e9e" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="880" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#757575">车尾 4 路</text>
    <text x="880" y="556" text-anchor="middle" font-size="10" fill="#757575">地址 4 · 车尾柜</text>
    <text x="880" y="572" text-anchor="middle" font-size="10" fill="#9e9e9e">倒车灯/车尾户外灯/</text>
    <text x="880" y="585" text-anchor="middle" font-size="10" fill="#9e9e9e">车尾点烟器</text>
    <text x="880" y="598" text-anchor="middle" font-size="10" fill="#9e9e9e">（后期新购）</text>
  </g>
  <g>
    <line x1="1030" y1="488" x2="1030" y2="520" stroke="#00838f" stroke-width="2.5"/>
    <rect x="966" y="520" width="128" height="84" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
    <text x="1030" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#00695c">MPPT 易科 Fcu</text>
    <text x="1030" y="556" text-anchor="middle" font-size="10" fill="#333">地址 0x10 · 9600</text>
    <text x="1030" y="572" text-anchor="middle" font-size="10" fill="#555">10s 轮询 0xA3</text>
    <text x="1030" y="585" text-anchor="middle" font-size="10" fill="#555">控 0xC0/0xD0</text>
    <text x="1030" y="598" text-anchor="middle" font-size="10" fill="#00695c">待机断电/低温禁充</text>
  </g>
  <g>
    <line x1="1160" y1="488" x2="1160" y2="520" stroke="#00838f" stroke-width="2.5"/>
    <rect x="1096" y="520" width="128" height="84" rx="6" fill="#e0f2f1" stroke="#00897b" stroke-width="2.5"/>
    <text x="1160" y="540" text-anchor="middle" font-size="12" font-weight="bold" fill="#00695c">PZEM-017</text>
    <text x="1160" y="556" text-anchor="middle" font-size="10" fill="#333">地址 0x11 · 待购</text>
    <text x="1160" y="572" text-anchor="middle" font-size="10" fill="#555">48V 电池侧</text>
    <text x="1160" y="585" text-anchor="middle" font-size="10" fill="#555">V / I / P / 累计电量</text>
    <text x="1160" y="598" text-anchor="middle" font-size="10" fill="#00695c">HA 能源面板数据源</text>
  </g>

  <!-- 485 传感器注记 -->
  <text x="1030" y="624" text-anchor="middle" font-size="10.5" fill="#00897b">485 温湿度/水位传感器也串上此总线（后期，选型必须 9600 8N1 与全车同速）</text>

  <!-- ================= 底部：交互入口 ================= -->
  <line x1="150" y1="815" x2="1150" y2="815" stroke="#1565c0" stroke-width="3"/>
  <path d="M640,815 L640,222" stroke="#1565c0" stroke-width="3" marker-end="url(#arrow-b)"/>
  <text x="652" y="790" font-size="11" font-weight="bold" fill="#1565c0">WiFi / 有线 / MQTT（全部汇入 N100）</text>

  <!-- 机器人 -->
  <g>
    <line x1="210" y1="690" x2="210" y2="815" stroke="#1565c0" stroke-width="2.5"/>
    <rect x="80" y="660" width="260" height="130" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2.5" stroke-dasharray="7,5"/>
    <text x="210" y="684" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#616161">中控台机器人（后期 · 待选型）</text>
    <text x="96" y="706" font-size="10.5" fill="#555">大脑在 N100：HA Assist 语音管线</text>
    <text x="96" y="722" font-size="10.5" fill="#555">+ 表情渲染（openWakeWord 本地唤醒）</text>
    <text x="96" y="742" font-size="10.5" fill="#555">本体 = 无脑外设：</text>
    <text x="96" y="758" font-size="10.5" fill="#555">表情屏 / 麦克风阵列 / 喇叭 / 舵机 ×N</text>
    <text x="96" y="776" font-size="10.5" fill="#777">ESP32 身体桥（USB-CDC 倾向）：PWM/触摸/灯</text>
  </g>

  <!-- 显示终端 -->
  <g>
    <line x1="470" y1="690" x2="470" y2="815" stroke="#1565c0" stroke-width="2.5"/>
    <rect x="360" y="660" width="220" height="130" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2.5"/>
    <text x="470" y="684" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#0d47a1">显示终端（Dashboard 三备份）</text>
    <text x="376" y="708" font-size="10.5" fill="#333">· 安卓车机 10-13"（Fully Kiosk，.30）</text>
    <text x="376" y="726" font-size="10.5" fill="#333">· 小米平板4（副驾/后床旁快拆，直供电）</text>
    <text x="376" y="744" font-size="10.5" fill="#333">· 手机（Companion App + 推送）</text>
    <text x="376" y="766" font-size="10.5" fill="#777">互为备份：任一终端可看可控制</text>
  </g>

  <!-- 监控 -->
  <g>
    <line x1="760" y1="690" x2="760" y2="815" stroke="#1565c0" stroke-width="2.5"/>
    <rect x="640" y="660" width="240" height="130" rx="8" fill="#fafafa" stroke="#9e9e9e" stroke-width="2.5" stroke-dasharray="7,5"/>
    <text x="760" y="684" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#616161">视频监控（后期）</text>
    <text x="656" y="708" font-size="10.5" fill="#555">AHD 摄像头 ×4（原车摄像头 Y 型并联）</text>
    <text x="656" y="726" font-size="10.5" fill="#555">→ DVR 编码器（有线 .100）</text>
    <text x="656" y="744" font-size="10.5" fill="#555">→ RTSP → N100 Frigate（AI 识别）</text>
    <text x="656" y="762" font-size="10.5" fill="#555">→ HA 告警/回放 → 平板/手机查看</text>
  </g>

  <!-- OBD -->
  <g>
    <line x1="1030" y1="690" x2="1030" y2="815" stroke="#1565c0" stroke-width="2.5"/>
    <rect x="920" y="660" width="230" height="130" rx="8" fill="#fffde7" stroke="#f9a825" stroke-width="2.5"/>
    <text x="1035" y="684" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#f57f17">OBD-II 车辆数据</text>
    <text x="936" y="708" font-size="10.5" fill="#333">ELM327（蓝牙）→ 安卓车机 Torque</text>
    <text x="936" y="726" font-size="10.5" fill="#333">→ MQTT（Mosquitto .13）→ HA</text>
    <text x="936" y="748" font-size="10.5" fill="#555">用途：RPM&gt;500 行车充电判定、</text>
    <text x="936" y="764" font-size="10.5" fill="#555">电压跳变迎宾、能耗统计</text>
  </g>

