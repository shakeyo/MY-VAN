uart:
  id: rs485_bus
  tx_pin: GPIO15
  rx_pin: GPIO16
  baud_rate: 9600

output:
  - platform: gpio
    id: de_pin
    pin: GPIO5

script:
  - id: send_modbus_frame
    mode: single
    then:
      - logger.log: "切换到发送模式 (EN=HIGH)"
      - output.turn_on: de_pin
      - delay: 1ms
      - logger.log: "发送 Modbus 报文"
      - uart.write:
          id: rs485_bus
          data: "\x01\x03\x00\x00\x00\x01\x84\x0A"
      - delay: 80ms                     # 【增加】确保数据全部发送完毕
      - logger.log: "切换到接收模式 (EN=LOW)"
      - output.turn_off: de_pin
      - delay: 200ms                    # 等待回环数据到达 RX 缓冲区
      - lambda: |-
          uint8_t buf[64];
          int len = 0;
          while (id(rs485_bus).available() && len < sizeof(buf)) {
            uint8_t byte;
            if (id(rs485_bus).read_byte(&byte)) {
              buf[len++] = byte;
            }
          }
          if (len > 0) {
            ESP_LOGI("main", "✅ 收到 %d 个字节：", len);
            for (int i = 0; i < len; i++) {
              ESP_LOGI("main", "0x%02X", buf[i]);
            }
          } else {
            ESP_LOGI("main", "❌ 缓冲区为空");
          }
          
button:
  - platform: template
    name: "485测试发送"
    on_press:
      - script.execute: send_modbus_frame
