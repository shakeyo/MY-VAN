<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" font-family="sans-serif">
  <text x="580" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">中门配电箱 端子排布局（箱底 · 功率区 + 控制区）</text>
  <text x="580" y="54" text-anchor="middle" font-size="12" fill="#666">每负载正负成对出线：正 → 正极区对应位，负 → 负极区（全桥，任一位）· 中间用隔板分隔控制区</text>

