    <text x="532" y="176">中8.R4.NO</text>
    <text x="588" y="176">中8.R7.NO</text>
  </g>

  <!-- ========== 功率负极区 ========== -->
  <text x="60" y="226" font-size="14" font-weight="bold" fill="#111">功率负极区（黑色 · 短接片全桥接 = 负汇流）</text>
  <g font-size="11">
