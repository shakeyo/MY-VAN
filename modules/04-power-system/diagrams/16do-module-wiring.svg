    <text x="443" y="272" fill="#333">COM=LED阴(预留)</text>
    <text x="443" y="290" fill="#333">NO=GND(黑)</text>
    <text x="443" y="320" font-size="8" fill="#78909c">未来负载</text>

    <rect x="529" y="232" width="155" height="92" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="606" y="252" font-size="11" font-weight="bold" fill="#00695c">Y12 车尾扩展2</text>
    <text x="606" y="272" fill="#333">COM=LED阴(预留)</text>
    <text x="606" y="290" fill="#333">NO=GND(黑)</text>
    <text x="606" y="320" font-size="8" fill="#78909c">未来负载</text>

    <rect x="692" y="232" width="155" height="92" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="769" y="252" font-size="11" font-weight="bold" fill="#757575">Y13 预留</text>
    <text x="769" y="280" fill="#999">空</text>
    <text x="769" y="320" font-size="8" fill="#9e9e9e">未来按钮</text>

    <rect x="855" y="232" width="155" height="92" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="932" y="252" font-size="11" font-weight="bold" fill="#757575">Y14 预留</text>
    <text x="932" y="280" fill="#999">空</text>
    <text x="932" y="320" font-size="8" fill="#9e9e9e">未来按钮</text>

    <rect x="1018" y="232" width="155" height="92" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="1095" y="252" font-size="11" font-weight="bold" fill="#757575">Y15 预留</text>
    <text x="1095" y="280" fill="#999">空</text>
    <text x="1095" y="320" font-size="8" fill="#9e9e9e">未来按钮</text>

    <rect x="1181" y="232" width="155" height="92" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="1258" y="252" font-size="11" font-weight="bold" fill="#757575">Y16 预留</text>
    <text x="1258" y="280" fill="#999">空</text>
    <text x="1258" y="320" font-size="8" fill="#9e9e9e">未来按钮</text>
  </g>

  <!-- ============ 下排：485 + 电源 ============ -->
  <text x="40" y="348" font-size="14" font-weight="bold" fill="#00695c">【下排】485 A B GND · 电源（无 DI 输入）</text>

  <g font-size="9" text-anchor="middle">
    <rect x="40" y="360" width="60" height="100" rx="3" fill="#fff" stroke="#00897b" stroke-width="2"/>
    <text x="70" y="384" font-size="12" font-weight="bold" fill="#00695c">A</text>
    <circle cx="70" cy="408" r="7" fill="#ffffff" stroke="#999"/>
    <text x="70" y="438" font-size="7" fill="#333">485白</text>

    <rect x="108" y="360" width="60" height="100" rx="3" fill="#fff" stroke="#00897b" stroke-width="2"/>
    <text x="138" y="384" font-size="12" font-weight="bold" fill="#00695c">B</text>
    <circle cx="138" cy="408" r="7" fill="#263238"/>
    <text x="138" y="438" font-size="7" fill="#333">485黑</text>

    <rect x="176" y="360" width="70" height="100" rx="3" fill="#fff" stroke="#00897b" stroke-width="2"/>
    <text x="211" y="380" font-size="9" font-weight="bold" fill="#00695c">GND</text>
    <text x="211" y="398" font-size="7.5" fill="#00695c">485地</text>
    <text x="211" y="418" font-size="7" fill="#78909c">独立</text>
    <text x="211" y="444" font-size="7" fill="#78909c">屏蔽单端</text>

    <rect x="254" y="360" width="70" height="100" rx="3" fill="#fff" stroke="#c62828" stroke-width="2.5"/>
    <text x="289" y="380" font-size="9.5" font-weight="bold" fill="#b71c1c">VCC+</text>
    <circle cx="289" cy="408" r="7" fill="#c62828"/>
    <text x="289" y="434" font-size="7.5" fill="#b71c1c">红12V</text>
    <text x="289" y="454" font-size="7" fill="#78909c">12V控+</text>

    <rect x="332" y="360" width="70" height="100" rx="3" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <text x="367" y="380" font-size="9.5" font-weight="bold" fill="#111">GND-</text>
    <circle cx="367" cy="408" r="7" fill="#263238"/>
    <text x="367" y="434" font-size="7.5" fill="#111">黑0V</text>
    <text x="367" y="454" font-size="7" fill="#78909c">负极排</text>
  </g>

  <!-- ============ 下半：接线说明 ============ -->
  <text x="40" y="496" font-size="15" font-weight="bold" fill="#f57f17">接线说明</text>

  <g font-size="11" fill="#333">
    <text x="40" y="520" font-size="12.5" font-weight="bold" fill="#00695c">16DO = 全部 LED 的唯一模块（16路 DO，5A，一个485地址，ESPhome一个设备）</text>
    <text x="40" y="542">· LED 回路：LED阳极(共阳)→+12V控+；LED阴极→电阻(裸LED串1-3.3kΩ)→Y的COM；Y的NO→GND</text>
    <text x="40" y="564">· Y 吸合 = COM-NO 导通 = LED 阴极经触点回 GND = 灯亮（软件 ESPhome 跟踪对应负载同步亮灭）</text>
    <text x="40" y="586">· 入口4键 LED阴走 入口复合线位9/10/11/12 · 主控1-4走 主控复合线位9/10/11/12 · 键5-6走 位13/14（经中门柜汇总排 LED 区就地并）</text>
    <text x="40" y="608">· 16DO 无 DI（16路全继电器），按钮 DI 经 DI 主干从中8/中4 搬到中门柜汇总排，再分面板</text>
  </g>

  <rect x="720" y="508" width="640" height="140" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="2"/>
  <text x="740" y="532" font-size="12.5" font-weight="bold" fill="#0d47a1">LED 阴线 → 16DO 对应表</text>
  <g font-size="10.5" fill="#333">
    <text x="740" y="554">入口：入口复合线位9→Y1排水 · 位10→Y2户外 · 位11→Y3泵 · 位12→Y4离车驻车</text>
    <text x="740" y="574">主控：主控复合线位9→Y5主灯 · 位10→Y6氛围 · 位11→Y7排气扇 · 位12→Y8泵</text>
    <text x="740" y="594">主控5-6：主控复合线位13→Y9冰箱 · 位14→Y10灯光模式</text>
    <text x="740" y="614">车尾：Y11/Y12 预留 · Y13-16 未来按钮</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="672" width="1300" height="180" rx="10" fill="#fffde7" fill-opacity="0.85" stroke="#f9a825" stroke-width="2"/>
  <text x="64" y="700" font-size="14" font-weight="bold" fill="#f57f17">要点</text>
  <text x="64" y="728" font-size="12.5" fill="#333">◆ 16DO 只有继电器(5A)，只走 LED 小电流，绝不接大功率负载（负载在中8/中4，10A）</text>
  <text x="64" y="752" font-size="12.5" fill="#333">◆ 供电 VCC+红/GND-黑（12V，从中门柜控制区取）；485 A=白 B=黑 对绞，485GND 独立，屏蔽单端接</text>
  <text x="64" y="776" font-size="12.5" fill="#333">◆ 并线点：16DO 阴极限(COM)就地并进中门柜汇总排 LED 区；GND(NO端)/12V(共阳) 公共 —— 面板复合线从汇总排取对应 Y，不并</text>
  <text x="64" y="800" font-size="12.5" fill="#333">⚠ 场景键(键4离车驻车、键6灯光模式)已降单色；双控泵两键各占 Y3/Y8 两颗 LED；Y13-16 预留未来按钮</text>
  <text x="64" y="824" font-size="10.5" fill="#78909c">完整 LED 分配见 switch-assignment.md「LED策略」；两端标签格式 模块-性质-去向。</text>
</svg>
