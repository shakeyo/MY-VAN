    <text x="280" y="272" fill="#333">COM=LED阴(主控复合线位14)</text>
    <text x="280" y="290" fill="#333">NO=GND(黑)</text>
    <text x="280" y="320" font-size="8" fill="#00897b">单色(亮=场景)</text>

    <rect x="366" y="232" width="155" height="92" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
