  <text x="700" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">16DO 模块 · 全部 LED · 对线接线图（上半端子 · 下半说明）</text>
  <text x="700" y="58" text-anchor="middle" font-size="12.5" fill="#666">16DO = 16路继电器全做LED(吸地开关·无DI·5A·一个485地址) · 12现用+4预留 · 485=对绞黑白 · 电源=红黑</text>

  <!-- ============ 上排 Y1~Y8 ============ -->
