  <text x="700" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">中4 模块 · 未来负载扩展 + DI · 对线接线图（上半端子 · 下半说明）</text>
  <text x="700" y="58" text-anchor="middle" font-size="12.5" fill="#666">中4 = 未来负载4路(10A·现空) + DI读键5-6 · 485=对绞黑白 · 电源=红黑 · LED 不接这里(走16DO)</text>

  <!-- ============ 上半：继电器 Y1~Y4（未来负载） ============ -->
