    <text x="546" y="298" font-size="7.5" fill="#111">黑0V</text>
    <text x="546" y="322" font-size="7" fill="#78909c">控D跨箱</text>
  </g>

  <!-- ============ 下半：接线说明 ============ -->
  <text x="40" y="366" font-size="15" font-weight="bold" fill="#f57f17">接线说明</text>

  <g font-size="11" fill="#333">
    <text x="40" y="390" font-size="12.5" font-weight="bold" fill="#00695c">中4 = 3 路低功率负载 + Y4 灯光模式逻辑LED + DI读键5-6</text>
    <text x="40" y="412">· Y1 上水泵（切外部继电器 12V 线圈）、Y2 电控水阀、Y3 后窗排气扇 —— 5A 规格，不得接 10A 负载</text>
    <text x="40" y="434">· 负载接法：COM = 保险盒正极、NO = 负载正极、NC = 空（同中8 负载接法）</text>
    <text x="40" y="456">· DI：X1(键5冰箱)、X2(键6灯光模式)，X3/X4 预留未来分散按钮</text>
    <text x="40" y="478">· Y4 = 灯光模式「逻辑LED」（吸地开关）：COM=LED阴、NO=GND、阳极=+12V（16DO 已退役）</text>
  </g>

  <rect x="720" y="378" width="640" height="150" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="2"/>
  <text x="740" y="402" font-size="12.5" font-weight="bold" fill="#0d47a1">DI 主干位定义（主控键5-6 经主干到汇总排）</text>
  <g font-size="10.5" fill="#333">
    <text x="740" y="424">主干位1黑=GND（并电源负）· 主干位2红=+12V（控+）</text>
    <text x="740" y="442">中4.DI1(键5冰箱NO)→主干位11 · 中4.DI2(键6灯光NO)→主干位12</text>
    <text x="740" y="460">中4.DI3/DI4(预留)→主干位13/14 · 搬干接点到中门柜汇总排 DI9-12</text>
    <text x="740" y="478">键5-6 的 LED 阴：有负载的键**负载侧直连**（并到该路 Y 的 NO）；场景键才占用模块 DO</text>
    <line x1="740" y1="488" x2="1340" y2="488" stroke="#e0e0e0" stroke-width="1.5"/>
    <text x="740" y="504" font-size="10.5" font-weight="bold" fill="#00695c">键5-6 → 主控复合线</text>
    <text x="740" y="520" fill="#555">键5(冰箱)LED 并到中8.Y6 NO；键6(灯光模式)无负载可并 → 本模块 Y4 逻辑LED（决4）</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="566" width="1320" height="180" rx="10" fill="#fffde7" fill-opacity="0.85" stroke="#f9a825" stroke-width="2"/>
  <text x="64" y="594" font-size="14" font-weight="bold" fill="#f57f17">中4 要点</text>
  <text x="64" y="622" font-size="12.5" fill="#333">◆ Y1/Y2/Y3 = 负载（泵线圈/水阀/后窗扇，5A）；Y4 = 灯光模式逻辑LED</text>
  <text x="64" y="646" font-size="12.5" fill="#333">◆ 供电 VCC+红/GND-黑 从箱内「控B/控D」跨箱引出；485 A=白 B=黑，485GND 独立，屏蔽单端</text>
  <text x="64" y="670" font-size="12.5" fill="#333">◆ DI：X1键5冰箱(主干位11深绿)、X2键6灯光(主干位12棕)；X3/X4 预留未来按钮(主干位13/14)</text>
  <text x="64" y="694" font-size="12.5" fill="#333">⚠ 逻辑LED 接法：Y4.COM = LED 阴极（经 1~3.3kΩ）、Y4.NO = GND、LED 阳极 = +12V 控+；Y4 吸合=灯亮</text>
  <text x="64" y="722" font-size="10.5" fill="#78909c">LED 主策略（决4）：有负载的键 → LED 并到负载 NO（负载侧直连）；无负载可并的场景键 → 空余 DO 做逻辑LED。16DO 已退役备用。完整分配见 switch-assignment.md「决4 终局接线表」。</text>
</svg>
