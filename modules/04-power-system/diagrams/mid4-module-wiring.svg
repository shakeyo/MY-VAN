  <text x="700" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">中4 模块 · 未来负载扩展 + DI · 对线接线图（上半端子 · 下半说明）</text>
  <text x="700" y="58" text-anchor="middle" font-size="12.5" fill="#666">中4 = 3路低功率负载(5A·泵线圈/水阀/后窗扇) + Y4 灯光模式逻辑LED + DI读键5-6 · 485=对绞黑白 · 电源=红黑</text>

  <!-- ============ 上半：继电器 Y1~Y4（3 路负载 + 1 路逻辑 LED） ============ -->
  <text x="40" y="92" font-size="14" font-weight="bold" fill="#4527a0">【上排】Y1 上水泵线圈 · Y2 电控水阀 · Y3 后窗排气扇 · Y4 灯光模式LED（逻辑LED · COM/NO 见卡）</text>

  <g font-size="10" text-anchor="middle">
    <rect x="40" y="104" width="300" height="92" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="190" y="122" font-size="12" font-weight="bold" fill="#4527a0">Y1 · 上水泵（线圈）</text>
    <text x="190" y="140" fill="#c62828">NO = 外部继电器 12V 线圈+</text>
    <text x="190" y="156" fill="#c62828">COM = F12-1+（控制电源）</text>
    <text x="190" y="172" fill="#999">NC = 空</text>
    <text x="190" y="188" font-size="8" fill="#78909c">48V 动力侧由外部继电器隔离</text>

    <rect x="348" y="104" width="300" height="92" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="498" y="122" font-size="12" font-weight="bold" fill="#4527a0">Y2 · 电控水阀</text>
    <text x="498" y="140" fill="#c62828">NO = 水阀+ 红0.75</text>
    <text x="498" y="156" fill="#c62828">COM = F12-1+ 红1.0</text>
    <text x="498" y="172" fill="#999">NC = 空</text>
    <text x="498" y="188" font-size="8" fill="#78909c">12V 常闭球阀 · 入口键1</text>

    <rect x="656" y="104" width="300" height="92" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="806" y="122" font-size="12" font-weight="bold" fill="#4527a0">Y3 · 后窗排气扇</text>
    <text x="806" y="140" fill="#c62828">NO = 排气扇+ 红1.0</text>
    <text x="806" y="156" fill="#c62828">COM = F12-3+ 红0.75</text>
    <text x="806" y="172" fill="#999">NC = 空</text>
    <text x="806" y="188" font-size="8" fill="#78909c">4 小风扇 · 排气扇场景键</text>

    <rect x="964" y="104" width="300" height="92" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="1114" y="122" font-size="12" font-weight="bold" fill="#e65100">Y4 · 灯光模式LED</text>
    <text x="1114" y="140" fill="#e65100">COM = LED阴(串 1~3.3kΩ)</text>
    <text x="1114" y="156" fill="#333">NO = GND 黑</text>
    <text x="1114" y="172" fill="#999">NC = 空</text>
    <text x="1114" y="188" font-size="8" fill="#9e9e9e">逻辑LED · LED阳极→+12V控+</text>
  </g>

  <text x="40" y="220" font-size="14" font-weight="bold" fill="#1565c0">【下排】数字量输入 X4~X1（DI）· DI-COM · A B · 485GND · 电源</text>

  <g font-size="9" text-anchor="middle">
