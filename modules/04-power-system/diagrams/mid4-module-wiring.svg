  <!-- ============ 下半：接线说明 ============ -->
  <text x="40" y="366" font-size="15" font-weight="bold" fill="#f57f17">接线说明</text>

  <g font-size="11" fill="#333">
    <text x="40" y="390" font-size="12.5" font-weight="bold" fill="#00695c">中4 = 未来负载扩展（4路DO·10A）+ DI读键5-6</text>
    <text x="40" y="412">· Y1-Y4 现空，留给未来负载（配电箱 DO 全给负载，稀缺资源藏墙不拆）</text>
    <text x="40" y="434">· 未来负载接法：COM = 保险盒正极、NO = 负载正极、NC = 空（同中8 负载接法）</text>
    <text x="40" y="456">· DI：X1(键5冰箱)、X2(键6灯光模式)，X3/X4 预留未来分散按钮</text>
    <text x="40" y="478">· LED 不接中4（LED 全走 16DO 模块），中4 的 DO 只做负载</text>
  </g>

  <rect x="720" y="378" width="640" height="150" rx="8" fill="#ffffff" stroke="#b0bec5" stroke-width="2"/>
  <text x="740" y="402" font-size="12.5" font-weight="bold" fill="#0d47a1">8P 短线线色定义（主控键5-6）</text>
  <g font-size="10.5" fill="#333">
    <text x="740" y="424">位1黑=GND（并电源负）· 位2红=+12V（并电源正）</text>
    <text x="740" y="442">位3白=键5冰箱NO→X1 · 位4黄=键6灯光NO→X2</text>
    <text x="740" y="460">位5灰=键5LED阴(→16DO.Y9) · 位6棕=键6LED阴(→16DO.Y10)</text>
    <text x="740" y="478">位7绿=备用（空）· 位8蓝=备用（空）</text>
    <line x1="740" y1="488" x2="1340" y2="488" stroke="#e0e0e0" stroke-width="1.5"/>
    <text x="740" y="504" font-size="10.5" font-weight="bold" fill="#00695c">按键 → 8P</text>
    <text x="740" y="520" fill="#555">键5单色：白→位3 · COM并 · 红→阳极并 · 黑→位5（LED阴→16DO.Y9冰箱LED）</text>
  </g>

  <!-- 底部 -->
  <rect x="40" y="566" width="1320" height="180" rx="10" fill="#fffde7" fill-opacity="0.85" stroke="#f9a825" stroke-width="2"/>
  <text x="64" y="594" font-size="14" font-weight="bold" fill="#f57f17">中4 要点</text>
  <text x="64" y="622" font-size="12.5" fill="#333">◆ Y1-Y4 = 未来负载(10A)，现在全空；配电箱 DO 稀缺，全留负载，不接 LED</text>
  <text x="64" y="646" font-size="12.5" fill="#333">◆ 供电 VCC+红/GND-黑 从箱内「控B/控D」跨箱引出；485 A=白 B=黑，485GND 独立，屏蔽单端</text>
  <text x="64" y="670" font-size="12.5" fill="#333">◆ DI：X1键5冰箱(8P位3白)、X2键6灯光(8P位4黄)；X3/X4 预留未来按钮</text>
  <text x="64" y="694" font-size="12.5" fill="#333">⚠ 8P位5/6 是 LED 阴（键5→16DO.Y9、键6→16DO.Y10），别当 DI 接；LED 全在 16DO</text>
  <text x="64" y="722" font-size="10.5" fill="#78909c">中4 的 Y1-4 只做负载，不含 LED。完整分配见 switch-assignment.md「LED策略」。</text>
</svg>
