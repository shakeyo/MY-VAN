    <rect x="524" y="232" width="44" height="100" rx="3" fill="#fff" stroke="#111" stroke-width="2.5"/>
    <text x="546" y="252" font-size="9" font-weight="bold" fill="#111">GND-</text>
    <circle cx="546" cy="276" r="7" fill="#263238"/>
    <text x="546" y="298" font-size="7.5" fill="#111">黑0V</text>
    <text x="546" y="322" font-size="7" fill="#78909c">控D跨箱</text>
