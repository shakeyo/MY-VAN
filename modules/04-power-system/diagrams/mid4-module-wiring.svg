    <text x="1114" y="192" font-size="8" fill="#9e9e9e">10A · 现空</text>
  </g>

  <text x="40" y="220" font-size="14" font-weight="bold" fill="#1565c0">【下排】数字量输入 X4~X1（DI）· DI-COM · A B · 485GND · 电源</text>

  <g font-size="9" text-anchor="middle">
    <rect x="40" y="232" width="52" height="100" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="66" y="252" font-size="10" font-weight="bold" fill="#0d47a1">X4</text>
    <text x="66" y="270" font-size="8" fill="#333">DI4</text>
    <text x="66" y="296" font-size="7.5" fill="#9e9e9e">预留</text>
    <text x="66" y="310" font-size="7.5" fill="#9e9e9e">空</text>

    <rect x="100" y="232" width="52" height="100" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="126" y="252" font-size="10" font-weight="bold" fill="#0d47a1">X3</text>
    <text x="126" y="270" font-size="8" fill="#333">DI3</text>
    <text x="126" y="296" font-size="7.5" fill="#9e9e9e">预留</text>
    <text x="126" y="310" font-size="7.5" fill="#9e9e9e">空</text>

    <rect x="160" y="232" width="52" height="100" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="186" y="252" font-size="10" font-weight="bold" fill="#0d47a1">X2</text>
    <text x="186" y="270" font-size="8" fill="#333">DI2</text>
    <circle cx="172" cy="286" r="7" fill="#fbc02d" stroke="#f57f17"/>
    <text x="186" y="304" font-size="7.5" fill="#e65100">8P位4</text>
    <text x="186" y="318" font-size="7.5" fill="#e65100">黄</text>
    <text x="186" y="330" font-size="7" fill="#78909c">键6灯光</text>

    <rect x="220" y="232" width="52" height="100" rx="3" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5"/>
    <text x="246" y="252" font-size="10" font-weight="bold" fill="#0d47a1">X1</text>
    <text x="246" y="270" font-size="8" fill="#333">DI1</text>
    <circle cx="232" cy="286" r="7" fill="#ffffff" stroke="#999"/>
    <text x="246" y="304" font-size="7.5" fill="#424242">8P位3</text>
    <text x="246" y="318" font-size="7.5" fill="#424242">白</text>
    <text x="246" y="330" font-size="7" fill="#78909c">键5冰箱</text>

    <rect x="280" y="232" width="52" height="100" rx="3" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
    <text x="306" y="252" font-size="8.5" font-weight="bold" fill="#37474f">DI-COM</text>
    <text x="306" y="278" font-size="7" fill="#555">输入公共</text>
    <circle cx="292" cy="298" r="7" fill="#263238"/>
    <text x="306" y="318" font-size="7" fill="#333">GND黑</text>
    <text x="306" y="332" font-size="7" fill="#78909c">8P位1</text>

    <!-- 485 A B GND -->
    <rect x="340" y="232" width="34" height="100" rx="3" fill="#fff" stroke="#00897b" stroke-width="2"/>
    <text x="357" y="256" font-size="11" font-weight="bold" fill="#00695c">A</text>
