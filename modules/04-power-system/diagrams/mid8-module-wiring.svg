  <text x="700" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">中8 模块 · 纯负载 · 对线接线图（上半端子 · 下半说明）</text>
  <text x="700" y="58" text-anchor="middle" font-size="12.5" fill="#666">中8 = 纯负载模块(7路负载) · 485=对绞黑白 · 电源=红黑 · Y4 上水泵走48V(隔离触点已实测) · 色点=线色</text>

