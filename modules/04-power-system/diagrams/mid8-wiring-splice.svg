<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="700" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">全车接线 · 并线点总表（决4：LED 负载侧直连为主）</text>
  <text x="700" y="60" text-anchor="middle" font-size="12.5" fill="#666">并线点只剩 GND/VCC 公共端 · 负载在中8/中4 · 按键 LED 负载侧直连、场景键逻辑 LED(中8.Y8/中4.Y4) · DI 一芯对一口</text>

  <!-- ============ 左：负载模块（中8） ============ -->
  <text x="60" y="100" font-size="15" font-weight="bold" fill="#4527a0">① 负载模块（中8 · 7 路负载 + Y8 离车驻车逻辑LED）</text>

  <g font-size="10" text-anchor="middle">
    <rect x="60" y="116" width="250" height="86" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="185" y="136" font-size="12" font-weight="bold" fill="#4527a0">Y1 主灯(12V)</text>
    <text x="185" y="156" fill="#333">COM=F12-2+ · NO=主灯+ · NC=空</text>
    <text x="185" y="176" font-size="8.5" fill="#78909c">LED 并到 Y1.NO（直连·无需固件）</text>

    <rect x="320" y="116" width="250" height="86" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="445" y="136" font-size="12" font-weight="bold" fill="#4527a0">Y2 氛围(12V)</text>
    <text x="445" y="156" fill="#333">COM=F12-2+ · NO=氛围+×4 · NC=空</text>
    <text x="445" y="176" font-size="8.5" fill="#78909c">LED 并到 Y2.NO（直连·无需固件）</text>

    <rect x="580" y="116" width="250" height="86" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="705" y="136" font-size="12" font-weight="bold" fill="#4527a0">Y3 排气扇(12V)</text>
    <text x="705" y="156" fill="#333">COM=F12-3+ · NO=排气扇+ · NC=空</text>
    <text x="705" y="176" font-size="8.5" fill="#78909c">LED 并到 Y3.NO（直连·无需固件）</text>

    <rect x="840" y="116" width="250" height="86" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
    <text x="965" y="136" font-size="12" font-weight="bold" fill="#e65100">Y4 上水泵(48V)</text>
    <text x="965" y="156" fill="#b71c1c" font-weight="bold">COM=F48-2+ · NO=泵+ · NC=空</text>
    <text x="965" y="176" font-size="8.5" fill="#e65100">隔离触点·续流二极管（已迁中4.Y1 切线圈）</text>
  </g>

  <g font-size="10" text-anchor="middle">
    <rect x="60" y="214" width="250" height="60" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="185" y="236" font-size="11" font-weight="bold" fill="#4527a0">Y5 水阀(12V)</text>
    <text x="185" y="256" fill="#333">COM=F12-1+ · NO=水阀+（LED 并 NO）</text>

    <rect x="320" y="214" width="250" height="60" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="445" y="236" font-size="11" font-weight="bold" fill="#4527a0">Y6 冰箱(12V)</text>
    <text x="445" y="256" fill="#333">COM=F12-4+ · NO=冰箱+（LED 并 NO）</text>

    <rect x="580" y="214" width="250" height="60" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="705" y="236" font-size="11" font-weight="bold" fill="#4527a0">Y7 倒车灯(12V)</text>
    <text x="705" y="256" fill="#333">COM=F12-6+ · NO=倒车灯+(拉线到车尾)</text>

    <rect x="840" y="214" width="250" height="60" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="965" y="236" font-size="11" font-weight="bold" fill="#e65100">Y8 离车驻车逻辑LED</text>
    <text x="965" y="256" fill="#e65100">COM=LED阴 · NO=GND（吸地开关）</text>
  </g>

  <!-- ============ 右：LED 模块（16DO） ============ -->
  <text x="60" y="320" font-size="15" font-weight="bold" fill="#00695c">② LED 接法（决4 终局）：负载侧直连为主 + 2 个场景键逻辑 LED（16DO 已退役，不上总线）</text>

  <g font-size="10" text-anchor="middle">
    <rect x="60" y="336" width="290" height="70" rx="5" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="205" y="356" font-size="11" font-weight="bold" fill="#1b5e20">① 负载侧直连（有负载的键全走这里）</text>
    <text x="205" y="374" fill="#333">LED+→+12V控+ · LED阴→1~3.3kΩ→该路 Y.NO</text>
    <text x="205" y="392" font-size="8" fill="#2e7d32">不占模块通道 · 灯亮 = 负载真实得电</text>

    <rect x="370" y="336" width="290" height="70" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="515" y="356" font-size="11" font-weight="bold" fill="#e65100">② 中8.Y8 离车/驻车 逻辑LED</text>
    <text x="515" y="374" fill="#333">Y.COM=LED阴(电阻) · Y.NO=GND</text>
    <text x="515" y="392" font-size="8" fill="#e65100">场景键·无负载可并（线圈 0x0007）</text>

    <rect x="680" y="336" width="290" height="70" rx="5" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
    <text x="825" y="356" font-size="11" font-weight="bold" fill="#e65100">③ 中4.Y4 灯光模式 逻辑LED</text>
    <text x="825" y="374" fill="#333">Y.COM=LED阴(电阻) · Y.NO=GND</text>
    <text x="825" y="392" font-size="8" fill="#e65100">场景键·无负载可并（线圈 0x0003）</text>
  </g>

  <!-- ============ 旧同步箭头（已作废，保留仅为历史对照：决4 后 LED 并在负载 NO，无需软件同步） ============ -->
  <text x="60" y="440" font-size="15" font-weight="bold" fill="#0d47a1">③ 说明：有负载的键 → LED 与负载物理同点（无需固件同步）；只有 2 个场景键的逻辑 LED 由固件开关</text>
  <text x="700" y="298" font-size="10" fill="#b71c1c">↑ 虚线 = 旧 16DO 集中方案（已作废）；现行 LED 直接并在负载 Y 的 NO 上</text>

  <!-- ============ 底部：并线点总表 ============ -->
  <rect x="60" y="480" width="1280" height="430" rx="10" fill="#fffde7" fill-opacity="0.85" stroke="#f9a825" stroke-width="2"/>
  <text x="84" y="508" font-size="14" font-weight="bold" fill="#f57f17">并线点总表（全车只有这些，其余一律独立压接）</text>

  <text x="84" y="540" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">DI 主干 GND</tspan>：主干位1黑（公共 COM）+ 电源负 → 并1（干接点公共地）</text>
  <text x="84" y="564" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">中门柜汇总排 +12V</tspan>：主干位2红（从控+取）+ 各面板 LED 阳极 → 并到汇总排 +12V</text>
  <text x="84" y="588" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">汇总排 GND</tspan>：DI 公共 GND 与逻辑 LED 的 Y.NO 公共 GND 合并为一个 GND 端子（可拆）</text>
  <text x="84" y="612" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">按键 LED 并接点</tspan>：LED 阴极电阻后并到该路负载继电器 Y 的 NO（就近压同一端子，随负载线一起走）</text>
  <text x="84" y="636" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">中8/中4 模块供电</tspan>：模块 VCC/GND 仍在配电箱内并电源（控+），不随 DI 主干搬</text>

  <line x1="84" y1="654" x2="1320" y2="654" stroke="#e0e0e0" stroke-width="1.5"/>

  <text x="84" y="680" font-size="13" font-weight="bold" fill="#b71c1c">❌ 严禁并线：</text>
  <text x="84" y="704" font-size="12.5" fill="#333">· DI（X1~X8 / 中4 X1-X2）：一芯对一口，绝不两键 DI 拧一起（会串扰误触发）</text>
  <text x="84" y="728" font-size="12.5" fill="#333">· LED 阴极：每颗按钮的 LED 阴独立，各自并到对应负载 Y 的 NO（场景键各接各的逻辑 LED，不并线）</text>
  <text x="84" y="752" font-size="12.5" fill="#333">· 485 A/B：单飞对绞，绝不并联到其他线；NC 触点一律空着</text>

  <text x="84" y="788" font-size="12.5" fill="#333">⚠ 焊并做法：剥皮→拧股→焊透→热缩管包到根部→冷压端子→单线压模块口（并点在模块端几 cm 内）</text>
  <text x="84" y="812" font-size="12.5" fill="#333">⚠ 双控泵两键（入口键3、主控键4）：两颗 LED 各自并到 中4.Y1 的 NO（同一负载点），天然同亮同灭，无需固件同步</text>
  <text x="84" y="836" font-size="10.5" fill="#78909c">裸LED每色串1-3.3kΩ电阻；48V上水泵续流二极管1N5408阴极朝正；隔离触点已实测。完整定义见 switch-assignment.md。</text>
</svg>
