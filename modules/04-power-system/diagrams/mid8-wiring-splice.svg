<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980" font-family="sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <text x="700" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">全车接线 · 并线点与同步逻辑（负载/LED 分离，ESPhome 软件同步）</text>
  <text x="700" y="60" text-anchor="middle" font-size="12.5" fill="#666">并线点只剩 GND/VCC 公共端 · 负载在中8/中4、LED 全在 16DO · DI 一芯对一口</text>

  <!-- ============ 左：负载模块（中8） ============ -->
  <text x="60" y="100" font-size="15" font-weight="bold" fill="#4527a0">① 负载模块（中8 · 7 路负载 + 预留，不塞 LED）</text>

  <g font-size="10" text-anchor="middle">
    <rect x="60" y="116" width="250" height="86" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="185" y="136" font-size="12" font-weight="bold" fill="#4527a0">Y1 主灯(12V)</text>
    <text x="185" y="156" fill="#333">COM=F12-2+ · NO=主灯+ · NC=空</text>
    <text x="185" y="176" font-size="8.5" fill="#78909c">LED 走 16DO.Y5（主控键1）</text>

    <rect x="320" y="116" width="250" height="86" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="445" y="136" font-size="12" font-weight="bold" fill="#4527a0">Y2 氛围(12V)</text>
    <text x="445" y="156" fill="#333">COM=F12-2+ · NO=氛围+×4 · NC=空</text>
    <text x="445" y="176" font-size="8.5" fill="#78909c">LED 走 16DO.Y6（主控键2）</text>

    <rect x="580" y="116" width="250" height="86" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="705" y="136" font-size="12" font-weight="bold" fill="#4527a0">Y3 排气扇(12V)</text>
    <text x="705" y="156" fill="#333">COM=F12-3+ · NO=排气扇+ · NC=空</text>
    <text x="705" y="176" font-size="8.5" fill="#78909c">LED 走 16DO.Y7（主控键3）</text>

    <rect x="840" y="116" width="250" height="86" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="2"/>
    <text x="965" y="136" font-size="12" font-weight="bold" fill="#e65100">Y4 上水泵(48V)</text>
    <text x="965" y="156" fill="#b71c1c" font-weight="bold">COM=F48-2+ · NO=泵+ · NC=空</text>
    <text x="965" y="176" font-size="8.5" fill="#e65100">隔离触点·续流二极管·LED走16DO.Y3+Y8</text>
  </g>

  <g font-size="10" text-anchor="middle">
    <rect x="60" y="214" width="250" height="60" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="185" y="236" font-size="11" font-weight="bold" fill="#4527a0">Y5 水阀(12V)</text>
    <text x="185" y="256" fill="#333">COM=F12-1+ · NO=水阀+（LED→16DO.Y1）</text>

    <rect x="320" y="214" width="250" height="60" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="445" y="236" font-size="11" font-weight="bold" fill="#4527a0">Y6 冰箱(12V)</text>
    <text x="445" y="256" fill="#333">COM=F12-4+ · NO=冰箱+（LED→16DO.Y9）</text>

    <rect x="580" y="214" width="250" height="60" rx="5" fill="#f3e5f5" stroke="#5e35b1" stroke-width="2"/>
    <text x="705" y="236" font-size="11" font-weight="bold" fill="#4527a0">Y7 倒车灯(12V)</text>
    <text x="705" y="256" fill="#333">COM=F12-6+ · NO=倒车灯+(拉线到车尾)</text>

    <rect x="840" y="214" width="250" height="60" rx="5" fill="#f5f5f5" stroke="#9e9e9e" stroke-width="2"/>
    <text x="965" y="236" font-size="11" font-weight="bold" fill="#757575">Y8 预留</text>
    <text x="965" y="256" fill="#999">未来扩展负载（中4.Y1-4 也留负载）</text>
  </g>

  <!-- ============ 右：LED 模块（16DO） ============ -->
  <text x="60" y="320" font-size="15" font-weight="bold" fill="#00695c">② LED 指示模块（16DO 16路，一个485地址，全部 LED，吸地开关）</text>

  <g font-size="10" text-anchor="middle">
    <rect x="60" y="336" width="180" height="70" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="150" y="356" font-size="11" font-weight="bold" fill="#00695c">Y1-Y4 入口LED</text>
    <text x="150" y="374" fill="#333">排水/户外灯/泵/离车驻车</text>
    <text x="150" y="392" font-size="8" fill="#00897b">COM=LED阴 · NO=GND</text>

    <rect x="250" y="336" width="180" height="70" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="340" y="356" font-size="11" font-weight="bold" fill="#00695c">Y5-Y8 主控1-4LED</text>
    <text x="340" y="374" fill="#333">主灯/氛围/排气扇/泵</text>
    <text x="340" y="392" font-size="8" fill="#00897b">COM=LED阴 · NO=GND</text>

    <rect x="440" y="336" width="180" height="70" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="530" y="356" font-size="11" font-weight="bold" fill="#00695c">Y9-Y10 主控5-6LED</text>
    <text x="530" y="374" fill="#333">冰箱/灯光模式(单色)</text>
    <text x="530" y="392" font-size="8" fill="#00897b">COM=LED阴 · NO=GND</text>

    <rect x="630" y="336" width="180" height="70" rx="5" fill="#e0f2f1" stroke="#00897b" stroke-width="2"/>
    <text x="720" y="356" font-size="11" font-weight="bold" fill="#00695c">Y11-Y16 车尾+预留</text>
    <text x="720" y="374" fill="#333">车尾2键 + 未来按钮4</text>
    <text x="720" y="392" font-size="8" fill="#00897b">COM=LED阴 · NO=GND</text>
  </g>

  <!-- ============ 软件同步箭头 ============ -->
  <text x="60" y="440" font-size="15" font-weight="bold" fill="#0d47a1">③ 同步关系（ESPhome 软件绑定，物理上负载与 LED 分离）</text>
  <g stroke="#1565c0" stroke-width="3" fill="none" stroke-dasharray="6,4">
    <line x1="185" y1="202" x2="150" y2="336" marker-end="url(#arrow)"/>
    <line x1="445" y1="202" x2="340" y2="336" marker-end="url(#arrow)"/>
    <line x1="705" y1="202" x2="530" y2="336" marker-end="url(#arrow)"/>
    <line x1="965" y1="202" x2="720" y2="336" marker-end="url(#arrow)"/>
  </g>
  <text x="560" y="270" font-size="10.5" fill="#1565c0">负载 Y 吸合 → 软件同时驱动 16DO 对应 LED Y 吸合 → 灯亮=设备开</text>

  <!-- ============ 底部：并线点总表 ============ -->
  <rect x="60" y="480" width="1280" height="430" rx="10" fill="#fffde7" fill-opacity="0.85" stroke="#f9a825" stroke-width="2"/>
  <text x="84" y="508" font-size="14" font-weight="bold" fill="#f57f17">并线点总表（全车只有这些，其余一律独立压接）</text>

  <text x="84" y="540" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">中8 GND</tspan>：14A芯1黑 + 14B芯1黑 + 电源负 → 3并1</text>
  <text x="84" y="564" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">中8 VCC</tspan>：14A芯2红 + 14B芯2红 + 电源正 → 3并1</text>
  <text x="84" y="588" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">LED 共阳（16DO）</tspan>：入口4键红 + 主控6键红 → 并到 +12V 控+（公共阳极）</text>
  <text x="84" y="612" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">16DO GND</tspan>：所有 LED Y.NO 端 → 并到模块 GND</text>
  <text x="84" y="636" font-size="12.5" fill="#333">✅ <tspan font-weight="bold">中4 GND/12V</tspan>：8P位1黑+电源负、8P位2红+电源正 → 各2并1</text>

  <line x1="84" y1="654" x2="1320" y2="654" stroke="#e0e0e0" stroke-width="1.5"/>

  <text x="84" y="680" font-size="13" font-weight="bold" fill="#b71c1c">❌ 严禁并线：</text>
  <text x="84" y="704" font-size="12.5" fill="#333">· DI（X1~X8 / 中4 X1-X2）：一芯对一口，绝不两键 DI 拧一起（会串扰误触发）</text>
  <text x="84" y="728" font-size="12.5" fill="#333">· LED 阴极：每颗按钮的 LED 阴独立，各接各的 16DO Y（双控泵是 Y3/Y8 两颗独立 LED，软件同步，不并线）</text>
  <text x="84" y="752" font-size="12.5" fill="#333">· 485 A/B：单飞对绞，绝不并联到其他线；NC 触点一律空着</text>

  <text x="84" y="788" font-size="12.5" fill="#333">⚠ 焊并做法：剥皮→拧股→焊透→热缩管包到根部→冷压端子→单线压模块口（并点在模块端几 cm 内）</text>
  <text x="84" y="812" font-size="12.5" fill="#333">⚠ 双控泵两键（入口键3、主控键4）各一颗 LED → 16DO.Y3 和 16DO.Y8，ESPhome 软件让它们一起亮灭，物理上不并线</text>
  <text x="84" y="836" font-size="10.5" fill="#78909c">裸LED每色串1-3.3kΩ电阻；48V上水泵续流二极管1N5408阴极朝正；隔离触点已实测。完整定义见 switch-assignment.md。</text>
</svg>
